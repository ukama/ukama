# Latest value per key for one node, from the metrics gateway's instant
# endpoint. For rail values that have no chart, such as uptime.

query MetricsLast($data: MetricsLastInput!) {
  metricsLast(data: $data) {
    error {
      ...SectionErrorFields
    }
    metrics {
      key
      value
      timestamp
      success
      label
      unit
      format
    }
  }
}
