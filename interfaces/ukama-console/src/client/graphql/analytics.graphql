# Analytics documents, backed by the console-bff `analytics` subgraph, which is
# a thin wrapper over the analytics gateway's generic KPI read API:
#   - getKpiValues        -> latest rollup value per KPI/scope for a span, with
#                            a period-over-period trend. Read values by key via
#                            kpiByKey/kpiAmount (src/lib/kpis.ts).
#   - getPerformanceReport -> a resource performance table (per-entity rows with
#                            KPI columns), e.g. the `package_performance` report.
# KPI keys live in src/lib/kpis.ts (KPI_KEYS); an absent/not-yet-emitted key
# degrades to "—". See systems/analytics/aggregator/configs for the registry.

fragment KpiValueFields on KpiValueDto {
  kpi
  value
  span
  unit
  symbol
  isPartial
  trend {
    direction
    changePct
    changeAbs
    prevValue
    hasPrevious
  }
}

fragment ReportCellFields on ReportCellDto {
  column
  value
  unit
  symbol
  format
}

# Latest KPI values for a set of keys at a span (optionally network-scoped).
# Used by every KPI strip (Business Home / Revenue / Packages, Network Home).
query GetKpiValues($data: KpiValuesInput!) {
  getKpiValues(data: $data) {
    values {
      ...KpiValueFields
    }
  }
}

# KPI time series: one value per span bucket over [from, to). Each value
# carries its own from/to so points can be placed on the time axis. Used by
# the Site detail uptime card (SITE_UPTIME, span=daily, siteId-scoped).
query GetKpiTimeSeries($data: KpiTimeSeriesInput!) {
  getKpiTimeSeries(data: $data) {
    values {
      kpi
      value
      span
      op
      from
      to
      unit
      symbol
      isPartial
    }
  }
}

# Resource performance table. Packages screen passes report: "package_performance"
# to get per-package rows (attributes: name/price/validity/active; cells:
# sold/revenue/data_used).
query GetPerformanceReport($data: PerformanceReportInput!) {
  getPerformanceReport(data: $data) {
    report
    title
    span
    rows {
      entityId
      status
      attributes {
        key
        value
      }
      cells {
        ...ReportCellFields
      }
    }
  }
}
