# Operation-lock status for node/site actions. The BFF aggregates per-node
# locks (keyed node:<id>) into a page-friendly shape; the console polls these
# and renders busy/available. See OPERATION-LOCK-PLAN.md.

fragment OperationFields on OperationDto {
  id
  type
  status
  requestedBy
  startedAt
  leaseExpiresAt
}

query GetNodeOperationStatus($nodeId: String!) {
  getNodeOperationStatus(data: { nodeId: $nodeId }) {
    nodeId
    busy
    operation {
      ...OperationFields
    }
  }
}

query GetSiteOperationStatus($siteId: String!) {
  getSiteOperationStatus(data: { siteId: $siteId }) {
    siteId
    busy
    degraded
    nodes {
      nodeId
      type
      busy
      operation {
        ...OperationFields
      }
    }
    actions {
      restartSite {
        available
        reason
      }
      rf {
        available
        reason
      }
      service {
        available
        reason
      }
    }
  }
}
