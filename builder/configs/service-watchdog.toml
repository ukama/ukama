[build-from]
	rootfs="default"
	contained="default"

[build-compile]
	version="0.1"
	static="false"
	source="/nodes/apps/service-watchdog"
	cmd="make"
	bin_from="/nodes/apps/service-watchdog/service-watchdog"
	bin_to="/sbin"

[capp-exec]
	name="service-watchdog"
	version="latest"
	bin="service-watchdog"
	path="/sbin"

[capp-output]
	format="tar.gz"
