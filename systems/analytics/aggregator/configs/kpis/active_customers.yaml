# ACTIVE_CUSTOMERS: SIMs in active service per network, read from the metrics
# system's active_sim_count gauge (sim-manager recounts from its DB and pushes
# it per network on every sim lifecycle change). One SIM per subscriber, so
# this is also the count of customers with service on.
#
# network_id is the only scope: the gauge carries no other dimension.
kpi: ACTIVE_CUSTOMERS
domain: subscriber
algo: network_sim_count@v1
kind: gauge
scope_agg: sum
scope: [network_id]
inputs:
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
  active:
    dataset: metrics.active_sims.last
    fields: [network_id, value]
output:
  type: int
  unit: count
  symbol: ""
positive_direction: up
