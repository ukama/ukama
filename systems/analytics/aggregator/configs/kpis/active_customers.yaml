# ACTIVE_CUSTOMERS: distinct subscribers per network with at least one
# active SIM (source-filtered via /v1/sim?network_id=&sim_status=active).
kpi: ACTIVE_CUSTOMERS
domain: subscriber
algo: active_customers@v2
scope: [network_id]
inputs:
  active_sims:
    dataset: subscriber.sim.listActive
    fields: [sim_id, subscriber_id, network_id]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: int
  unit: count
  symbol: ""
rollup_ops: [AVG, MIN, MAX, LAST]
positive_direction: up
