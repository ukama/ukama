# SITE_UPTIME (%): one availability check per window.
#
#   node = DOWN if a health flag is reported false (interfaces.radio.available;
#          interfaces.cellular.available on the tnode only), a reported state
#          is off or fault (interfaces.radio.state; interfaces.cellular.service
#          on the tnode only), or its uptime counter did not advance during
#          the window. UP otherwise, including when it has no series yet.
#   site = 100 if every tnode/anode/cnode is UP, else 0. A site with none of
#          those reads 100; an hnode is ignored.
#
# The window is the check interval and therefore the resolution.
#
# Per window: Sum = 100 or 0, Count = 1, so the aggregator's AVG is the share
# of windows the site was up for. Query with op=AVG.
kpi: SITE_UPTIME
domain: network
algo: site_uptime@v3
kind: gauge
scope_agg: avg
scope: [network_id, site_id]
inputs:
  # Site membership only; `state` and `connectivity` are not read.
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type]
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, cellular_service, radio_available, radio_state]
  # mode: window — these measure the window rather than state as of it, so a
  # failed pull reads as missing instead of inheriting the previous reading.
  com_uptime:
    dataset: metrics.com_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
  ctl_uptime:
    dataset: metrics.ctl_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
output:
  type: float
  unit: percent
  symbol: "%"
positive_direction: up
