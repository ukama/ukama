# SITE_UPTIME (%): a site is up in a window when its SERVICE and its RADIO are
# available.
#   service — digital cellular service, from the tnode health report
#             (interfaces.cellular.available); the anode has no cellular
#             interface and reports "cellular": null
#   radio   — interfaces.radio.available, on tnode and anode alike
# A node is down when either flag is false, its probe is unreachable, or it has
# never reported. A site is up when it has at least one tnode/anode and all of
# them are up; a site with no tnode/anode carries neither service nor radio and
# reads down.
# radio.state is NOT read: uptime tracks interface availability, so a radio
# that is available but switched off is still up, and there is no
# planned/unplanned distinction.
# Per window: Sum = 100 when up else 0, Count = 1 always — so the aggregator's
# AVG is exactly up_windows / total_windows x 100.
# Query with op=AVG at span daily/weekly/monthly for the timeseries.
kpi: SITE_UPTIME
domain: network
algo: site_uptime@v2
scope: [network_id, site_id]
inputs:
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available, unreachable]
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type]
output:
  type: float
  unit: percent
  symbol: "%"
rollup_ops: [AVG, MIN, MAX]
positive_direction: up
