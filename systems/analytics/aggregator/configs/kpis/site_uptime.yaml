# SITE_UPTIME (%): one availability check per window, the way check-based
# monitors compute uptime.
#
#   node = DOWN if a health flag is reported false: interfaces.cellular.available
#          (service; tnode only, as the anode reports "cellular": null) or
#          interfaces.radio.available. Otherwise DOWN if its uptime counter did
#          not advance during the window, UP if it did.
#   site = UP (100) if every tnode/anode/cnode is UP, else DOWN (0)
#
# Ingest pulls each node's uptime counter as `increase` over the window
# (floored at 60s so the range spans several scrape intervals), so the value
# is the seconds it gained: > 0 for a live node, 0 for one whose counter
# stalled — the pushgateway keeps serving a dead node's last value. A node
# with no series in the window at all reads UP: uptime is 100 by default and
# only comes down on evidence, and a series that has not appeared yet (a site
# still onboarding) is not evidence. A site carrying no tnode/anode/cnode
# reads 100; an hnode is ignored.
#
# The window is the check interval, so it is also the resolution: an outage
# that does not stop the counter for a whole window is not seen. There is no
# planned/unplanned distinction. radio.state is not read — uptime tracks
# interface availability, so a radio that is available but switched off is
# still up. Node lifecycle state and node-gateway reachability are not read
# either: the node's own counter is the authority.
#
# Per window: Sum = 100 or 0, Count = 1, so the aggregator's AVG is the share
# of windows the site was up for in any span. Query with op=AVG at
# daily/weekly/monthly or last_24h/last_7d/last_30d.
kpi: SITE_UPTIME
domain: network
algo: site_uptime@v3
kind: gauge
scope_agg: avg
scope: [network_id, site_id]
inputs:
  # Site membership only; `state` and `connectivity` are not read.
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type]
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available]
  # mode: window — these measure the window rather than state as of it, so a
  # failed pull reads as missing instead of inheriting the previous reading.
  com_uptime:
    dataset: metrics.com_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
  ctl_uptime:
    dataset: metrics.ctl_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
output:
  type: float
  unit: percent
  symbol: "%"
positive_direction: up
