# SITE_UPTIME (%): U / (U + (D - I)) x 100 per site, from the site's
# tnode/anode nodes. Registry connectivity gates node liveness (the health
# endpoint serves the node's last pushed report — stale when offline); health
# interfaces decide up vs intentionally-off for online nodes. Intentionally-
# off windows (radio available but switched off) are excluded from the
# denominator. Query with op=AVG at span daily/weekly/monthly.
kpi: SITE_UPTIME
domain: network
algo: site_uptime@v2
scope: [network_id, site_id]
inputs:
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available, radio_state, unreachable]
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type, connectivity]
output:
  type: float
  unit: percent
  symbol: "%"
rollup_ops: [AVG, MIN, MAX]
positive_direction: up
