# SITES_DEGRADED (definition v2): sites per network carrying at least one
# fault. A site is degraded when ANY of its nodes trips one of:
#   1. registry connectivity is not online — any node type, including cnode
#   2. tnode health report: cellular.available == false
#   3. tnode or anode health report: radio.available == false
#   4. tnode/anode health probe unreachable, or the node has never reported
# Rules 2-4 read node.health.interfaces (/v1/health/interfaces); cellular is a
# tnode-only interface (the anode reports "cellular": null), radio is checked
# on both. A radio that is available but switched off (radio.state == off) is
# operator intent, not a fault, and does NOT count as degraded — consistent
# with SITE_UPTIME, which excludes intentionally-off windows from downtime.
kpi: SITES_DEGRADED
domain: network
algo: sites_degraded@v2
scope: [network_id]
inputs:
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type, connectivity]
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available, radio_state, unreachable]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: int
  unit: count
  symbol: ""
rollup_ops: [AVG, MIN, MAX, LAST]
positive_direction: down
