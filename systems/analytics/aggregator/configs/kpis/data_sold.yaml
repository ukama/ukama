# DATA_SOLD: bytes of package data allowance SOLD in the window (a sales
# proxy). Sum over the window's new sim-package assignments of the assigned
# package's data volume in bytes, grouped by network. Distinct from
# USAGE_BY_NETWORK, which measures data actually CONSUMED. Sales are counted
# by first observation — see package_sales.yaml.
kpi: DATA_SOLD
domain: business
algo: data_sold@v1
kind: flow
scope: [network_id]
inputs:
  sim_packages:
    dataset: subscriber.simpackage.listBySim
    fields: [sim_package_id, package_id, network_id, created_at]
  sim_packages_prev:
    dataset: subscriber.simpackage.listBySim
    mode: state_prev
    fields: [sim_package_id]
  packages:
    dataset: dataplan.package.getAll
    fields: [package_id, network_id, data_volume, data_unit]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output: { type: float, unit: bytes, symbol: B }
positive_direction: up
