# REVENUE: payments that became settled in the window (a state transition
# against the previous window, so each counts once), attributed to a network
# via the paying SIM; unresolvable SIMs land in the org bucket. Read with
# op=SUM (collected), COUNT (purchases) or AVG (average purchase).
kpi: REVENUE
domain: business
algo: revenue@v1
kind: flow
scope: [network_id]
inputs:
  payments:
    dataset: payments.processor.list
    fields: [payment_id, amount, status, paid_at, metadata]
  # Lag-1 baseline: which payments already read settled one window ago.
  payments_prev:
    dataset: payments.processor.list
    mode: state_prev
    fields: [payment_id, status]
  sims:
    dataset: subscriber.sim.list
    fields: [sim_id, network_id]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output: { type: int, unit: cents, symbol: "$" }
positive_direction: up
