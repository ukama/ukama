# SITES_ONLINE: sites per network where every tnode, anode and cnode is
# connectivity == Online AND state == Operational — judged only on the registry
# (no health report or metric). Any other state means the node is not yet, or
# no longer, serving. A site carrying none of those node types is not online;
# any other node type attached to it (hnode) is ignored rather than allowed to
# drag it offline.
kpi: SITES_ONLINE
domain: network
algo: sites_online@v3
kind: gauge
scope_agg: sum
scope: [network_id]
inputs:
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type, connectivity, state]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: int
  unit: count
  symbol: ""
positive_direction: up
