# USAGE_BY_NETWORK: cumulative data usage (bytes) per network, from per-sim
# /v1/usages pulls WITHOUT from/to — the backend returns each sim's total
# usage to date, sampled every window. The window value is a cumulative
# counter: serve with LAST (latest total). Never SUM across windows — that
# would add cumulative readings together. Trend compares span-end totals.
kpi: USAGE_BY_NETWORK
domain: subscriber
algo: usage_by_network@v1
scope: [network_id]
inputs:
  usage:
    dataset: subscriber.usage.getBySim
    fields: [sim_id, network_id, usage]
    mode: window
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: float
  unit: bytes
  symbol: B
rollup_ops: [LAST, MAX, AVG]
positive_direction: up
