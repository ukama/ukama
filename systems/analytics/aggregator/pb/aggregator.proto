syntax = "proto3";

option go_package = "github.com/ukama/ukama/systems/analytics/aggregator/pb/gen";

package ukama.analytics.aggregator.v1;

// AggregatorService is the generic KPI read API: no per-KPI RPCs — adding a
// KPI requires no changes here.
service AggregatorService {
    // ListKpis returns the KPI registry (self-describing catalog).
    rpc ListKpis(ListKpisRequest) returns (ListKpisResponse);

    // Query is the primary read API: one question shape for latest values,
    // time series and top-N breakdowns. Aggregation is derived from each
    // KPI's kind (flow|gauge) — callers never pick a fold function.
    rpc Query(QueryRequest) returns (QueryResponse);

    // GetKpis returns the latest rollup value per KPI/scope for a span.
    rpc GetKpis(GetKpisRequest) returns (GetKpisResponse);

    // GetKpiTimeSeries returns one value per span bucket over a range.
    rpc GetKpiTimeSeries(GetKpiTimeSeriesRequest) returns (GetKpiTimeSeriesResponse);

    // GetKpiBreakdown ranks scope values for one KPI (top-N).
    rpc GetKpiBreakdown(GetKpiBreakdownRequest) returns (GetKpiBreakdownResponse);

    // ListReports returns the performance report registry.
    rpc ListReports(ListReportsRequest) returns (ListReportsResponse);

    // GetPerformanceReport composes a resource performance table from the
    // latest available KPI values + entity attributes.
    rpc GetPerformanceReport(GetPerformanceReportRequest) returns (GetPerformanceReportResponse);
}

message ReportInfo {
    string report = 1;
    string title = 2;
    string resource = 3;           // entity dataset key
    repeated string columns = 4;
    repeated string attributes = 5;
}

message ListReportsRequest {
}

message ListReportsResponse {
    repeated ReportInfo reports = 1;
}

message GetPerformanceReportRequest {
    string report = 1;
    string span = 2;               // daily|weekly|monthly (default daily)
    map<string, string> scope = 3; // optional filters, e.g. network_id
    int32 top = 4;
}

message ReportCell {
    string column = 1;
    double value = 2;
    string unit = 3;
    string symbol = 4;
    string format = 5;             // display hint from the report spec
    Trend trend = 6;
    bool is_partial = 7;
    string computed_at = 8;        // RFC3339; empty when no data yet
}

message ReportRow {
    string entity_id = 1;
    map<string, string> attributes = 2;
    repeated ReportCell cells = 3;
    string status = 4;
}

message GetPerformanceReportResponse {
    string report = 1;
    string title = 2;
    string span = 3;
    repeated ReportRow rows = 4;
}

message KpiInfo {
    string kpi = 1;
    string domain = 2;
    repeated string scope = 3;
    repeated string rollup_ops = 4;
    string type = 5;
    string unit = 6;
    string symbol = 7;
    string positive_direction = 8;
    string kind = 9;      // flow|gauge — drives the default aggregation
    string scope_agg = 10; // gauges: sum|avg across scopes
}

// QueryRequest is the single question shape: KPIs + filters + dimensions +
// time range + granularity. Filters ALWAYS fold: the answer's grain is
// exactly (filter keys ∪ group_by keys).
message QueryRequest {
    repeated string kpis = 1;       // required
    map<string, string> filter = 2; // scope filters; unknown keys -> InvalidArgument
    repeated string group_by = 3;   // extra dimensions; default none -> one row per KPI
    // Relative range token: today|this_week|this_month|last_24h|last_7d|last_30d.
    // Mutually exclusive with from/to. Default: this_month.
    string range = 4;
    string from = 5;                // RFC3339 inclusive (custom range)
    string to = 6;                  // RFC3339 exclusive
    // total (default) = one point per row; day|week|month = a series of
    // calendar buckets intersecting the range.
    string granularity = 7;
    string sort = 8;                // value|-value; rows ordered by their latest point
    int32 top = 9;                  // keep only the first N rows after sorting
    // Expert override of the kind-derived aggregation: sum|avg|min|max|count.
    // Omit in normal use.
    string agg = 10;
}

message QueryPoint {
    string from = 1;  // RFC3339
    string to = 2;    // RFC3339
    double value = 3;
    Trend trend = 4;  // vs the previous point (series) or previous range (total)
    bool is_partial = 5;
}

message QueryRow {
    string kpi = 1;
    map<string, string> dims = 2; // the answer's grain: filter ∪ group_by keys
    repeated QueryPoint points = 3;
    string type = 4;
    string unit = 5;
    string symbol = 6;
}

message QueryResponse {
    repeated QueryRow rows = 1;
    string granularity = 2;
    string from = 3;
    string to = 4;
}

message ListKpisRequest {
}

message ListKpisResponse {
    repeated KpiInfo kpis = 1;
}

// Trend: day-over-day / week-over-week / month-over-month comparison.
message Trend {
    string direction = 1; // up|down|flat|new|na
    double change_pct = 2;
    double change_abs = 3;
    double prev_value = 4;
    bool has_previous = 5;
}

// KpiValue carries the metadata envelope: <KPI>: <value> plus from/to,
// type, unit, symbol, scope, partiality and trend.
message KpiValue {
    string kpi = 1;
    double value = 2;
    string span = 3;
    string op = 4;
    string from = 5; // RFC3339
    string to = 6;   // RFC3339
    string type = 7;
    string unit = 8;
    string symbol = 9;
    bool is_partial = 10;
    map<string, string> scope = 11;
    Trend trend = 12;
    string computed_at = 13;
}

message GetKpisRequest {
    repeated string keys = 1;
    string span = 2;               // daily|weekly|monthly
    string op = 3;                 // optional; defaults per KPI spec
    // Optional scope filters, e.g. network_id. Filtering also sets the
    // answer's grain: for component ops (SUM/COUNT/AVG/MIN/MAX) the matching
    // rows are folded into ONE row per distinct combination of the filter
    // keys — DATA_USAGE with scope={network_id: X} returns one total for
    // network X, not one row per sim-series. Groups with a single row pass
    // through unchanged (full scope + trend). LAST/DELTA reads stay per-row.
    map<string, string> scope = 4;
    // Optional explicit fold grain for breakdown-style reads WITHOUT a
    // filter (exact component fold — SUM/COUNT/AVG/MIN/MAX only). E.g.
    // DATA_USAGE group_by=[network_id] returns one total per network.
    // When set, it overrides the filter-derived grain above.
    repeated string group_by = 5;
}

message GetKpisResponse {
    repeated KpiValue values = 1;
}

message GetKpiTimeSeriesRequest {
    repeated string keys = 1;
    string span = 2;
    string op = 3;
    string from = 4; // RFC3339, inclusive
    string to = 5;   // RFC3339, exclusive
    map<string, string> scope = 6;
    repeated string group_by = 7;  // fold per span bucket (see GetKpisRequest)
}

message GetKpiTimeSeriesResponse {
    repeated KpiValue values = 1;
}

message GetKpiBreakdownRequest {
    string key = 1;
    string span = 2;
    string op = 3;
    string by = 4; // scope dimension to rank by, e.g. network_id
    int32 top = 5;
    // Optional scope filters applied BEFORE ranking — e.g. top packages
    // WITHIN network X: by=package_id, scope={network_id: X}.
    map<string, string> scope = 6;
}

message BreakdownRow {
    string scope_value = 1;
    double value = 2;
    Trend trend = 3;
}

message GetKpiBreakdownResponse {
    string kpi = 1;
    string span = 2;
    string op = 3;
    string from = 4;
    string to = 5;
    repeated BreakdownRow rows = 6;
}
