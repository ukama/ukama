# SITES_DEGRADED: sites per network with at least one offline node.
kpi: SITES_DEGRADED
domain: network
algo: sites_degraded@v1
scope: [network_id]
inputs:
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type, connectivity]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: int
  unit: count
  symbol: ""
rollup_ops: [AVG, MIN, MAX, LAST]
positive_direction: down
