# PAID_CUSTOMERS: distinct SIMs with a settled payment month-to-date (state
# gauge; read with op=LAST, monthly trend = "+N this month"). A customer may
# buy several packages against one SIM (several payments), so we dedupe by the
# SIM id carried in the payment metadata rather than by per-transaction payer
# contact fields.
kpi: PAID_CUSTOMERS
domain: business
algo: paid_customers@v1
scope: []
inputs:
  payments:
    dataset: payments.processor.list
    fields: [payment_id, status, paid_at, metadata]
output: { type: int, unit: count, symbol: "" }
rollup_ops: [AVG, MIN, MAX, LAST]
positive_direction: up
