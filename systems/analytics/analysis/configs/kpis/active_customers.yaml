# ACTIVE_CUSTOMERS: SIMs in active service per network, from the metrics
# system's active_sim_count gauge. One SIM per subscriber, so this is also the
# count of customers with service on.
kpi: ACTIVE_CUSTOMERS
domain: subscriber
algo: network_sim_count@v1
kind: gauge
scope_agg: sum
scope: [network_id]
inputs:
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
  active:
    dataset: metrics.active_sims.last
    fields: [network_id, value]
output:
  type: int
  unit: count
  symbol: ""
positive_direction: up
