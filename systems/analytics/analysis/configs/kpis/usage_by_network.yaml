# USAGE_BY_NETWORK: a network's CUMULATIVE data usage (bytes) as of each
# window — sum of its sims' lifetime counters (subscriber.usage.getBySim, a
# full_snapshot read mode: state). Data consumed over a span is the DELTA
# (max - min) of this cumulative across the span, computed at read time.
kpi: USAGE_BY_NETWORK
domain: subscriber
algo: usage_by_network@v2
scope: [network_id]
inputs:
  usage:
    dataset: subscriber.usage.getBySim
    fields: [sim_id, network_id, usage]
    mode: state
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: float
  unit: bytes
  symbol: B
rollup_ops: [DELTA, MAX]
positive_direction: up
