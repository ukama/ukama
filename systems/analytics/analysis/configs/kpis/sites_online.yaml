# SITES_ONLINE: sites per network whose every tnode/anode/cnode has
# connectivity Online and state Operational in the registry. A site with none
# of those types is not online; an hnode is ignored.
kpi: SITES_ONLINE
domain: network
algo: sites_online@v3
kind: gauge
scope_agg: sum
scope: [network_id]
inputs:
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type, connectivity, state]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: int
  unit: count
  symbol: ""
positive_direction: up
