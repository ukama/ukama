# SITES_ONLINE: sites per network where every tnode, anode and cnode under the
# site is online — a plain count of fully-connected sites, judged only on each
# node's registry connectivity (no health report involved). A site carrying
# none of those node types is not online; any other node type attached to the
# site (hnode) is ignored rather than allowed to drag it offline.
kpi: SITES_ONLINE
domain: network
algo: sites_online@v3
scope: [network_id]
inputs:
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type, connectivity]
  networks:
    dataset: registry.network.getAll
    fields: [network_id]
output:
  type: int
  unit: count
  symbol: ""
rollup_ops: [AVG, MIN, MAX, LAST]
positive_direction: up
