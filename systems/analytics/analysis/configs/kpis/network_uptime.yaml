# NETWORK_UPTIME (%): sites up / site count x 100, with the same per-site
# check as SITE_UPTIME.
#
# Per window: Sum = total of the sites' values, Count = site count, so the
# aggregator's AVG is weighted by (site, window) pairs.
kpi: NETWORK_UPTIME
domain: network
algo: network_uptime@v3
kind: gauge
scope_agg: avg
scope: [network_id]
inputs:
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type]
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available]
  com_uptime:
    dataset: metrics.com_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
  ctl_uptime:
    dataset: metrics.ctl_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
output:
  type: float
  unit: percent
  symbol: "%"
positive_direction: up
