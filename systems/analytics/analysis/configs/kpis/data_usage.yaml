# DATA_USAGE: bytes consumed in the window per data_usage series, as
# increment = clamp0(cur - prev) between this window's state and the previous
# one's. By-network/site/package/sim views are read-time filters and group_by
# folds. package_id is the catalog package; sim_package_id the sim's
# assignment.
kpi: DATA_USAGE
domain: subscriber
algo: data_usage@v1
kind: flow
scope: [network_id, site_id, package_id, sim_package_id, iccid]
inputs:
  usage:
    dataset: metrics.data_usage.last
    fields: [network_id, site_id, package_id, sim_package_id, iccid, session_id, value]
    mode: state
  usage_prev:
    dataset: metrics.data_usage.last
    fields: [network_id, site_id, package_id, sim_package_id, iccid, session_id, value]
    mode: state_prev
output:
  type: float
  unit: bytes
  symbol: B
# first_value: count — a new series' first observed value is counted as
# consumption. Use baseline instead when pointing the pipeline at a Prometheus
# that already holds lifetime counters, so they don't flood one window.
params:
  first_value: count
positive_direction: up
