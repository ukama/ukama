# SITE_UPTIME (%): a site is up in a window when every node that makes it up
# is both ALIVE and SERVING.
#   alive   — the node is still pushing its system uptime counter. The
#             sanitizer republishes those counters with node_id/site/network
#             stamped on them: com_node_uptime for the tnode and the cnode,
#             ctl_node_uptime for the anode. A node that stopped pushing does
#             not disappear — Prometheus turns the series into a staleness
#             marker, which arrives as the literal NaN, and that reads as
#             down. A series that aged out of the pull's lookback is down for
#             the same reason.
#   service — digital cellular service, from the tnode health report
#             (interfaces.cellular.available); the anode has no cellular
#             interface and reports "cellular": null
#   radio   — interfaces.radio.available, on tnode and anode alike
# The cnode carries neither interface and is not probed, so liveness is all it
# is judged on. A node is down when its uptime reading is NaN or absent,
# either interface flag is false, its probe is unreachable, or it never
# reported. A site is up when it has at least one tnode/anode/cnode and every
# one of them is up; a site carrying none of the three reads down. An hnode
# attached to a site is ignored.
# radio.state is NOT read: uptime tracks interface availability, so a radio
# that is available but switched off is still up, and there is no
# planned/unplanned distinction.
# Degraded mode, PER SITE: a site none of whose nodes produced an uptime series
# is judged on health alone, exactly as v2 did. Absence of a series is a
# statement about the metrics path, not about the nodes — a node that is
# genuinely dead keeps its series and reports NaN — so this cannot mask an
# outage, and it is what lets virtual nodes (the lab pushes no uptime counters)
# share a deployment with real hardware without every virtual site reading
# down. The whole-org case follows: if nothing anywhere reports, a broken
# sanitizer or remote_write cannot zero the KPI.
# Per window: Sum = 100 when up else 0, Count = 1 always — so the aggregator's
# AVG is exactly up_windows / total_windows x 100.
# Query with op=AVG at span daily/weekly/monthly for the timeseries.
kpi: SITE_UPTIME
domain: network
algo: site_uptime@v3
kind: gauge
scope_agg: avg
scope: [network_id, site_id]
inputs:
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available, unreachable]
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type]
  # Liveness. Registry stays authoritative for site membership: a site whose
  # nodes are all dark still has to produce a row, and a dark node has no
  # metric left to carry a site label on.
  com_uptime:
    dataset: metrics.com_uptime.last
    fields: [node_id, site_id, network_id, value]
  ctl_uptime:
    dataset: metrics.ctl_uptime.last
    fields: [node_id, site_id, network_id, value]
output:
  type: float
  unit: percent
  symbol: "%"
positive_direction: up
