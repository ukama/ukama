# SITE_UPTIME (%): how much of each window the site was serving for.
#
#   node % = clamp(increase / L, 0, 1) x 100, forced to 0 by a health flag
#            reported false: interfaces.cellular.available (service; tnode
#            only, as the anode reports "cellular": null) or
#            interfaces.radio.available
#   site % = min over the site's tnode/anode/cnode
#
# L is the window length floored at 60s — `increase` needs its range to span
# several scrape intervals. Ingest pulls each node's uptime counter as
# `increase` over that range, so the value is seconds of uptime gained over it:
# ~L for a node up throughout, 0 for one whose counter stalled or never
# reported. Below the floor consecutive windows overlap.
#
# Taking the minimum collapses to "any node down means the site is down"
# whenever the per-node values are 0 or 100. A site carrying no tnode/anode/
# cnode reports 100; an hnode is ignored.
#
# radio.state is not read — uptime tracks interface availability, so a radio
# that is available but switched off is still up, and there is no
# planned/unplanned distinction. Node lifecycle state and node-gateway
# reachability are not read either: the node's own counter is the authority.
#
# Per window: Sum = the site's percentage, Count = 1, so the aggregator's AVG
# is the mean of the windows in any span. Query with op=AVG at
# daily/weekly/monthly or last_24h/last_7d/last_30d.
kpi: SITE_UPTIME
domain: network
algo: site_uptime@v3
kind: gauge
scope_agg: avg
scope: [network_id, site_id]
inputs:
  # Site membership only; `state` and `connectivity` are not read.
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type]
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available]
  # mode: window — these measure the window rather than state as of it, so a
  # failed pull reads as missing instead of inheriting the previous reading.
  com_uptime:
    dataset: metrics.com_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
  ctl_uptime:
    dataset: metrics.ctl_uptime.last
    mode: window
    fields: [node_id, site_id, network_id, value]
output:
  type: float
  unit: percent
  symbol: "%"
positive_direction: up
