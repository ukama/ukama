# SITE_UPTIME (%): uptime is 100% by default and comes down only on evidence of
# failure. A window counts against a site when something in it positively
# reports a problem, never when information is merely absent.
#
# A node is DOWN when either:
#   liveness — its uptime reading is NaN. Each node pushes a system uptime
#              counter which the sanitizer republishes with
#              node_id/site/network stamped on it (com_node_uptime for the
#              tnode and cnode, ctl_node_uptime for the anode); when a node
#              dies Prometheus turns its series into a staleness marker, which
#              arrives as the literal NaN.
#   service/radio — a health flag it reports is explicitly false:
#              interfaces.cellular.available (service; tnode-only, as the anode
#              reports "cellular": null) or interfaces.radio.available.
# and UP otherwise, including when nothing has reported anything about it: no
# uptime series, an unanswered probe, an unreachable node-gateway and a missing
# interface flag are all absence of information, not downtime.
#
# A site is DOWN when any of its tnode/anode/cnode is down, and UP otherwise —
# including a site carrying none of them. An hnode attached to a site is
# ignored.
#
# Node lifecycle state and node-gateway reachability are not read: a node is a
# separate device, and its own uptime counter is the authority on whether it is
# alive. radio.state is not read either — uptime tracks interface availability,
# so a radio that is available but switched off is still up, and there is no
# planned/unplanned distinction.
#
# Liveness rests on the staleness marker arriving: a node whose series stops
# being written without Prometheus marking it stale reads up until a NaN
# appears or the series ages past the pull's lookback.
#
# Per window: Sum = 100 when up else 0, Count = 1 always — so the aggregator's
# AVG is exactly up_windows / total_windows x 100.
# Query with op=AVG at span daily/weekly/monthly for the timeseries.
kpi: SITE_UPTIME
domain: network
algo: site_uptime@v3
kind: gauge
scope_agg: avg
scope: [network_id, site_id]
inputs:
  # Site membership only: registry is the authority for it rather than the
  # metric's own site label, because a dark node has no metric left to carry a
  # label on. `state` and `connectivity` are not read.
  nodes:
    dataset: registry.node.list
    fields: [node_id, site_id, network_id, type]
  health:
    dataset: node.health.interfaces
    fields: [node_id, site_id, network_id, type, cellular_available, radio_available]
  com_uptime:
    dataset: metrics.com_uptime.last
    fields: [node_id, site_id, network_id, value]
  ctl_uptime:
    dataset: metrics.ctl_uptime.last
    fields: [node_id, site_id, network_id, value]
output:
  type: float
  unit: percent
  symbol: "%"
positive_direction: up
