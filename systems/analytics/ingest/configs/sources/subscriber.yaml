# Subscriber source spec. The subscriber system only lists subscribers
# per-network, so this pull fans out over the networks dataset (for_each DAG);
# child rows inherit network_id lineage. Input for ACTIVE_CUSTOMERS.
version: 1
source: subscriber
system: subscriber

pulls:
  - key: subscriber.registry.getByNetwork
    endpoint: /v1/subscribers/networks/{{.network_id}}
    strategy: full_snapshot
    items: $.subscribers
    entity: subscriber_id
    for_each:
      dataset: registry.network.getAll
      bind: [network_id]
    map:
      # pb camelCase json tags (see registry.yaml note); network_id also
      # arrives via the for_each bind (lineage) as a fallback.
      subscriber_id: $.subscriberId
      network_id: $.networkId
      sims: $.sim
