# Subscriber source spec. Uses the sim-manager's filtered bulk list
# (/v1/sim?network_id=&sim_status=active) fanned out per network (for_each
# DAG); child rows inherit network_id lineage. Input for ACTIVE_CUSTOMERS.
version: 1
source: subscriber
system: subscriber

pulls:
  - key: subscriber.sim.listActive
    endpoint: /v1/sim
    strategy: full_snapshot
    items: $.sims
    entity: sim_id
    for_each:
      dataset: registry.network.getAll
      bind: [network_id]
    params:
      network_id: "{{.network_id}}"
      sim_status: active
    map:
      # Path matching is case/underscore-insensitive (mapper), so these
      # match both snake_case and camelCase serializations.
      sim_id: $.id
      subscriber_id: $.subscriber_id
      network_id: $.network_id
      status: $.status
