# Subscriber source spec. One sims dataset (all statuses) feeds
# ACTIVE_CUSTOMERS (status filtered in the algo), sim-package assignments
# and usage fan-outs — pulled once per network per window.
version: 1
source: subscriber
system: subscriber

pulls:
  # ALL sims per network (no status filter) — inactive sims still carry
  # purchase history. Parent for sim-packages and usage.
  - key: subscriber.sim.list
    endpoint: /v1/sim
    strategy: full_snapshot
    items: $.sims
    entity: sim_id
    for_each:
      dataset: registry.network.getAll
      bind: [network_id]
    params:
      network_id: "{{.network_id}}"
    map:
      sim_id: $.id
      subscriber_id: $.subscriber_id
      network_id: $.network_id
      status: $.status

  # Sim-package assignments incl. the full queue (future start_date) and
  # expired ones. Input for all package KPIs.
  - key: subscriber.simpackage.listBySim
    endpoint: /v1/sim/{{.sim_id}}/package
    strategy: full_snapshot
    items: $.packages
    entity: sim_package_id
    for_each:
      dataset: subscriber.sim.list
      bind: [sim_id, subscriber_id, network_id]
    map:
      sim_package_id: $.id
      package_id: $.package_id
      start_date: $.start_date
      end_date: $.end_date
      is_active: $.is_active
      as_expired: $.as_expired

  # Per-sim CUMULATIVE data usage counter (strategy: full_snapshot — the
  # lifetime counter is state, change-logged). NO from/to: /v1/usages returns
  # the cumulative counter and always 200s; the windowed CDR path errors on
  # idle windows. Fans out over sims; sim_id/network_id lineage comes from the
  # binds. Input for USAGE_BY_NETWORK (span usage = read-time DELTA).
  - key: subscriber.usage.getBySim
    endpoint: /v1/usages
    strategy: full_snapshot
    items: $
    entity: sim_id
    # on_error: record — a per-sim usage failure (e.g. the CDR service 500s on
    # a sim whose CDRs sum to 0) must NOT fail the whole window and blank the
    # network's KPI. The failed sim records unreachable:true (no usage field ->
    # counted as 0 bytes); sims that return usage are summed normally.
    on_error: record
    for_each:
      dataset: subscriber.sim.list
      bind: [sim_id, network_id]
    params:
      sim_id: "{{.sim_id}}"
      sim_type: ukama_data
      cdr_type: DATA
    map:
      usage: $.usage
      cost: $.cost
