# Metrics source spec: the metrics system's api-gateway is the source of truth
# for data usage (cdr pushes data_usage to pushgateway; Prometheus scrapes it;
# /v1/last re-exposes the latest sample per series).
#
# ONE unfiltered pull per window — never fan out per network/sim. /v1/last
# returns an instant vector: every series' last sample within the lookback,
# unaggregated, labels intact. Idle sims still report their last value, so
# zero-fill comes free.
#
# The counter is CUMULATIVE; analysis derives per-window increments against
# the previous window's state (mode: state_prev).
#
# Label rename on map: cdr's `dataplan` is the CATALOG package id -> package_id
# (what package_id means everywhere else in analytics), while cdr's `package`
# is the sim's package ASSIGNMENT id -> sim_package_id.
version: 1
source: metrics
system: metrics

pulls:
  - key: metrics.data_usage.last
    endpoint: /v1/last/metrics/data_usage
    strategy: full_snapshot
    items: $.data.result
    # One Prometheus series = one change-log entity; iccid alone would
    # collapse series spanning assignments, sites or concurrent sessions.
    # session_id is optional (`?`) for series pushed without the label.
    entity: iccid,sim_package_id,site_id,session_id?
    params:
      # 30m >> the 5m window W: survives scrape gaps without resurrecting
      # long-dead series the way the 7d default would.
      lookback: 30m
    map:
      network_id: $.metric.network
      site_id: $.metric.site
      package_id: $.metric.dataplan
      sim_package_id: $.metric.package
      iccid: $.metric.iccid
      # Series identity only: the algo sums sessions into the scope, and
      # session is never a KPI dimension.
      session_id: $.metric.session
      # Prometheus sample pair [ts, "value"].
      value: $.value

  # Node liveness for SITE_UPTIME / NETWORK_UPTIME. The sanitizer republishes
  # each node's system uptime counter with node_id/site/network appended:
  # com_node_uptime covers the tnode and cnode, ctl_node_uptime the anode.
  #
  # The counter gains one second per second of wall clock, so `increase` over
  # the window is the seconds the node was up for. A node that stopped
  # reporting holds its last value in the pushgateway, so its increase is 0 —
  # stalled reads as down without waiting on a staleness marker. `increase`
  # rather than `delta` because it corrects for counter resets: a window
  # containing a reboot would otherwise go negative.
  #
  # strategy: window, not full_snapshot — this measures a window rather than
  # state as of one, and carrying the last value forward would let a single
  # failed pull replay one reading across every window behind it.
  #
  # lookback is the window length floored at 60s: `increase` needs its range to
  # span several scrape intervals, and the pushgateway is scraped every 10s. A
  # 10s range holds one sample (Prometheus drops the series) or two identical
  # ones (increase 0). The algo applies the same floor, so the two cannot drift.
  #
  # time is the window end, so retry, catchup and replay evaluate the same
  # range.
  #
  # site_id/network_id are the sanitizer's labels, kept for traceability; site
  # membership comes from registry.node.list, which also covers dark nodes.
  - key: metrics.com_uptime.last
    endpoint: /v1/last/metrics/com_uptime
    strategy: window
    items: $.data.result
    entity: node_id
    params:
      fn: increase
      lookback: "{{ atLeast .WindowSeconds 60 }}s"
      time: "{{.WindowEndUnix}}"
    map:
      node_id: $.metric.node_id
      site_id: $.metric.site
      network_id: $.metric.network
      # Prometheus sample pair [ts, "value"]: seconds gained over the window.
      value: $.value

  - key: metrics.ctl_uptime.last
    endpoint: /v1/last/metrics/ctl_uptime
    strategy: window
    items: $.data.result
    entity: node_id
    params:
      fn: increase
      lookback: "{{ atLeast .WindowSeconds 60 }}s"
      time: "{{.WindowEndUnix}}"
    map:
      node_id: $.metric.node_id
      site_id: $.metric.site
      network_id: $.metric.network
      value: $.value
