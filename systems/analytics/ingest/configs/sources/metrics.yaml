# Metrics source spec: series from the metrics system's Prometheus via
# /v1/last (one unfiltered pull per window, every series' last sample within
# the lookback, labels intact).
#
# data_usage is a cumulative counter; analysis derives per-window increments
# (mode: state_prev). cdr's `dataplan` label is the catalog package
# (package_id) and its `package` label the sim's assignment (sim_package_id).
version: 1
source: metrics
system: metrics

pulls:
  - key: metrics.data_usage.last
    endpoint: /v1/last/metrics/data_usage
    strategy: full_snapshot
    items: $.data.result
    # One series = one entity; session_id is optional (`?`).
    entity: iccid,sim_package_id,site_id,session_id?
    params:
      # Survives scrape gaps without resurrecting long-dead series.
      lookback: 30m
    map:
      network_id: $.metric.network
      site_id: $.metric.site
      package_id: $.metric.dataplan
      sim_package_id: $.metric.package
      iccid: $.metric.iccid
      # Series identity only; never a KPI dimension.
      session_id: $.metric.session
      # Prometheus sample pair [ts, "value"].
      value: $.value

  # Node liveness for SITE_UPTIME / NETWORK_UPTIME: each node's system uptime
  # counter, republished by the sanitizer with node_id/site/network labels.
  # com_node_uptime covers the tnode and cnode, ctl_node_uptime the anode.
  #
  # `increase` over the window is > 0 for a live node and 0 for one whose
  # counter stalled (the pushgateway keeps serving its last value); it also
  # corrects for counter resets. strategy: window so a failed pull reads as
  # missing rather than replaying the last value. lookback is floored at 60s
  # so the range spans several 10s scrapes; time is the window end so retries
  # evaluate the same range. Site membership comes from registry.node.list,
  # not from these labels.
  - key: metrics.com_uptime.last
    endpoint: /v1/last/metrics/com_uptime
    strategy: window
    items: $.data.result
    entity: node_id
    params:
      fn: increase
      lookback: "{{ atLeast .WindowSeconds 60 }}s"
      time: "{{.WindowEndUnix}}"
    map:
      node_id: $.metric.node_id
      site_id: $.metric.site
      network_id: $.metric.network
      # Prometheus sample pair [ts, "value"].
      value: $.value

  - key: metrics.ctl_uptime.last
    endpoint: /v1/last/metrics/ctl_uptime
    strategy: window
    items: $.data.result
    entity: node_id
    params:
      fn: increase
      lookback: "{{ atLeast .WindowSeconds 60 }}s"
      time: "{{.WindowEndUnix}}"
    map:
      node_id: $.metric.node_id
      site_id: $.metric.site
      network_id: $.metric.network
      value: $.value

  # SIM counts per network for ACTIVE_CUSTOMERS / CUSTOMERS: absolute gauges
  # pushed by sim-manager on every sim lifecycle change, so `last` is the
  # current count. A network with no series is zero-filled by the algo.
  - key: metrics.active_sims.last
    endpoint: /v1/last/metrics/active_sims
    strategy: full_snapshot
    items: $.data.result
    entity: network_id
    params:
      lookback: 30m
    map:
      network_id: $.metric.network
      # Prometheus sample pair [ts, "value"].
      value: $.value

  - key: metrics.inactive_sims.last
    endpoint: /v1/last/metrics/inactive_sims
    strategy: full_snapshot
    items: $.data.result
    entity: network_id
    params:
      lookback: 30m
    map:
      network_id: $.metric.network
      value: $.value
