# Node source spec: per-node health interface probes via the node
# api-gateway, for tnode/anode (the cnode reports no interfaces).
# on_error: record — an unreachable probe records unreachable:true instead
# of failing the dataset window.
version: 1
source: node
system: node

pulls:
  - key: node.health.interfaces
    endpoint: /v1/health/nodes/{{.node_id}}/interfaces
    strategy: full_snapshot
    items: $
    entity: node_id
    on_error: record
    for_each:
      dataset: registry.node.list
      bind: [node_id, site_id, network_id, type]
      filter: { field: type, in: [tnode, anode] }
    map:
      # Only uptime-relevant fields are mapped: the change-log hash is
      # computed over mapped fields, so fluctuating values (gps time etc.)
      # don't create a new row every window.
      cellular_available: $.interfaces.cellular.available
      cellular_service: $.interfaces.cellular.service
      radio_available: $.interfaces.radio.available
      radio_state: $.interfaces.radio.state
