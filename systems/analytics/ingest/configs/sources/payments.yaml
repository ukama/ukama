# Payments source spec: settled payment records from the payments system
# (system name "payments" in init lookup). All statuses are pulled — the
# settled status ("completed") is filtered in the algos so failure KPIs can be
# added later without re-ingesting.
version: 1
source: payments
system: payments

pulls:
  - key: payments.processor.list
    endpoint: /v1/payments
    strategy: full_snapshot
    items: $.payments
    entity: payment_id
    map:
      payment_id: $.id
      item_id: $.item_id
      item_type: $.item_type
      amount: $.amount          # decimal string, e.g. "12.85"
      currency: $.currency
      payment_method: $.payment_method
      status: $.status          # completed | failed | pending
      paid_at: $.paid_at        # Go time.Time string; parsed in the algos
      payer_email: $.payer_email
      payer_phone: $.payer_phone
      metadata: $.metadata      # base64 JSON; carries {"sim": "..."} for PAID_CUSTOMERS
      created_at: $.created_at
