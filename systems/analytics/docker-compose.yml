version: '3.9'

# Analytics v2 pipeline: ingest -> analysis -> aggregator -> api-gateway.
#
# WINDOW_W MUST be identical across the three pipeline services.
#
# Sizing rules:
#   * ENGINE_TICKINTERVAL <= WINDOW_W, so at most one window closes per tick.
#   * ENGINE_CATCHUP is a duration; windows older than it are never pulled.
#   * A per-entity fan-out costs the same per window however short W is. W=1m
#     is the practical floor for dev; below that raise ENGINE_CONCURRENCY.
services:
 postgresd-analytics:
  image: postgres:13.3
  ports:
   - '5410:5432'
  environment:
   - POSTGRES_USER=postgres
   - POSTGRES_PASSWORD=Pass2020!
  networks:
   - ukama-net
  volumes:
   - postgress-data:/var/lib/postgresql

 ingest:
  build: ./ingest
  environment:
   - DEBUGMODE=true
   - DB_HOST=postgresd-analytics
   - DB_PASSWORD=Pass2020!
   - DB_USER=postgres
   - QUEUE_URI=amqp://guest:guest@${LOCAL_HOST_IP}:5672
   - MSGCLIENT_HOST=msgclient-analytics:9095
   - PUSHGATEWAY=http://${LOCAL_HOST_IP}:9091
   - INGEST_SERVICE_HOST=ingest
   - INGEST_SERVICE_PORT=9090
   - HTTP_INITCLIENT=http://api-gateway-init:8080
   - WINDOW_W=1m
   - ENGINE_TICKINTERVAL=10s
   - ENGINE_CATCHUP=1h
   - ENGINE_CONCURRENCY=8
   - ENGINE_SPECSDIR=/configs/sources
   - ORGID=${ORGID}
   - ORGNAME=${ORGNAME}
  restart: always
  networks:
   - ukama-net
  depends_on:
   - msgclient-analytics
   - postgresd-analytics

 analysis:
  build: ./analysis
  environment:
   - DEBUGMODE=true
   - DB_HOST=postgresd-analytics
   - DB_PASSWORD=Pass2020!
   - DB_USER=postgres
   - QUEUE_URI=amqp://guest:guest@${LOCAL_HOST_IP}:5672
   - MSGCLIENT_HOST=msgclient-analytics:9095
   - PUSHGATEWAY=http://${LOCAL_HOST_IP}:9091
   - ANALYSIS_SERVICE_HOST=analysis
   - ANALYSIS_SERVICE_PORT=9090
   - WINDOW_W=1m
   - ENGINE_SWEEPINTERVAL=15s
   - ENGINE_CATCHUP=1h
   - ENGINE_SPECSDIR=/configs/kpis
   - ORGID=${ORGID}
   - ORGNAME=${ORGNAME}
  restart: always
  networks:
   - ukama-net
  depends_on:
   - msgclient-analytics
   - postgresd-analytics
   - ingest

 aggregator:
  build: ./aggregator
  environment:
   - DEBUGMODE=true
   - DB_HOST=postgresd-analytics
   - DB_PASSWORD=Pass2020!
   - DB_USER=postgres
   - QUEUE_URI=amqp://guest:guest@${LOCAL_HOST_IP}:5672
   - MSGCLIENT_HOST=msgclient-analytics:9095
   - PUSHGATEWAY=http://${LOCAL_HOST_IP}:9091
   - AGGREGATOR_SERVICE_HOST=aggregator
   - AGGREGATOR_SERVICE_PORT=9090
   - WINDOW_W=1m
   - ROLLUP_SPECSDIR=/configs/kpis
   - ROLLUP_SWEEPINTERVAL=30s
   - ROLLUP_TIMEZONE=UTC
   - ORGID=${ORGID}
   - ORGNAME=${ORGNAME}
  restart: always
  networks:
   - ukama-net
  depends_on:
   - msgclient-analytics
   - postgresd-analytics
   - analysis

 api-gateway-analytics:
  build: ./api-gateway
  ports:
   - '8085:8080'
  environment:
   - DEBUGMODE=true
   - BYPASS_AUTH_MODE=true
   - SERVICES_AGGREGATOR=aggregator:9090
  restart: always
  networks:
   - ukama-net
  depends_on:
   - aggregator

 msgclient-analytics:
  build: ../services/msgClient
  environment:
   - DEBUGMODE=true
   - DB_HOST=postgresd-analytics
   - DB_PASSWORD=Pass2020!
   - DB_USER=postgres
   - QUEUE_URI=amqp://guest:guest@${LOCAL_HOST_IP}:5672
   - GRPC_PORT=9095
   - SYSTEM=analytics
  restart: always
  networks:
   - ukama-net
  depends_on:
   - postgresd-analytics

 initclient-analytics:
  build: ../services/initClient
  environment:
   - ENV_SYSTEM_ORG=${ORGNAME}
   - ENV_SYSTEM_NAME=analytics
   - ENV_DNS_REFRESH_TIME_PERIOD=30
   - ENV_SYSTEM_DNS=api-gateway-analytics
   - ENV_DNS_SERVER=false
   - ENV_SYSTEM_PORT=8080
   - ENV_SYSTEM_CERT=deafult
   - ENV_SYSTEM_API_GW_URL=http://api-gateway-analytics:8080
   - ENV_INIT_SYSTEM_ADDR=${LOCAL_HOST_IP}
   - ENV_INIT_SYSTEM_PORT=8071
   - ENV_INIT_CLIENT_ADDR=initclient-analytics
   - ENV_INIT_CLIENT_PORT=8080
   - ENV_INIT_CLIENT_TEMP_FILE=/tmp/tmpfile
  restart: always
  networks:
   - ukama-net
  depends_on:
   - api-gateway-analytics

networks:
 ukama-net:
  external: true
  name: services_ukama-net

volumes:
 postgress-data:
