syntax = "proto3";

option go_package = "github.com/ukama/ukama/systems/common/pb/gen/ukama";

package ukama.common.v1;

enum NodeConnectivity {
    Undefined = 0;
    Online = 1;
    Offline = 2;
}

enum NodeState {
    Unknown =  0;
    Configuring = 1;
    Operational     = 2;
    Faulty = 3;
    Initializing = 4;
    Ready = 5;
    Updating = 6;
    Offboarded = 7;
}

