# Independent workload scenario; see WORKLOADS.md before running.
version: 2
kind: workload
name: wl-008-console-burst
suite: workload
status: active
seed: 7001
world:
  sites: 1
  ues_per_site: 0
  backend_sims: 0
service_enabled: false
initial:
  sites: 1
console:
  pages:
  - network-home
  - sites
  - nodes
  - site-detail
  - node-detail
  dwell_seconds: 120
  visible_percent: 85
  optional_polling: false
limits:
  setup_max_rps: 2
  provision_rate: 0.25
  provision_batch: 32
  site_interval_seconds: 60
  initial_timeout_seconds: 7200
  max_inflight: 256
  request_timeout_seconds: 30
  setup_timeout_seconds: 120
  max_error_percent: 1
  max_missed_percent: 1
  p95_ms: 3000
phases:
- name: idle
  ramp_seconds: 0
  reach_seconds: 1800
  hold_seconds: 60
  console_sessions: 0
- name: burst
  ramp_seconds: 0
  reach_seconds: 1800
  hold_seconds: 600
  console_sessions: 24
- name: idle-again
  ramp_seconds: 0
  reach_seconds: 1800
  hold_seconds: 60
  console_sessions: 0
- name: second-burst
  ramp_seconds: 0
  reach_seconds: 1800
  hold_seconds: 600
  console_sessions: 24
- name: settled
  ramp_seconds: 60
  reach_seconds: 1800
  hold_seconds: 600
  console_sessions: 3
description: Sudden 24-session page mount burst, settling period, and repeat burst.
