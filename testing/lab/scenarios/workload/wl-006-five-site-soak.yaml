# Independent workload scenario; see WORKLOADS.md before running.
version: 2
kind: workload
name: wl-006-five-site-soak
suite: workload
status: active
seed: 7001
world:
  sites: 5
  ues_per_site: 100
  backend_sims: 0
service_enabled: true
initial:
  sites: 5
  provisioned_ues: 500
console:
  pages:
  - network-home
  - sites
  - nodes
  - site-detail
  - node-detail
  dwell_seconds: 120
  visible_percent: 85
  optional_polling: false
limits:
  setup_max_rps: 2
  provision_rate: 0.25
  provision_batch: 32
  site_interval_seconds: 60
  initial_timeout_seconds: 7200
  max_inflight: 256
  request_timeout_seconds: 30
  setup_timeout_seconds: 120
  max_error_percent: 1
  max_missed_percent: 1
  p95_ms: 3000
phases:
- name: warmup
  ramp_seconds: 60
  reach_seconds: 1800
  hold_seconds: 600
  attached_ues: 250
  active_ues: 50
  console_sessions: 12
- name: eight-hour-soak
  ramp_seconds: 60
  reach_seconds: 1800
  hold_seconds: 28800
  console_sessions: 24
- name: recovery
  ramp_seconds: 60
  reach_seconds: 1800
  hold_seconds: 600
  attached_ues: 50
  active_ues: 10
  console_sessions: 3
description: Eight-hour steady workload after warm-up; use a credential valid for
  the entire run.
packages:
- ref: standard
  name: Workload Standard
  data_mb: 102400
  duration_days: 30
  amount: 1
  assign_percent: 100
  currency: USD
  country: USA
