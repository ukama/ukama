# Independent workload scenario; see WORKLOADS.md before running.
version: 2
kind: workload
name: wl-005-ue-reconnect
suite: workload
status: active
seed: 7001
world:
  sites: 3
  ues_per_site: 100
  backend_sims: 0
service_enabled: true
initial:
  sites: 3
  provisioned_ues: 300
console:
  pages:
  - network-home
  - sites
  - nodes
  - site-detail
  - node-detail
  dwell_seconds: 120
  visible_percent: 85
  optional_polling: false
limits:
  setup_max_rps: 2
  provision_rate: 0.25
  provision_batch: 32
  site_interval_seconds: 60
  initial_timeout_seconds: 7200
  max_inflight: 256
  request_timeout_seconds: 30
  setup_timeout_seconds: 120
  max_error_percent: 1
  max_missed_percent: 1
  p95_ms: 3000
phases:
- name: connected
  ramp_seconds: 60
  reach_seconds: 1800
  hold_seconds: 600
  attached_ues: 300
  active_ues: 60
  console_sessions: 12
- name: disconnect-wave
  ramp_seconds: 60
  reach_seconds: 1800
  hold_seconds: 600
  attached_ues: 30
  active_ues: 10
- name: reconnect-wave
  ramp_seconds: 180
  reach_seconds: 1800
  hold_seconds: 600
  attached_ues: 300
  active_ues: 60
- name: settled
  ramp_seconds: 60
  reach_seconds: 1800
  hold_seconds: 1800
description: Controlled detach/reattach of existing UE population, with console reads
  throughout.
packages:
- ref: standard
  name: Workload Standard
  data_mb: 102400
  duration_days: 30
  amount: 1
  assign_percent: 100
  currency: USD
  country: USA
