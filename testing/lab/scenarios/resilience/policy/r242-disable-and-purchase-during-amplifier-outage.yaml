version: 1
name: r242-disable-and-purchase-during-amplifier-outage
description: disable-and-purchase during amplifier disconnection; recovered nodes must use the backend subscription state with correct cash history and traffic enforcement.
seed: 6342
suite: resilience
priority: p1
tags: [virtual, policy, runtime, outage, stale-state]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: working
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 1
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks: []
  - name: partition
    events:
      - type: disconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: change_while_partitioned
    events:
      - type: toggle_sim_status
        ues: all
        status: service_off
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
      - type: purchase_package
        ues: all
        package: next
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
  - name: reconnect
    events:
      - type: reconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
      - type: toggle_service
        sites: all
        state: 'on'
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
  - name: stale_credit_not_accepted
    events:
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 20
        expect:
          result: failure
          error_contains: script failed
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
  - name: explicit_recovery
    events:
      - type: toggle_sim_status
        ues: all
        status: service_on
      - type: wait_sim_status
        ues: all
        status: service_on
        seconds: 120
    checks:
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
  - name: working_after_sync
    events:
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 2
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
  - type: payment_count
    ues: all
    package: next
    expected_count: 1
