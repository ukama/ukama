version: 1
name: r069-partial-use-restart-does-not-reset-allowance
description: Use part of a plan, restart the tower, consume the remaining allowance, and require another attach to fail without a new purchase.
seed: 6169
suite: resilience
priority: p1
tags: [virtual, policy, runtime, restart, exhaustion]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 10
    duration_minutes: 60
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: partial_usage
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 4
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: restart
    events:
      - type: restart_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: tower-site-001-001
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 6
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks:
      - type: package_state
        ues: all
        package: base
        expected: inactive
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: no_reset
    events:
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 20
        expect:
          result: failure
          error_contains: script failed
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
