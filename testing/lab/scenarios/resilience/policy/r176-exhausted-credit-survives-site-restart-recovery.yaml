version: 1
name: r176-exhausted-credit-survives-site-restart-recovery
description: Exhausted credit must stay unusable after site-restart recovery; only a new settled purchase restores subscriber traffic.
seed: 6276
suite: resilience
priority: p1
tags: [virtual, policy, runtime, negative, policy, recovery]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 2
    duration_minutes: 60
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 20
    duration_minutes: 60
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: working_control
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 2
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks: []
  - name: terminal_credit
    checks:
      - type: package_state
        ues: all
        package: base
        expected: inactive
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: restore_availability
    events:
      - type: restart_site
        sites: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
      - type: toggle_service
        sites: all
        state: 'on'
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: base
        expected: inactive
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: still_no_credit
    events:
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 20
        expect:
          result: failure
          error_contains: script failed
    checks:
      - type: package_state
        ues: all
        package: base
        expected: inactive
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 1
        immediate: true
  - name: paid_recovery
    events:
      - type: purchase_package
        ues: all
        package: next
    checks:
      - type: package_state
        ues: all
        package: next
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
  - name: working_again
    events:
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 2
    checks:
      - type: package_state
        ues: all
        package: next
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: base
        expected: inactive
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
  - type: payment_count
    ues: all
    package: next
    expected_count: 1
  - type: payment_entitlement_reconciles
    ues: all
    package: next
