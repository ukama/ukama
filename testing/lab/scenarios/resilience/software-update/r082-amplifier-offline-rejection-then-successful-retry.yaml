version: 1
name: r082-amplifier-offline-rejection-then-successful-retry
description: Reject updating an offline amplifier, prove its version is unchanged after reconnect, then explicitly retry the update and verify runtime health and unlock.
seed: 6182
suite: resilience
priority: p1
tags: [virtual, software-update, nodes, software, negative, recovery]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    checks:
      - type: node_version_equals
        nodes: amplifier-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: amplifier-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
  - name: expose
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: software_status_equals
        nodes: amplifier-site-001-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: offline_rejection
    events:
      - type: disconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
      - type: software_update
        nodes: amplifier-site-001-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
        expect:
          result: failure
          error_contains: not available for updates
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 30
        poll_seconds: 2
        immediate: true
  - name: reconnect_unchanged
    events:
      - type: reconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_version_equals
        nodes: amplifier-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: amplifier-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
      - type: software_status_equals
        nodes: amplifier-site-001-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: explicit_retry
    events:
      - type: software_update
        nodes: amplifier-site-001-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: software_status_equals
        nodes: amplifier-site-001-001
        app: example
        status: up_to_date
        current_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: node_version_equals
        nodes: amplifier-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: amplifier-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
