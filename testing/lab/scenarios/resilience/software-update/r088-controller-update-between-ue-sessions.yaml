version: 1
name: r088-controller-update-between-ue-sessions
description: A controller app update between finalized subscriber sessions must preserve SIM entitlement, settled payment, and usage accumulated before and after the update.
seed: 6188
suite: resilience
priority: p1
tags: [virtual, software-update, runtime, software, accounting]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 2
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks:
      - type: node_version_equals
        nodes: controller-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: controller-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
  - name: expose
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: software_status_equals
        nodes: controller-site-001-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: upgrade
    events:
      - type: software_update
        nodes: controller-site-001-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: software_status_equals
        nodes: controller-site-001-001
        app: example
        status: up_to_date
        current_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: node_version_equals
        nodes: controller-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: controller-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
      - type: node_operation_status_equals
        nodes: controller-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: resume
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 3
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
  - type: payment_entitlement_reconciles
    ues: all
    package: base
