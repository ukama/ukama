version: 1
name: r085-amplifier-held-update-timeout-and-recovery
description: Hold a amplifier offline during an accepted software update; the backend must release the timed-out lock, and the node must return with an observable software state.
seed: 6185
suite: resilience
priority: p1
tags: [virtual, software-update, nodes, software, native-fault, timeout]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    checks:
      - type: node_version_equals
        nodes: amplifier-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: amplifier-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
  - name: expose
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: software_status_equals
        nodes: amplifier-site-001-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: hold_update
    events:
      - type: failure_control
        target: software_timeout
        state: 'on'
      - type: software_update
        nodes: amplifier-site-001-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: true
        timeout_seconds: 60
        poll_seconds: 2
        immediate: true
  - name: wait_for_terminal_unlock
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 600
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: release_hold
    events:
      - type: failure_control
        target: software_timeout
        state: 'off'
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: amplifier-site-001-001
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_health_ok
        nodes: amplifier-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: software_status_equals
        nodes: amplifier-site-001-001
        app: example
        required: true
        timeout_seconds: 300
        immediate: true
