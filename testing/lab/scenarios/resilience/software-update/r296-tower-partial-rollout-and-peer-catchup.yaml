version: 1
name: r296-tower-partial-rollout-and-peer-catchup
description: Update one tower while the peer is disconnected; prove version separation, then explicitly catch up the recovered peer.
seed: 6396
suite: resilience
priority: p1
tags: [virtual, software-update, nodes, software, isolation, partial-rollout]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    checks:
      - type: node_version_equals
        nodes: tower-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_version_equals
        nodes: tower-site-002-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: tower-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: tower-site-002-001
        app: example
        timeout_seconds: 300
        immediate: true
  - name: expose
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: software_status_equals
        nodes: tower-site-001-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: software_status_equals
        nodes: tower-site-002-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: offline_peer
    events:
      - type: disconnect_nodes
        nodes: tower-site-002-001
      - type: wait_node_connectivity
        nodes: tower-site-002-001
        connectivity: Offline
        seconds: 180
    checks: []
  - name: partial_rollout
    events:
      - type: software_update
        nodes: tower-site-001-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: software_update
        nodes: tower-site-002-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
        expect:
          result: failure
          error_contains: not available for updates
    checks:
      - type: node_version_equals
        nodes: tower-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: tower-site-001-001
        app: example
        timeout_seconds: 300
        immediate: true
      - type: node_operation_status_equals
        nodes: tower-site-002-001
        busy: false
        timeout_seconds: 30
        poll_seconds: 2
        immediate: true
  - name: peer_returns
    events:
      - type: reconnect_nodes
        nodes: tower-site-002-001
      - type: wait_node_connectivity
        nodes: tower-site-002-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_version_equals
        nodes: tower-site-002-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: software_status_equals
        nodes: tower-site-002-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: catchup
    events:
      - type: software_update
        nodes: tower-site-002-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: node_version_equals
        nodes: tower-site-002-001
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_version_equals
        nodes: tower-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        immediate: true
      - type: node_health_ok
        nodes: tower-site-002-001
        app: example
        timeout_seconds: 300
        immediate: true
      - type: software_status_equals
        nodes: tower-site-002-001
        app: example
        status: up_to_date
        current_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
