version: 1
name: r131-organization-separate-reverse-rejection-retry
description: Allocate two exact ICCIDs in reverse order with a organization plan and separate subscribers; rejected initial allocation must not consume either SIM or create a payment.
seed: 6231
suite: resilience
priority: p1
tags: [virtual, allocation, backend-only, allocation, atomicity, multi-sim]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 2
setup:
  create_via_bff: [networks, packages, subscribers]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
    scope: organization
    active: false
phases:
  - name: reject_first
    events:
      - type: allocate_sim
        ues: ue-000002
        package: base
        variant: specific
        expect:
          result: failure
    checks:
      - type: sim_unallocated
        ues: all
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 0
        immediate: true
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 0
        immediate: true
  - name: allocate_other
    events:
      - type: set_package_active
        package: base
        active: true
      - type: allocate_sim
        ues: ue-000001
        package: base
        variant: specific
    checks:
      - type: sim_unallocated
        ues: ue-000002
        immediate: true
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 1
        immediate: true
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 1
        immediate: true
  - name: retry_original
    events:
      - type: allocate_sim
        ues: ue-000002
        package: base
        variant: specific
    checks:
      - type: sim_unallocated
        ues: all
        expected: 'false'
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 2
        immediate: true
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 2
        immediate: true
      - type: list_count_equals
        target: subscribers
        networks: net-001
        expected_count: 2
        immediate: true
final_checks:
  - type: payment_entitlement_reconciles
    ues: all
    package: base
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 2.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: entity_fields_equal
    entity: subscriber
    ref: sub-000001
  - type: entity_reconciles
    entity: subscriber
    ref: sub-000001
