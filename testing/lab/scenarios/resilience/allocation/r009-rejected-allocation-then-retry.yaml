version: 1
name: r009-rejected-allocation-then-retry
description: An inactive first plan must leave the exact SIM unallocated; after activation the same ICCID must allocate once.
seed: 6109
suite: resilience
priority: p1
tags: [virtual, allocation, backend-only, negative, recovery]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
    active: false
phases:
  - name: reject_initial
    events:
      - type: allocate_sim
        ues: all
        package: base
        variant: specific
        expect:
          result: failure
    checks:
      - type: sim_unallocated
        ues: all
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 0
        immediate: true
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 0
        immediate: true
  - name: retry_same_iccid
    events:
      - type: set_package_active
        package: base
        active: true
      - type: allocate_sim
        ues: all
        package: base
        variant: specific
    checks:
      - type: sim_unallocated
        ues: all
        expected: 'false'
        immediate: true
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_equals
        ues: all
        package: base
        status: settled
        payment_method: cash
        currency: USD
        expected_value: 1.0
        tolerance: 0.001
        required: true
        immediate: true
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 1
        immediate: true
final_checks:
  - type: payment_entitlement_reconciles
    ues: all
    package: base
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 1.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
