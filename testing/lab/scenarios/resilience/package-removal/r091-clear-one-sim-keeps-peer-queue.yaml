version: 1
name: r091-clear-one-sim-keeps-peer-queue
description: Remove all assignments from one SIM; the second SIM must retain its active and queued packages and both customers keep their historical payments.
seed: 6191
suite: resilience
priority: p1
tags: [virtual, package-removal, backend-only, removal, isolation]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 2
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: queue_both
    events:
      - type: purchase_package
        ues: all
        package: next
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: clear_first
    events:
      - type: remove_package_from_sim
        ues: ue-000001
    checks:
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 0
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: ue-000002
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: ue-000002
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 2
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 6.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
