version: 1
name: r162-clear-31-queued-disabled-then-purchase
description: Clear 31 queued plans plus the active plan from an disabled SIM; restoring by purchase must preserve old payments and SIM status with the correct new cash count.
seed: 6262
suite: resilience
priority: p1
tags: [virtual, package-removal, backend-only, removal, boundary, history]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 0.01
    currency: USD
    country: USA
    assign_percent: 0
  - ref: replacement
    name: Resilience Replacement
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: prepare
    events:
      - type: toggle_sim_status
        ues: all
        status: service_off
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 32
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 31
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 32
        immediate: true
  - name: clear
    events:
      - type: remove_package_from_sim
        ues: all
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 0
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: base
        expected: absent
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: absent
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 1
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 31
        immediate: true
  - name: retry_clear
    events:
      - type: remove_package_from_sim
        ues: all
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 0
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 31
        immediate: true
  - name: restore
    events:
      - type: purchase_package
        ues: all
        package: replacement
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
    checks:
      - type: package_state
        ues: all
        package: replacement
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: replacement
        expected_count: 1
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 31
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 1
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 3.31
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
