version: 1
name: r093-administrative-grant-is-not-a-cash-sale
description: After clearing credit, add a package directly through the administrative assignment action; the grant must not be misreported as a new cash receipt.
seed: 6193
suite: resilience
priority: p1
tags: [virtual, package-removal, backend-only, removal, contract]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: grant
    name: Resilience Grant
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: clear
    events:
      - type: remove_package_from_sim
        ues: all
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 0
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 1
        immediate: true
  - name: grant
    events:
      - type: add_package_to_sim
        ues: all
        package: grant
    checks:
      - type: package_state
        ues: all
        package: grant
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: grant
        expected_count: 0
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 1.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
