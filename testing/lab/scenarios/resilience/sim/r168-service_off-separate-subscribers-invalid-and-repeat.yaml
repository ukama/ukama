version: 1
name: r168-service_off-separate-subscribers-invalid-and-repeat
description: With separate-subscribers, invalid and repeated writes to a SIM already service_off must preserve its queued credit, peer service, and payment counts.
seed: 6268
suite: resilience
priority: p1
tags: [virtual, sim, backend-only, negative, isolation, repeat]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 2
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: prepare
    events:
      - type: toggle_sim_status
        ues: all
        status: service_on
      - type: wait_sim_status
        ues: all
        status: service_on
        seconds: 120
      - type: toggle_sim_status
        ues: ue-000001
        status: service_off
      - type: wait_sim_status
        ues: ue-000001
        status: service_off
        seconds: 120
      - type: purchase_package
        ues: ue-000001
        package: next
    checks:
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: invalid
    events:
      - type: toggle_sim_status
        ues: ue-000001
        status: invalid_state
        expect:
          result: failure
      - type: wait_sim_status
        ues: ue-000001
        status: service_off
        seconds: 120
      - type: wait_sim_status
        ues: ue-000002
        status: service_on
        seconds: 120
    checks:
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: ue-000002
        package: next
        expected: absent
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: repeat
    events:
      - type: toggle_sim_status
        ues: ue-000001
        status: service_off
      - type: toggle_sim_status
        ues: ue-000001
        status: service_off
      - type: toggle_sim_status
        ues: ue-000001
        status: service_off
      - type: wait_sim_status
        ues: ue-000001
        status: service_off
        seconds: 120
      - type: wait_sim_status
        ues: ue-000002
        status: service_on
        seconds: 120
    checks:
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: ue-000001
        package: next
        expected_count: 1
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 4.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
