version: 1
name: r029-disable-during-site-backhaul-outage
description: Disable a SIM while all site nodes are disconnected; after reconnect the stale node must enforce the disabled state until explicit activation.
seed: 6129
suite: resilience
priority: p1
tags: [virtual, sim, runtime, outage, stale-state]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 2
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks: []
  - name: disconnect_and_disable
    events:
      - type: disconnect_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 180
      - type: toggle_sim_status
        ues: all
        status: service_off
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: reconnect_still_disabled
    events:
      - type: reconnect_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 20
        expect:
          result: failure
          error_contains: script failed
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: enable
    events:
      - type: toggle_sim_status
        ues: all
        status: service_on
      - type: wait_sim_status
        ues: all
        status: service_on
        seconds: 120
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 1
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
