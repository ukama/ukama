version: 1
name: r026-topup-disabled-sim-does-not-enable-service
description: A valid top-up to a disabled SIM may queue entitlement but must not silently enable SIM service.
seed: 6126
suite: resilience
priority: p1
tags: [virtual, sim, backend-only, lifecycle]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: disable
    events:
      - type: toggle_sim_status
        ues: all
        status: service_off
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
    checks: []
  - name: topup_while_disabled
    events:
      - type: purchase_package
        ues: all
        package: next
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_equals
        ues: all
        package: next
        status: settled
        payment_method: cash
        currency: USD
        expected_value: 2.0
        tolerance: 0.001
        required: true
        immediate: true
  - name: enable
    events:
      - type: toggle_sim_status
        ues: all
        status: service_on
      - type: wait_sim_status
        ues: all
        status: service_on
        seconds: 120
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
  - type: payment_count
    ues: all
    package: next
    expected_count: 1
  - type: payment_entitlement_reconciles
    ues: all
    package: next
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 3.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
