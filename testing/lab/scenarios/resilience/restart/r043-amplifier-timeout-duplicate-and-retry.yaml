version: 1
name: r043-amplifier-timeout-duplicate-and-retry
description: Hold a amplifier restart offline, reject a duplicate while busy, observe timeout unlock, then recover and complete a fresh restart.
seed: 6143
suite: resilience
priority: p1
tags: [virtual, restart, nodes, native-fault, lock, timeout]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: hold_restart
    events:
      - type: failure_control
        target: node_restart
        state: 'on'
      - type: restart_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: true
        timeout_seconds: 60
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: reject_duplicate
    events:
      - type: restart_nodes
        nodes: amplifier-site-001-001
        expect:
          result: failure
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: true
        timeout_seconds: 30
        poll_seconds: 2
        immediate: true
  - name: timeout_releases_lock
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 600
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: release_hold
    events:
      - type: failure_control
        target: node_restart
        state: 'off'
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: amplifier-site-001-001
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: retry_real_restart
    events:
      - type: restart_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: amplifier-site-001-001
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
final_checks:
  - type: list_count_equals
    target: nodes
    networks: net-001
    expected_count: 3
  - type: site_operation_status_equals
    sites: all
    busy: false
    timeout_seconds: 300
    poll_seconds: 2
