version: 1
name: r046-held-amplifier-blocks-toggle-radio
description: A held amplifier restart must block the conflicting site action while the lock is active, then release both node and site locks after recovery.
seed: 6146
suite: resilience
priority: p1
tags: [virtual, restart, nodes, native-fault, lock]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: hold_restart
    events:
      - type: failure_control
        target: node_restart
        state: 'on'
      - type: restart_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: true
        timeout_seconds: 60
        poll_seconds: 2
        immediate: true
  - name: reject_conflict
    events:
      - type: toggle_radio
        sites: all
        state: 'off'
        expect:
          result: failure
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: true
        timeout_seconds: 30
        poll_seconds: 2
        immediate: true
  - name: release_hold
    events:
      - type: failure_control
        target: node_restart
        state: 'off'
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: amplifier-site-001-001
    checks:
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
