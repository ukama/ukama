version: 1
name: r280-tower-held-restart-independent-peer-network
description: A held tower restart must not lock the peer network; both restart requests must be accepted and recover independently.
seed: 6380
suite: resilience
priority: p1
tags: [virtual, restart, nodes, native-fault, lock, isolation]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: hold_first
    events:
      - type: failure_control
        target: node_restart
        state: 'on'
      - type: restart_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_operation_status_equals
        nodes: tower-site-001-001
        busy: true
        timeout_seconds: 60
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: site-002
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: independent_peer
    events:
      - type: restart_nodes
        nodes: tower-site-002-001
      - type: wait_node_connectivity
        nodes: tower-site-002-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_operation_status_equals
        nodes: tower-site-002-001
        busy: true
        timeout_seconds: 60
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: tower-site-001-001
        busy: true
        timeout_seconds: 30
        poll_seconds: 2
        immediate: true
  - name: restore
    events:
      - type: failure_control
        target: node_restart
        state: 'off'
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
