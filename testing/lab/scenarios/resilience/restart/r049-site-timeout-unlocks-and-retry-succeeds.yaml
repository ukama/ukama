version: 1
name: r049-site-timeout-unlocks-and-retry-succeeds
description: Hold all restarted site nodes offline; after timeout release the hold and prove a second site restart succeeds.
seed: 6149
suite: resilience
priority: p1
tags: [virtual, restart, nodes, native-fault, timeout]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: hold_site
    events:
      - type: failure_control
        target: site_restart
        state: 'on'
      - type: restart_site
        sites: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 180
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: true
        timeout_seconds: 60
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 0
        offline: 3
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: reject_duplicate
    events:
      - type: restart_site
        sites: all
        expect:
          result: failure
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: true
        timeout_seconds: 30
        poll_seconds: 2
        immediate: true
  - name: timeout
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 600
        poll_seconds: 2
        immediate: true
  - name: restore
    events:
      - type: failure_control
        target: site_restart
        state: 'off'
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: retry
    events:
      - type: restart_site
        sites: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
