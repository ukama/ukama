version: 1
name: r016-12-small-topups-preserve-every-sale
description: 12 intentional one-cent top-ups must produce 12 separate receipts and a non-overlapping queue without rounding loss.
seed: 6116
suite: resilience
priority: p1
tags: [virtual, billing, backend-only, boundary]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 0.01
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: topup_burst
    events:
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
    checks:
      - type: package_assignment_count
        ues: all
        package: next
        expected_count: 12
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 12
        immediate: true
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 13
        immediate: true
final_checks:
  - type: payment_entitlement_reconciles
    ues: all
    package: next
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 1.12
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: performance_report_cell
    report: package_performance
    span: daily
    networks: net-001
    package: next
    column: revenue
    expected_value: 0.12
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
