version: 1
name: r021-3-sims-grouped-by-two
description: Group 3 SIMs in pairs and top up one SIM; subscriber billing must count each SIM sale once, including a partial final group.
seed: 6121
suite: resilience
priority: p1
tags: [virtual, billing, backend-only, multi-sim, boundary]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 3
  sims_per_subscriber: 2
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: topup_one_sim
    events:
      - type: purchase_package
        ues: ue-000001
        package: next
    checks:
      - type: list_count_equals
        target: subscribers
        networks: net-001
        expected_count: 2
        immediate: true
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 3
        immediate: true
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: subscriber_billing_summary
        ues: ue-000001
        expected_count: 3
        expected_value: 4.0
        tolerance: 0.001
        immediate: true
      - type: subscriber_billing_summary
        ues: ue-000002
        expected_count: 3
        expected_value: 4.0
        tolerance: 0.001
        immediate: true
      - type: subscriber_billing_summary
        ues: ue-000003
        expected_count: 1
        expected_value: 1.0
        tolerance: 0.001
        immediate: true
final_checks:
  - type: payment_count
    ues: all
    package: base
    expected_count: 3
  - type: payment_count
    ues: all
    package: next
    expected_count: 1
  - type: payment_entitlement_reconciles
    ues: all
    package: base
  - type: payment_entitlement_reconciles
    ues: all
    package: next
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 5
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
