version: 1
name: r149-concurrent-disabled-shared-3-rounds
description: 3 purchase pairs per SIM with disabled credit and shared subscribers must preserve all distinct sales and non-overlapping assignment chains.
seed: 6249
suite: resilience
priority: p1
tags: [virtual, billing, backend-only, concurrency, multi-sim, accounting]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 2
  sims_per_subscriber: 2
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: a
    name: Resilience A
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
  - ref: b
    name: Resilience B
    data_mb: 100
    duration_days: 1
    amount: 3.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: prepare
    events:
      - type: toggle_sim_status
        ues: all
        status: service_off
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: concurrent_pair_1
    events:
      - type: purchase_packages_parallel
        ues: all
        package: a
        other_package: b
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 3
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        package: a
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        package: b
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: a
        expected_count: 2
        immediate: true
      - type: payment_count
        ues: all
        package: b
        expected_count: 2
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 3
        immediate: true
  - name: concurrent_pair_2
    events:
      - type: purchase_packages_parallel
        ues: all
        package: a
        other_package: b
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 5
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        package: a
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        package: b
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: a
        expected_count: 4
        immediate: true
      - type: payment_count
        ues: all
        package: b
        expected_count: 4
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 5
        immediate: true
  - name: concurrent_pair_3
    events:
      - type: purchase_packages_parallel
        ues: all
        package: a
        other_package: b
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 7
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        package: a
        expected_count: 3
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        package: b
        expected_count: 3
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: a
        expected_count: 6
        immediate: true
      - type: payment_count
        ues: all
        package: b
        expected_count: 6
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 7
        immediate: true
  - name: status_unchanged
    events:
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
    checks:
      - type: subscriber_billing_summary
        ues: all
        expected_count: 14
        expected_value: 32.0
        tolerance: 0.001
        immediate: true
final_checks:
  - type: payment_entitlement_reconciles
    ues: all
    package: a
  - type: payment_entitlement_reconciles
    ues: all
    package: b
  - type: payment_count
    ues: all
    package: base
    expected_count: 2
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 32
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
