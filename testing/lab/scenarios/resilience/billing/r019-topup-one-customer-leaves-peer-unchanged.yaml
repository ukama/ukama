version: 1
name: r019-topup-one-customer-leaves-peer-unchanged
description: Five top-ups for one customer must leave the peer SIM on its original entitlement and billing total.
seed: 6119
suite: resilience
priority: p1
tags: [virtual, billing, backend-only, isolation]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 2
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: asymmetric_sales
    events:
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
    checks:
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 6
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: ue-000002
        package: next
        expected: absent
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: ue-000001
        package: next
        expected_count: 5
        immediate: true
      - type: subscriber_billing_summary
        ues: ue-000001
        expected_count: 6
        expected_value: 11.0
        tolerance: 0.001
        immediate: true
      - type: subscriber_billing_summary
        ues: ue-000002
        expected_count: 1
        expected_value: 1.0
        tolerance: 0.001
        immediate: true
final_checks:
  - type: payment_entitlement_reconciles
    ues: all
    package: next
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 12.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
