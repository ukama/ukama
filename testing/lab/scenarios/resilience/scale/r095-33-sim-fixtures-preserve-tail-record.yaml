version: 1
name: r095-33-sim-fixtures-preserve-tail-record
description: Provision 33 network SIM fixtures, crossing a small-list boundary; the last SIM must retain its own allocation and the complete list and sale counts must reconcile.
seed: 6195
suite: resilience
priority: p1
tags: [virtual, scale, backend-only, capacity, long]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 33
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
phases:
  - name: verify_tail
    checks:
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 33
        immediate: true
      - type: list_count_equals
        target: subscribers
        networks: net-001
        expected_count: 33
        immediate: true
      - type: sim_unallocated
        ues: ue-000033
        expected: 'false'
        immediate: true
      - type: package_assignment_count
        ues: ue-000033
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: ue-000033
        package: base
        expected_count: 33
        immediate: true
final_checks:
  - type: payment_entitlement_reconciles
    ues: all
    package: base
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 33.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
