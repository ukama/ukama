version: 1
name: r030-tower-outage-leaves-peer-site-healthy
description: Disconnect one tower; its lifecycle and inventory must remain, while the second site retains three online nodes and no operation lock.
seed: 6130
suite: resilience
priority: p1
tags: [virtual, outage, nodes, isolation]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: disconnect
    events:
      - type: disconnect_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_status_equals
        nodes: tower-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: tower-site-002-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: site-002
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 6
        immediate: true
  - name: reconnect
    events:
      - type: reconnect_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: tower-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 6
        immediate: true
