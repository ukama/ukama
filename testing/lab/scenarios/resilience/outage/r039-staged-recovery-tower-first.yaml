version: 1
name: r039-staged-recovery-tower-first
description: After a whole-site backhaul loss, restore nodes in a deliberate order and verify exact online/offline counts at every step.
seed: 6139
suite: resilience
priority: p1
tags: [virtual, outage, nodes, recovery-order]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: whole_site_outage
    events:
      - type: disconnect_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 0
        offline: 3
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
  - name: restore_tower
    events:
      - type: reconnect_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: tower-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 1
        offline: 2
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: restore_amplifier
    events:
      - type: reconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: restore_controller
    events:
      - type: reconnect_nodes
        nodes: controller-site-001-001
      - type: wait_node_connectivity
        nodes: controller-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: controller-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
final_checks:
  - type: node_status_equals
    nodes: all
    connectivity: Online
    state: Operational
    timeout_seconds: 180
    poll_seconds: 2
  - type: site_operation_status_equals
    sites: all
    busy: false
    timeout_seconds: 300
    poll_seconds: 2
