version: 1
name: r034-amplifier-three-backhaul-flaps
description: Three real container-network outages of the amplifier must converge each time without losing lifecycle state or duplicating inventory.
seed: 6134
suite: resilience
priority: p1
tags: [virtual, outage, nodes, repeat]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: disconnect_1
    events:
      - type: disconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
  - name: reconnect_1
    events:
      - type: reconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: disconnect_2
    events:
      - type: disconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
  - name: reconnect_2
    events:
      - type: reconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
  - name: disconnect_3
    events:
      - type: disconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
  - name: reconnect_3
    events:
      - type: reconnect_nodes
        nodes: amplifier-site-001-001
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: amplifier-site-001-001
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
