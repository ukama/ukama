version: 1
name: r210-tower-controller-restore-tower-controller-peer-network
description: Restore tower then controller after losing tower and controller in a peer-network topology; verify every intermediate node count and unaffected inventory.
seed: 6310
suite: resilience
priority: p1
tags: [virtual, outage, nodes, outage, recovery-order, isolation]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: disconnect_set
    events:
      - type: disconnect_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Offline
        seconds: 180
      - type: disconnect_nodes
        nodes: controller-site-001-001
      - type: wait_node_connectivity
        nodes: controller-site-001-001
        connectivity: Offline
        seconds: 180
    checks:
      - type: node_status_equals
        nodes: tower-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: controller-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 1
        offline: 2
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
      - type: entity_fields_equal
        entity: site
        ref: site-001
        immediate: true
      - type: entity_reconciles
        entity: site
        ref: site-001
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: site-002
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: entity_fields_equal
        entity: site
        ref: site-002
        immediate: true
      - type: entity_reconciles
        entity: site
        ref: site-002
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-002
        expected_count: 3
        immediate: true
      - type: list_count_equals
        target: sites
        networks: net-002
        expected_count: 1
        immediate: true
  - name: restore_tower
    events:
      - type: reconnect_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: tower-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: controller-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
      - type: entity_fields_equal
        entity: site
        ref: site-001
        immediate: true
      - type: entity_reconciles
        entity: site
        ref: site-001
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: site-002
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: entity_fields_equal
        entity: site
        ref: site-002
        immediate: true
      - type: entity_reconciles
        entity: site
        ref: site-002
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-002
        expected_count: 3
        immediate: true
      - type: list_count_equals
        target: sites
        networks: net-002
        expected_count: 1
        immediate: true
  - name: restore_controller
    events:
      - type: reconnect_nodes
        nodes: controller-site-001-001
      - type: wait_node_connectivity
        nodes: controller-site-001-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: tower-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: amplifier-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: controller-site-001-001
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
      - type: entity_fields_equal
        entity: site
        ref: site-001
        immediate: true
      - type: entity_reconciles
        entity: site
        ref: site-001
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: site-002
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: entity_fields_equal
        entity: site
        ref: site-002
        immediate: true
      - type: entity_reconciles
        entity: site
        ref: site-002
        immediate: true
      - type: list_count_equals
        target: nodes
        networks: net-002
        expected_count: 3
        immediate: true
      - type: list_count_equals
        target: sites
        networks: net-002
        expected_count: 1
        immediate: true
  - name: ready
    events:
      - type: wait_nodes_ready
        nodes: all
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
      - type: node_operation_status_equals
        nodes: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        immediate: true
