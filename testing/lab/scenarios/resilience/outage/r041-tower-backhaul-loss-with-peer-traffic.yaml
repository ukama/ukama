version: 1
name: r041-tower-backhaul-loss-with-peer-traffic
description: During one tower backhaul outage the other site must still transfer data; reconnect the affected tower and prove both sessions recover.
seed: 6141
suite: resilience
priority: p1
tags: [virtual, outage, runtime, outage, isolation]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 1
      - type: finalize_ue_sessions
        ues: ue-000001
        seconds: 60
    checks: []
  - name: lose_first_tower
    events:
      - type: disconnect_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Offline
        seconds: 180
      - type: traffic
        ues: ue-000002
        amount_mb: 3
    checks:
      - type: node_status_equals
        nodes: tower-site-001-001
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
  - name: recover_first_tower
    events:
      - type: reconnect_nodes
        nodes: tower-site-001-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Online
        seconds: 300
      - type: start_ues
        ues: ue-000001
      - type: wait_ues_attached
        ues: ue-000001
        seconds: 180
      - type: wait_ue_sessions
        ues: ue-000001
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 2
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 2
  - type: payment_entitlement_reconciles
    ues: all
    package: base
