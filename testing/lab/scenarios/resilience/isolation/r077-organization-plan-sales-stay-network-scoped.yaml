version: 1
name: r077-organization-plan-sales-stay-network-scoped
description: Sell one organization plan in two networks, then add an extra sale in only one; the shared catalog must not merge network revenue or SIM queues.
seed: 6177
suite: resilience
priority: p1
tags: [virtual, isolation, backend-only, network-isolation, organization-plan]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: org_plan
    name: Resilience Org Plan
    data_mb: 100
    duration_days: 1
    amount: 3.0
    currency: USD
    country: USA
    assign_percent: 0
    scope: organization
phases:
  - name: sell_shared_plan
    events:
      - type: purchase_package
        ues: all
        package: org_plan
      - type: purchase_package
        ues: ue-000001
        package: org_plan
    checks:
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 3
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: org_plan
        expected_count: 3
        immediate: true
      - type: package_visible
        package: org_plan
        networks: net-001
        immediate: true
      - type: package_visible
        package: org_plan
        networks: net-002
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 7.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-002
    expected_value: 4.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: performance_report_cell
    report: package_performance
    span: daily
    networks: net-001
    package: org_plan
    column: revenue
    expected_value: 6.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: performance_report_cell
    report: package_performance
    span: daily
    networks: net-002
    package: org_plan
    column: revenue
    expected_value: 3.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
