version: 1
name: r079-repeated-console-reads-do-not-create-sales
description: Repeatedly read subscriber, payment, entitlement, and revenue views after one top-up; all views must retain the same two sales and two assignments.
seed: 6179
suite: resilience
priority: p1
tags: [virtual, isolation, backend-only, read-stability]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: purchase
    events:
      - type: purchase_package
        ues: all
        package: next
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_equals
        ues: all
        package: next
        status: settled
        payment_method: cash
        currency: USD
        expected_value: 2.0
        tolerance: 0.001
        required: true
        immediate: true
  - name: refresh_1
    events:
      - type: wait
        seconds: 2
    checks:
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 2
        immediate: true
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        expected_value: 3.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: entity_reconciles
        entity: subscriber
        ref: sub-000001
        immediate: true
  - name: refresh_2
    events:
      - type: wait
        seconds: 2
    checks:
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 2
        immediate: true
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        expected_value: 3.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: entity_reconciles
        entity: subscriber
        ref: sub-000001
        immediate: true
  - name: refresh_3
    events:
      - type: wait
        seconds: 2
    checks:
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 2
        immediate: true
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        expected_value: 3.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: entity_reconciles
        entity: subscriber
        ref: sub-000001
        immediate: true
final_checks:
  - type: payment_entitlement_reconciles
    ues: all
    package: next
