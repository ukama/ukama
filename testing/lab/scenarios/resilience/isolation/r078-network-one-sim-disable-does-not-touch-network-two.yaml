version: 1
name: r078-network-one-sim-disable-does-not-touch-network-two
description: Change one network SIM service status repeatedly while the second network SIM remains enabled with its original paid entitlement.
seed: 6178
suite: resilience
priority: p1
tags: [virtual, isolation, backend-only, network-isolation]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
phases:
  - name: known_states
    events:
      - type: toggle_sim_status
        ues: all
        status: service_on
      - type: wait_sim_status
        ues: all
        status: service_on
        seconds: 120
    checks: []
  - name: disable_first
    events:
      - type: toggle_sim_status
        ues: ue-000001
        status: service_off
      - type: wait_sim_status
        ues: ue-000001
        status: service_off
        seconds: 120
      - type: wait_sim_status
        ues: ue-000002
        status: service_on
        seconds: 120
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: restore_first
    events:
      - type: toggle_sim_status
        ues: ue-000001
        status: service_on
      - type: wait_sim_status
        ues: ue-000001
        status: service_on
        seconds: 120
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: payment_count
    ues: ue-000001
    package: base
    expected_count: 1
  - type: payment_count
    ues: ue-000002
    package: base
    expected_count: 1
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 1.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-002
    expected_value: 1.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
