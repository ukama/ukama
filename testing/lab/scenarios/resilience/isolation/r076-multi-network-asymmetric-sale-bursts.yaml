version: 1
name: r076-multi-network-asymmetric-sale-bursts
description: Different top-up counts in two networks must preserve separate entitlements, receipts, revenue, and customer lists.
seed: 6176
suite: resilience
priority: p1
tags: [virtual, isolation, backend-only, network-isolation]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: first_network
    events:
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
    checks:
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 6
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: second_network
    events:
      - type: purchase_package
        ues: ue-000002
        package: next
      - type: purchase_package
        ues: ue-000002
        package: next
    checks:
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 3
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: ue-000001
        package: next
        expected_count: 5
        immediate: true
      - type: payment_count
        ues: ue-000002
        package: next
        expected_count: 2
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 11.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-002
    expected_value: 5.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: list_count_equals
    target: sims
    networks: net-001
    expected_count: 1
  - type: list_count_equals
    target: sims
    networks: net-002
    expected_count: 1
  - type: list_count_equals
    target: subscribers
    networks: net-001
    expected_count: 1
  - type: list_count_equals
    target: subscribers
    networks: net-002
    expected_count: 1
