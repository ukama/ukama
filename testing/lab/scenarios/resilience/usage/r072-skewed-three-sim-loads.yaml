version: 1
name: r072-skewed-three-sim-loads
description: One idle SIM and two SIMs with unequal traffic must retain distinct usage rows; one heavy user must not inflate the idle or light user.
seed: 6172
suite: resilience
priority: p1
tags: [virtual, usage, runtime, isolation]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 3
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: mixed_load
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: ue-000002
        amount_mb: 1
      - type: traffic
        ues: ue-000003
        amount_mb: 20
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: usage_aggregate
    target: network
    networks: all
    expected: from_model
    tolerance_percent: 15
  - type: payment_count
    ues: all
    package: base
    expected_count: 3
