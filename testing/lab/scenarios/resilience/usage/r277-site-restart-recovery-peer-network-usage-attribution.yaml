version: 1
name: r277-site-restart-recovery-peer-network-usage-attribution
description: After site-restart recovery with peer-network, unequal traffic must reconcile to the correct SIM and aggregate without replaying usage or creating a sale.
seed: 6377
suite: resilience
priority: p1
tags: [virtual, usage, runtime, accounting, isolation]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 1
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: ue-000001
        amount_mb: 2
      - type: traffic
        ues: ue-000002
        amount_mb: 5
      - type: finalize_ue_sessions
        ues: ue-000001
        seconds: 60
    checks: []
  - name: disrupt
    events:
      - type: failure_control
        target: site_restart
        state: 'on'
      - type: restart_site
        sites: site-001
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Offline
        seconds: 180
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Offline
        seconds: 180
      - type: wait_node_connectivity
        nodes: controller-site-001-001
        connectivity: Offline
        seconds: 180
      - type: traffic
        ues: ue-000002
        amount_mb: 3
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: recover
    events:
      - type: failure_control
        target: site_restart
        state: 'off'
      - type: wait_node_connectivity
        nodes: tower-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_node_connectivity
        nodes: amplifier-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_node_connectivity
        nodes: controller-site-001-001
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
      - type: toggle_service
        sites: site-001
        state: 'on'
      - type: start_ues
        ues: ue-000001
      - type: wait_ues_attached
        ues: ue-000001
        seconds: 180
      - type: wait_ue_sessions
        ues: ue-000001
        seconds: 90
      - type: traffic
        ues: ue-000001
        amount_mb: 7
      - type: traffic
        ues: ue-000002
        amount_mb: 1
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: usage_aggregate
    target: network
    networks: net-001
    expected: from_model
    tolerance_percent: 15
  - type: payment_count
    ues: ue-000001
    package: base
    expected_count: 1
  - type: usage_aggregate
    target: network
    networks: net-002
    expected: from_model
    tolerance_percent: 15
  - type: payment_count
    ues: ue-000002
    package: base
    expected_count: 1
