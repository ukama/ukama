version: 1
name: r013-deactivation-keeps-paid-entitlement
description: Deactivate a sold catalog plan; its existing entitlement and payment must remain while another purchase is rejected.
seed: 6113
suite: resilience
priority: p1
tags: [virtual, catalog, backend-only, negative, history]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
phases:
  - name: deactivate
    events:
      - type: set_package_active
        package: base
        active: false
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_equals
        ues: all
        package: base
        status: settled
        payment_method: cash
        currency: USD
        expected_value: 1.0
        tolerance: 0.001
        required: true
        immediate: true
  - name: reject_new_sale
    events:
      - type: purchase_package
        ues: all
        package: base
        expect:
          result: failure
    checks:
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 1
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 1.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: payment_entitlement_reconciles
    ues: all
    package: base
