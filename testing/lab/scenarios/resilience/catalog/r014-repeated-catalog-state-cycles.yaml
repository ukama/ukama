version: 1
name: r014-repeated-catalog-state-cycles
description: Three plan deactivate/reactivate cycles must preserve the same catalog record and all unchanged fields.
seed: 6114
suite: resilience
priority: p1
tags: [virtual, catalog, backend-only, repeat]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
setup:
  create_via_bff: [networks, packages]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
phases:
  - name: deactivate_1
    events:
      - type: set_package_active
        package: base
        active: false
    checks:
      - type: package_fields_equal
        package: base
        networks: all
        immediate: true
      - type: list_count_equals
        target: packages
        networks: net-001
        expected_count: 1
        immediate: true
  - name: reactivate_1
    events:
      - type: set_package_active
        package: base
        active: true
    checks:
      - type: package_fields_equal
        package: base
        networks: all
        immediate: true
      - type: list_count_equals
        target: packages
        networks: net-001
        expected_count: 1
        immediate: true
  - name: deactivate_2
    events:
      - type: set_package_active
        package: base
        active: false
    checks:
      - type: package_fields_equal
        package: base
        networks: all
        immediate: true
      - type: list_count_equals
        target: packages
        networks: net-001
        expected_count: 1
        immediate: true
  - name: reactivate_2
    events:
      - type: set_package_active
        package: base
        active: true
    checks:
      - type: package_fields_equal
        package: base
        networks: all
        immediate: true
      - type: list_count_equals
        target: packages
        networks: net-001
        expected_count: 1
        immediate: true
  - name: deactivate_3
    events:
      - type: set_package_active
        package: base
        active: false
    checks:
      - type: package_fields_equal
        package: base
        networks: all
        immediate: true
      - type: list_count_equals
        target: packages
        networks: net-001
        expected_count: 1
        immediate: true
  - name: reactivate_3
    events:
      - type: set_package_active
        package: base
        active: true
    checks:
      - type: package_fields_equal
        package: base
        networks: all
        immediate: true
      - type: list_count_equals
        target: packages
        networks: net-001
        expected_count: 1
        immediate: true
