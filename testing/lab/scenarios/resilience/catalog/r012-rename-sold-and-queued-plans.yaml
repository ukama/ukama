version: 1
name: r012-rename-sold-and-queued-plans
description: Rename both an active sold plan and a queued paid plan; catalog identity, receipt amounts, and the entitlement chain must survive.
seed: 6112
suite: resilience
priority: p1
tags: [virtual, catalog, backend-only, history]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 3.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: queue
    events:
      - type: purchase_package
        ues: all
        package: next
    checks:
      - type: payment_equals
        ues: all
        package: next
        status: settled
        payment_method: cash
        currency: USD
        expected_value: 3.0
        tolerance: 0.001
        required: true
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: rename
    events:
      - type: update_package
        package: base
        name: Resilience current ${ULAB_RESILIENCE_NAME_SUFFIX}
      - type: update_package
        package: next
        name: Resilience queued ${ULAB_RESILIENCE_NAME_SUFFIX}
    checks:
      - type: package_fields_equal
        package: base
        networks: all
        immediate: true
      - type: package_fields_equal
        package: next
        networks: all
        immediate: true
      - type: package_state
        ues: all
        package: base
        expected: active
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_state
        ues: all
        package: next
        expected: queued
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_chain
        ues: all
        package: base
        expected: all
        expected_count: 2
        immediate: true
final_checks:
  - type: payment_count
    ues: all
    package: base
    expected_count: 1
  - type: payment_count
    ues: all
    package: next
    expected_count: 1
  - type: payment_entitlement_reconciles
    ues: all
    package: base
  - type: payment_entitlement_reconciles
    ues: all
    package: next
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 4.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
