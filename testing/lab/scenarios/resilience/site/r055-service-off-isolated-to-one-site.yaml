version: 1
name: r055-service-off-isolated-to-one-site
description: Disable cellular service on one site while the other keeps its session and traffic; restoring the first site must preserve both usage totals.
seed: 6155
suite: resilience
priority: p1
tags: [virtual, site, runtime, isolation, maintenance]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  ues_per_site: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline
    events:
      - type: toggle_service
        sites: all
        state: 'on'
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 180
      - type: wait_ue_sessions
        ues: all
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 1
      - type: finalize_ue_sessions
        ues: ue-000001
        seconds: 60
    checks: []
  - name: disable_first
    events:
      - type: toggle_service
        sites: site-001
        state: 'off'
      - type: start_ues
        ues: ue-000001
      - type: wait_ues_attached
        ues: ue-000001
        seconds: 20
        expect:
          result: failure
          error_contains: script failed
      - type: traffic
        ues: ue-000002
        amount_mb: 3
    checks:
      - type: site_node_counts_equals
        sites: site-002
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: all
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: restore_first
    events:
      - type: toggle_service
        sites: site-001
        state: 'on'
      - type: start_ues
        ues: ue-000001
      - type: wait_ues_attached
        ues: ue-000001
        seconds: 180
      - type: wait_ue_sessions
        ues: ue-000001
        seconds: 90
      - type: traffic
        ues: all
        amount_mb: 2
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
final_checks:
  - type: usage_per_sim
    ues: all
    expected: from_model
    tolerance_percent: 2
    timeout_seconds: 300
    poll_seconds: 5
  - type: payment_count
    ues: all
    package: base
    expected_count: 2
  - type: payment_entitlement_reconciles
    ues: all
    package: base
