version: 1
name: r098-offline-site-rejects-restart-site
description: With all site nodes disconnected, reject restart site and show unavailable actions with reasons; reconnect and recover normal action availability.
seed: 6198
suite: resilience
priority: p1
tags: [virtual, site, nodes, negative, availability]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  ues_per_site: 0
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: make_offline
    events:
      - type: disconnect_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 180
    checks:
      - type: site_node_counts_equals
        sites: site-001
        total: 3
        online: 0
        offline: 3
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        restart_available: false
        rf_available: false
        service_available: false
        restart_reason: present
        rf_reason: present
        service_reason: present
        immediate: true
  - name: reject_offline_action
    events:
      - type: restart_site
        sites: all
        expect:
          result: failure
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Offline
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 30
        poll_seconds: 2
        immediate: true
  - name: recover
    events:
      - type: reconnect_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 180
        poll_seconds: 2
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        poll_seconds: 2
        restart_available: true
        rf_available: true
        service_available: true
        immediate: true
