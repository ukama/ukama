version: 1
name: r329-monthly-revenue-series-after-rejected-sale
description: Monthly revenue series after rejected-sale must keep ordered buckets and computation metadata, with exactly three dollars of settled facts and no duplicated sale.
seed: 6429
suite: resilience
priority: p1
tags: [virtual, analytics, backend-only, analytics, time-series, history, contract]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: mutate
    events:
      - type: purchase_package
        ues: all
        package: next
      - type: purchase_package
        ues: all
        package: next
        amount: 0.01
        expect:
          result: failure
    checks:
      - type: package_assignment_count
        ues: all
        expected_count: 2
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 1
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
  - name: series_converges
    checks:
      - type: kpi_timeseries
        key: REVENUE
        span: monthly
        op: SUM
        networks: net-001
        value_state: non_zero
        expected_value: 3.0
        tolerance: 0.001
        require_computed_at: true
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_state_equals
        key: REVENUE
        span: monthly
        op: SUM
        networks: net-001
        scope_key: network_id
        value_state: available
        timeout_seconds: 600
        immediate: true
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        expected_value: 3.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
  - name: stable_read
    events:
      - type: wait
        seconds: 10
    checks:
      - type: kpi_timeseries
        key: REVENUE
        span: monthly
        op: SUM
        networks: net-001
        value_state: non_zero
        expected_value: 3.0
        tolerance: 0.001
        require_computed_at: true
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_state_equals
        key: REVENUE
        span: monthly
        op: SUM
        networks: net-001
        scope_key: network_id
        value_state: available
        timeout_seconds: 600
        immediate: true
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        expected_value: 3.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
