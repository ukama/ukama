version: 1
name: r301-network-catalog-remove-entitlements-historical-metrics
description: With network catalog scope, remove-entitlements must preserve cash truth across sales, distinct paid customers, package revenue, and daily/weekly/monthly network revenue.
seed: 6401
suite: resilience
priority: p1
tags: [virtual, analytics, backend-only, analytics, history]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 2
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 1.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 0
    scope: network
  - ref: other
    name: Resilience Other
    data_mb: 100
    duration_days: 1
    amount: 3.0
    currency: USD
    country: USA
    assign_percent: 0
    scope: network
phases:
  - name: mutate
    events:
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: remove_package_from_sim
        ues: ue-000001
    checks:
      - type: payment_count
        ues: all
        package: base
        expected_count: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 0
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
  - name: converge_analytics
    checks:
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        expected_value: 4.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_rollup_consistency
        key: REVENUE
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 4.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_value
        key: PAID_CUSTOMERS
        span: daily
        op: LAST
        networks: net-001
        scope_key: network_id
        expected_value: 2
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: next
        column: sold
        expected_value: 1
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: next
        column: revenue
        expected_value: 2
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_contract
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        scope_key: network_id
        expected_value: 4.0
        tolerance: 0.001
        expected_partial: true
        require_computed_at: true
        require_scope: true
        timeout_seconds: 600
        immediate: true
  - name: repeated_reads
    events:
      - type: wait
        seconds: 10
    checks:
      - type: payment_count
        ues: all
        package: base
        expected_count: 2
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 1
        immediate: true
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 0
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000002
        expected_count: 1
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        expected_value: 4.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_rollup_consistency
        key: REVENUE
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 4.0
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_value
        key: PAID_CUSTOMERS
        span: daily
        op: LAST
        networks: net-001
        scope_key: network_id
        expected_value: 2
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: next
        column: sold
        expected_value: 1
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: next
        column: revenue
        expected_value: 2
        tolerance: 0.001
        timeout_seconds: 600
        poll_seconds: 5
        immediate: true
      - type: kpi_contract
        key: REVENUE
        span: daily
        op: SUM
        networks: net-001
        scope_key: network_id
        expected_value: 4.0
        tolerance: 0.001
        expected_partial: true
        require_computed_at: true
        require_scope: true
        timeout_seconds: 600
        immediate: true
