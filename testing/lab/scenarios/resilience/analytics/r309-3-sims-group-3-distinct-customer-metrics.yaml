version: 1
name: r309-3-sims-group-3-distinct-customer-metrics
description: 3 SIMs grouped by 3, including partial groups, must count 1 paying subscribers after two extra purchases; ARPU must use subscriber count.
seed: 6409
suite: resilience
priority: p1
tags: [virtual, analytics, backend-only, analytics, boundary, multi-sim, contract]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
  sims_per_network: 3
  sims_per_subscriber: 3
setup:
  create_via_bff: [networks, packages, subscribers, sims]
packages:
  - ref: base
    name: Resilience Base
    data_mb: 100
    duration_days: 1
    amount: 2.0
    currency: USD
    country: USA
    assign_percent: 100
  - ref: next
    name: Resilience Next
    data_mb: 100
    duration_days: 1
    amount: 3.0
    currency: USD
    country: USA
    assign_percent: 0
phases:
  - name: asymmetric_topups
    events:
      - type: purchase_package
        ues: ue-000001
        package: next
      - type: purchase_package
        ues: ue-000001
        package: next
    checks:
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 3
        immediate: true
      - type: list_count_equals
        target: subscribers
        networks: net-001
        expected_count: 1
        immediate: true
      - type: payment_count
        ues: all
        package: base
        expected_count: 3
        immediate: true
      - type: payment_count
        ues: all
        package: next
        expected_count: 2
        immediate: true
      - type: package_assignment_count
        ues: ue-000001
        expected_count: 3
        timeout_seconds: 120
        poll_seconds: 2
        immediate: true
final_checks:
  - type: kpi_value
    key: REVENUE
    span: daily
    op: SUM
    networks: net-001
    expected_value: 12.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: kpi_value
    key: PAID_CUSTOMERS
    span: daily
    op: LAST
    networks: net-001
    scope_key: network_id
    expected_value: 1
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: kpi_value
    key: ARPU
    span: monthly
    op: AVG
    networks: net-001
    scope_key: network_id
    expected_value: 12.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
  - type: kpi_rollup_consistency
    key: REVENUE
    op: SUM
    scope_key: network_id
    networks: net-001
    expected_value: 12.0
    tolerance: 0.001
    timeout_seconds: 600
    poll_seconds: 5
