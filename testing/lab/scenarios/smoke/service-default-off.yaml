version: 1
name: service-default-off
description: Verify a newly started node keeps service disabled by default, so a UE cannot attach or pass traffic.
seed: 320
suite: smoke
priority: p0
tags: [virtual, runtime, service]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_default_service_off
    events:
      - type: start_ues
        ues: ue-000001
      - type: wait_ues_attached
        ues: ue-000001
        seconds: 15
        expect:
          result: failure
    checks:
      - type: traffic_unavailable
        ues: ue-000001
        amount_mb: 1

final_checks:
  - type: backend_count
    target: sims
    expected: 1
  - type: balance_non_negative
    ues: all
