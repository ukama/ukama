version: 1
name: smoke-radio-on-off
description: Verify BFF radio off blocks traffic and radio on restores it.
seed: 4
suite: smoke
priority: p0
tags: [virtual, runtime, site, radio]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes, ues]
  wait: [nodes_ready, ues_attached]

phases:
  - name: radio_baseline
    checks:
      - type: traffic_allowed
        ues: all
        amount_mb: 1

  - name: radio_off
    events:
      - type: toggle_radio
        sites: all
        state: off
    checks:
      - type: traffic_blocked
        ues: all
        amount_mb: 1

  - name: radio_on
    events:
      - type: toggle_radio
        sites: all
        state: on
      - type: wait_ues_attached
        ues: all
    checks:
      - type: traffic_allowed
        ues: all
        amount_mb: 1

final_checks:
  - type: backend_count
    target: sites
    expected: 1
  - type: status_equals
    entity: sim
    ref: ue-000001
    status: active
  - type: package_active
    ues: all
    package: daily_1gb
  - type: balance_non_negative
    ues: all
