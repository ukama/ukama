version: 1
name: service-disable-blocks-ues
description: Verify disabling service blocks traffic for an attached UE and prevents a second UE from attaching or passing traffic.
seed: 322
suite: smoke
priority: p0
tags: [virtual, runtime, service, traffic]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: attach_existing_ue
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: ue-000001
      - type: wait_ues_attached
        ues: ue-000001
    checks:
      - type: traffic_allowed
        ues: ue-000001
        amount_mb: 1

  - name: disable_service
    events:
      - type: toggle_service
        sites: all
        state: off
    checks:
      - type: traffic_blocked
        ues: ue-000001
        amount_mb: 1

  - name: reject_new_ue
    events:
      - type: start_ues
        ues: ue-000002
      - type: wait_ues_attached
        ues: ue-000002
        seconds: 15
        expect:
          result: failure
    checks:
      - type: traffic_blocked
        ues: ue-000002
        amount_mb: 1

final_checks:
  - type: backend_count
    target: sims
    expected: 2
  - type: balance_non_negative
    ues: all
