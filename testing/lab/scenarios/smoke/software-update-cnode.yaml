version: 1
name: software-update-cnode
description: Verify an example app starts healthy on the expected current version, updates successfully on the cnode, and returns healthy on the requested target version without creating subscriber, SIM, package, or UE resources.
seed: 331
suite: smoke
priority: p0
tags: [virtual, software-update, cnode, app-health]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

# Test fixture values:
# - the cnode image must initially run example at v1.0.0
# - v2.0.0 must exist in the software registry used by the test BFF
phases:
  - name: verify_example_app_before_update
    checks:
      - type: node_health_ok
        type_selector: controller
        app: example
      - type: node_version_equals
        type_selector: controller
        app: example
        version: v1.0.0

  - name: update_example_app_on_cnode
    events:
      - type: software_update
        type_selector: controller
        app: example
        tag: v2.0.0
    checks:
      - type: node_version_equals
        type_selector: controller
        app: example
        version: v2.0.0
      - type: node_health_ok
        type_selector: controller
        app: example
