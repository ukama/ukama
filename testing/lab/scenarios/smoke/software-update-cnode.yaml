version: 1
name: software-update-cnode
description: Verify the example app is healthy at the expected current version, update it on the controller node from an exact tar.gz artifact in Hub, and confirm the running version and health after the update.
seed: 331
suite: smoke
priority: p1
tags: [virtual, software-update, controller, example]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_example_before_update
    checks:
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example

      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}

  - name: update_example
    events:
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}

    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}

      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
