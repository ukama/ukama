version: 1
name: smoke-node-restart
description: Verify a tower reports Online, transitions Offline after restart, returns Online, and then recovers UE attachment and traffic.
seed: 2
suite: smoke
priority: p0
tags: [virtual, runtime, node, restart]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes, ues]
  wait: [nodes_ready, ues_attached]

phases:
  - name: before_restart
    events:
      - type: wait_node_connectivity
        type_selector: tower
        count_per_network: 1
        connectivity: Online
        seconds: 120
    checks:
      - type: traffic_allowed
        ues: all
        amount_mb: 1

  - name: restart_tower
    events:
      - type: restart_nodes
        type_selector: tower
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: tower
        count_per_network: 1
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        type_selector: tower
        count_per_network: 1
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        type_selector: tower
        count_per_network: 1
      - type: wait_ues_attached
        ues: all
    checks:
      - type: traffic_allowed
        ues: all
        amount_mb: 1

final_checks:
  - type: backend_count
    target: nodes
    expected: 3
  - type: status_equals
    entity: node
    ref: tower-site-001-001
    status: Online
  - type: status_equals
    entity: sim
    ref: ue-000001
    status: active
  - type: package_active
    ues: all
    package: daily_1gb
  - type: balance_non_negative
    ues: all
