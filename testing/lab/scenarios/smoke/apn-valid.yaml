version: 1
name: apn-valid
description: Verify a mixed-case supported APN becomes internet in the UE, EPCEMU and PCRF PDN.
seed: 320
suite: smoke
priority: p0
tags: [virtual, runtime, apn]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: attach_valid_apn
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
        apn: InTeRnEt
      - type: wait_ues_attached
        ues: all
        seconds: 60
    checks:
      - type: ue_pdn
        ues: all
        expected: allowed
        apn: internet
      - type: traffic_allowed
        ues: all
        amount_mb: 1
