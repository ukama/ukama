version: 1
name: one-site-one-ue
description: Verify end-to-end setup, UE attach, 100 MB traffic, usage, SIM state, and package state.
seed: 1
suite: smoke
priority: p0
tags: [runtime, bff, sim]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        rf_available: true
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: first_usage
    events:
      - type: toggle_radio
        sites: all
        state: on
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 300
      - type: traffic
        ues: all
        amount_mb: 100
    checks:
      - type: usage_per_sim
        ues: all
        expected: from_model
        tolerance_percent: 2

final_checks:
  - type: backend_count
    target: networks
    expected: 1
  - type: backend_count
    target: sites
    expected: 1
  - type: backend_count
    target: nodes
    expected: 3
  - type: backend_count
    target: sims
    expected: 1
  - type: list_contains
    view: sims
    ref: ue-000001
  - type: status_equals
    entity: sim
    ref: ue-000001
    status: active
  - type: package_active
    ues: all
    package: daily_1gb
  - type: balance_non_negative
    ues: all
