version: 2
name: p0-webapp-site-detail-network-switch
description: Switch from site detail and assert the new list without corrective navigation.
seed: 4810
suite: webapp
priority: p0
status: active
tags: [webapp, inventory, local]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 2
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_webapp: [networks, sites]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: detail
    events:
      - type: web_open
        view: network_site_detail
        networks: net-001
        sites: site-001
    checks:
      - type: web_inventory_equals
        view: network_site_detail
        networks: net-001
        label: Path
        requirement: WEB-SHELL-003
        sites: site-001
        expected_property: path
  - name: switch
    events:
      - type: web_inventory
        view: network_sites
        networks: net-002
        action: switch
    checks:
      - type: web_inventory_equals
        view: network_sites
        networks: net-002
        label: Path
        requirement: WEB-SHELL-003
        expected_property: path
      - type: web_inventory_equals
        view: network_sites
        networks: net-002
        label: Selected network
        requirement: WEB-SHELL-003
        expected_property: network_name
      - type: web_inventory_equals
        view: network_sites
        networks: net-002
        label: Site names
        requirement: WEB-SHELL-003
        expected_property: site_names
