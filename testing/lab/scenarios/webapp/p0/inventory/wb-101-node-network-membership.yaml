version: 2
name: p0-webapp-node-network-membership
description: Check complete node membership and counts in each network after switching and reload.
seed: 4810
suite: webapp
priority: p1
status: active
tags: [webapp, inventory, local]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 2
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
setup:
  create_via_webapp: [networks, sites]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: network-one
    events:
      - type: web_open
        view: network_nodes
        networks: net-001
    checks:
      - type: web_inventory_equals
        view: network_nodes
        networks: net-001
        label: Node IDs
        requirement: WEB-NODE-004
        expected_property: node_ids
      - type: web_inventory_equals
        view: network_nodes
        networks: net-001
        label: Header count
        requirement: WEB-NODE-004
        expected: '3'
  - name: network-two
    events:
      - type: web_inventory
        view: network_nodes
        networks: net-002
        action: switch
    checks:
      - type: web_inventory_equals
        view: network_nodes
        networks: net-002
        label: Node IDs
        requirement: WEB-NODE-004
        expected_property: node_ids
      - type: web_inventory_equals
        view: network_nodes
        networks: net-002
        label: Header count
        requirement: WEB-NODE-004
        expected: '3'
  - name: reload
    events:
      - type: web_reload
    checks:
      - type: web_inventory_equals
        view: network_nodes
        networks: net-002
        label: Node IDs
        requirement: WEB-NODE-004
        expected_property: node_ids
