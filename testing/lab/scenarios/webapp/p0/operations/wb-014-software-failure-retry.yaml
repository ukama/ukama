version: 2
name: p0-webapp-software-failure-retry
description: Interrupt an in-progress update, verify a visible failure and released lock, then explicitly retry the same target.
seed: 4914
suite: webapp
priority: p0
status: active
tags: [webapp, virtual, operations]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  auth_state: .auth/owner.json
  browser: chromium
  headless: true
  action_timeout_seconds: 30
  check_timeout_seconds: 180
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: published_release_is_visible
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
        action: "open_software"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Current version"
        expected: "${ULAB_SOFTWARE_CURRENT_VERSION}"
        requirement: "WEB-NODE-007"
        app: "example"
        timeout_seconds: 600
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Target version"
        expected: "${ULAB_SOFTWARE_TARGET_VERSION}"
        requirement: "WEB-NODE-007"
        app: "example"
        timeout_seconds: 600
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Software status"
        expected: "Update available"
        requirement: "WEB-NODE-007"
        app: "example"
        timeout_seconds: 600
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Update Now"
        available: true
        requirement: "WEB-OPS-009"
        app: "example"
  - name: request_update
    events:
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
        action: "update_software"
        app: "example"
        tag: "${ULAB_SOFTWARE_TARGET_VERSION}"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Software status"
        expected: "Updating…"
        requirement: "WEB-OPS-009"
        app: "example"
        timeout_seconds: 600
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: false
        requirement: "WEB-OPS-009"
  - name: disconnect
    events:
      - type: "disconnect_nodes"
        nodes: "controller-site-001-001"
      - type: "web_reload"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Connectivity"
        expected: "Offline"
        requirement: "WEB-OPS-011"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Lifecycle"
        expected: "Operational"
        requirement: "WEB-NODE-003"
  - name: reconnect
    events:
      - type: "reconnect_nodes"
        nodes: "controller-site-001-001"
      - type: "web_reload"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
        action: "open_software"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Connectivity"
        expected: "Online"
        requirement: "WEB-OPS-011"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Software status"
        expected: "Update failed"
        requirement: "WEB-OPS-011"
        app: "example"
        timeout_seconds: 600
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Current version"
        expected: "${ULAB_SOFTWARE_CURRENT_VERSION}"
        requirement: "WEB-OPS-011"
        app: "example"
        timeout_seconds: 600
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Target version"
        expected: "${ULAB_SOFTWARE_TARGET_VERSION}"
        requirement: "WEB-OPS-011"
        app: "example"
        timeout_seconds: 600
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Retry update"
        available: true
        requirement: "WEB-OPS-011"
        app: "example"
        timeout_seconds: 600
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: true
        requirement: "WEB-OPS-011"
  - name: explicit_retry
    events:
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
        action: "retry_update"
        app: "example"
        tag: "${ULAB_SOFTWARE_TARGET_VERSION}"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Software status"
        expected: "Updating…"
        requirement: "WEB-OPS-011"
        app: "example"
        timeout_seconds: 600
  - name: terminal_version_and_unlock
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Software status"
        expected: "Up to date"
        requirement: "WEB-OPS-009"
        app: "example"
        timeout_seconds: 600
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Current version"
        expected: "${ULAB_SOFTWARE_TARGET_VERSION}"
        requirement: "WEB-OPS-009"
        app: "example"
        timeout_seconds: 600
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: true
        requirement: "WEB-OPS-009"
        timeout_seconds: 600
