version: 2
name: p0-webapp-optimistic-timeout
description: Controlled idle status reads exercise the ten-second optimistic lock fallback, then restore reads and allow one explicit legitimate retry. Backend lease expiry remains separate.
seed: 5114
suite: webapp
priority: p0
status: active
tags: [webapp, virtual, operations]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  auth_state: .auth/owner.json
  browser: chromium
  headless: true
  action_timeout_seconds: 30
  check_timeout_seconds: 180
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: arm_idle_reads
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "status_fault"
        value: "idle"
      - type: "web_reload"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Status fault"
        expected: "idle:applied"
        requirement: "WEB-OPS-011"
  - name: observe_timeout
    events:
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "watch_timeout"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "open_restart"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "confirm_restart"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Optimistic timeout"
        expected: "complete"
        requirement: "WEB-OPS-011"
        timeout_seconds: 30
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: true
        requirement: "WEB-OPS-011"
  - name: restore_reads_and_retry
    events:
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "status_fault"
        value: "none"
      - type: "web_reload"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "open_restart"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "confirm_restart"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Restart progress"
        expected: "Restarting…"
        requirement: "WEB-OPS-011"
  - name: retry_recovery
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Restart progress"
        expected: "Restart node"
        requirement: "WEB-OPS-011"
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: true
        requirement: "WEB-OPS-011"
