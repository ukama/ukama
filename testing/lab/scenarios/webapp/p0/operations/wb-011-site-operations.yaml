version: 2
name: p0-webapp-site-operations
description: Require the exact site name, confirm reported radio and cellular changes, restart and inspect recovered nodes.
seed: 4911
suite: webapp
priority: p0
status: active
tags: [webapp, virtual, operations]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  auth_state: .auth/owner.json
  browser: chromium
  headless: true
  action_timeout_seconds: 30
  check_timeout_seconds: 180
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: open_menu
    events:
      - type: "web_open"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "open_site_actions"
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Restart site"
        available: true
        requirement: "WEB-OPS-003"
  - name: name_required
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "open_restart"
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Confirm restart"
        available: false
        requirement: "WEB-OPS-003"
  - name: wrong_name
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "fill_confirmation"
        value: "not-the-site-name"
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Confirm restart"
        available: false
        requirement: "WEB-OPS-003"
  - name: exact_name
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "fill_confirmation"
        value_from: "site_name"
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Confirm restart"
        available: true
        requirement: "WEB-OPS-003"
  - name: cancel_and_reopen_menu
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "cancel_dialog"
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "open_site_actions"
    checks:
      - type: "web_field_equals"
        view: "network_site_detail"
        label: "Dialog"
        expected: "closed"
        requirement: "WEB-OPS-003"
  - name: set_radio_off_ready
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Radio"
        available: true
        requirement: "WEB-OPS-007"
  - name: set_radio_off
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "set_radio"
        value: "off"
    checks:
      - type: "web_field_equals"
        view: "network_site_detail"
        label: "Radio state"
        expected: "Off"
        requirement: "WEB-OPS-007"
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Radio"
        available: true
        requirement: "WEB-OPS-007"
  - name: set_radio_on_ready
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Radio"
        available: true
        requirement: "WEB-OPS-007"
  - name: set_radio_on
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "set_radio"
        value: "on"
    checks:
      - type: "web_field_equals"
        view: "network_site_detail"
        label: "Radio state"
        expected: "On"
        requirement: "WEB-OPS-007"
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Radio"
        available: true
        requirement: "WEB-OPS-007"
  - name: set_service_off_ready
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Cellular"
        available: true
        requirement: "WEB-OPS-007"
  - name: set_service_off
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "set_service"
        value: "off"
    checks:
      - type: "web_field_equals"
        view: "network_site_detail"
        label: "Cellular state"
        expected: "Off"
        requirement: "WEB-OPS-007"
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Cellular"
        available: true
        requirement: "WEB-OPS-007"
  - name: set_service_on_ready
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Cellular"
        available: true
        requirement: "WEB-OPS-007"
  - name: set_service_on
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "set_service"
        value: "on"
    checks:
      - type: "web_field_equals"
        view: "network_site_detail"
        label: "Cellular state"
        expected: "On"
        requirement: "WEB-OPS-007"
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Cellular"
        available: true
        requirement: "WEB-OPS-007"
  - name: restart_site
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "open_restart"
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "fill_confirmation"
        value_from: "site_name"
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "confirm_restart"
    checks:
      - type: "web_field_equals"
        view: "network_site_detail"
        label: "Restart progress"
        expected: "Site actions • busy"
        requirement: "WEB-OPS-003"
  - name: site_busy
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "open_site_actions"
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Restart site"
        available: false
        requirement: "WEB-OPS-005"
  - name: site_released
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Restart site"
        available: true
        requirement: "WEB-OPS-004"
        timeout_seconds: 900
  - name: close_menu
    events:
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "close_site_actions"
  - name: recover_tower-site-001-001
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Connectivity"
        expected: "Online"
        requirement: "WEB-OPS-004"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Lifecycle"
        expected: "Operational"
        requirement: "WEB-OPS-004"
  - name: recover_amplifier-site-001-001
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "amplifier-site-001-001"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Connectivity"
        expected: "Online"
        requirement: "WEB-OPS-004"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Lifecycle"
        expected: "Operational"
        requirement: "WEB-OPS-004"
  - name: recover_controller-site-001-001
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Connectivity"
        expected: "Online"
        requirement: "WEB-OPS-004"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Lifecycle"
        expected: "Operational"
        requirement: "WEB-OPS-004"
