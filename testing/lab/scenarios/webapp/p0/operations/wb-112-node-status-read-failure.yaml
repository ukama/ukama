version: 2
name: p0-webapp-node-status-read-failure
description: Controlled exact-entity operation-status read failure must disable visible actions with a reason, then recover after restoring real reads.
seed: 5112
suite: webapp
priority: p0
status: active
tags: [webapp, virtual, operations]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  auth_state: .auth/owner.json
  browser: chromium
  headless: true
  action_timeout_seconds: 30
  check_timeout_seconds: 180
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: arm_read_error
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "status_fault"
        value: "read_error"
      - type: "web_reload"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Status fault"
        expected: "read_error:applied"
        requirement: "WEB-OPS-013"
  - name: unknown_is_not_safe
    checks:
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: false
        requirement: "WEB-OPS-013"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Restart reason"
        expected: "Cannot verify operation status"
        requirement: "WEB-OPS-013"
  - name: read_recovers
    events:
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
        action: "status_fault"
        value: "none"
      - type: "web_reload"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Status fault"
        expected: "none"
        requirement: "WEB-OPS-013"
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: true
        requirement: "WEB-OPS-013"
