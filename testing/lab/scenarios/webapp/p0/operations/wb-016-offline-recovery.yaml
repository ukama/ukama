version: 2
name: p0-webapp-offline-recovery
description: Connectivity loss disables restart while lifecycle remains operational, then reconnect restores availability.
seed: 4916
suite: webapp
priority: p0
status: active
tags: [webapp, virtual, operations]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  auth_state: .auth/owner.json
  browser: chromium
  headless: true
  action_timeout_seconds: 30
  check_timeout_seconds: 180
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: ready
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
    checks:
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: true
        requirement: "WEB-NODE-005"
  - name: offline
    events:
      - type: "disconnect_nodes"
        nodes: "tower-site-001-001"
      - type: "web_reload"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Connectivity"
        expected: "Offline"
        requirement: "WEB-NODE-003"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Lifecycle"
        expected: "Operational"
        requirement: "WEB-NODE-003"
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: false
        requirement: "WEB-NODE-005"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Restart reason"
        expected: "is offline"
        requirement: "WEB-NODE-005"
        match: "contains"
  - name: reconnect
    events:
      - type: "reconnect_nodes"
        nodes: "tower-site-001-001"
      - type: "web_reload"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Connectivity"
        expected: "Online"
        requirement: "WEB-NODE-003"
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Lifecycle"
        expected: "Operational"
        requirement: "WEB-NODE-003"
      - type: "web_action_available"
        view: "network_node_detail"
        label: "Restart node"
        available: true
        requirement: "WEB-NODE-005"
