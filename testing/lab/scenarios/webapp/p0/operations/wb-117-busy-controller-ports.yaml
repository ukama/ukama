version: 2
name: p0-webapp-busy-controller-ports
description: A controller update locks every switch port; observed completion restores each port.
seed: 5117
suite: webapp
priority: p0
status: active
tags: [webapp, virtual, operations]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  auth_state: .auth/owner.json
  browser: chromium
  headless: true
  action_timeout_seconds: 30
  check_timeout_seconds: 180
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: start_controller_update
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
        action: "open_software"
      - type: "web_action"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "controller-site-001-001"
        action: "update_software"
        app: "example"
        tag: "${ULAB_SOFTWARE_TARGET_VERSION}"
    checks:
      - type: "web_field_equals"
        view: "network_node_detail"
        label: "Software status"
        expected: "Updating…"
        requirement: "WEB-OPS-008"
        app: "example"
  - name: ports_locked
    events:
      - type: "web_open"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
      - type: "web_action"
        view: "network_site_detail"
        networks: "net-001"
        sites: "site-001"
        action: "open_ports"
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 1"
        available: false
        requirement: "WEB-OPS-008"
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 2"
        available: false
        requirement: "WEB-OPS-008"
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 3"
        available: false
        requirement: "WEB-OPS-008"
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 9"
        available: false
        requirement: "WEB-OPS-008"
      - type: "web_field_equals"
        view: "network_site_detail"
        label: "Port 1 reason"
        expected: "${ULAB_CONTROLLER_RESTART_REASON}"
        requirement: "WEB-OPS-008"
        match: "contains"
  - name: ports_unlock
    checks:
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 1"
        available: true
        requirement: "WEB-OPS-008"
        timeout_seconds: 180
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 2"
        available: true
        requirement: "WEB-OPS-008"
        timeout_seconds: 180
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 3"
        available: true
        requirement: "WEB-OPS-008"
        timeout_seconds: 180
      - type: "web_action_available"
        view: "network_site_detail"
        label: "Port 9"
        available: true
        requirement: "WEB-OPS-008"
        timeout_seconds: 180
