version: 2
name: p0-webapp-ue-usage
description: Start a local UE only after UI allocation generate traffic and validate the displayed usage.
seed: 4711
suite: webapp
priority: p0
status: active
tags: [webapp, commerce, local]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
  sims_per_network: 0
setup:
  create_via_webapp: [networks, sites]
runtime:
  start: [nodes]
  wait: [nodes_ready]
packages:
  - ref: weekly
    name: weekly
    data_mb: 1024
    duration_minutes: 10080
    amount: 10
    currency: USD
    country: USA
    scope: network
phases:
  - name: imported-inventory
    events:
      - type: web_open
        view: business_sim_pool
        networks: net-001
    checks:
      - type: web_commerce_equals
        view: business_sim_pool
        label: Pool status
        expected: "Available"
        requirement: WEB-SIM-001
        ues: ue-000001
  - name: plans
    events:
      - type: web_open
        view: business_data_plans
        networks: net-001
      - type: web_commerce
        view: business_data_plans
        networks: net-001
        action: create_plan
        package: weekly__net-001
        unit: GB
  - name: create-customer-and-allocate
    events:
      - type: web_open
        view: customer_customers
        networks: net-001
      - type: web_commerce
        view: customer_customers
        networks: net-001
        action: create_customer
        ues: ue-000001
      - type: web_commerce
        view: customer_customers
        networks: net-001
        action: open_customer
        ues: ue-000001
      - type: web_commerce
        view: customer_customers
        networks: net-001
        action: allocate_sim
        package: weekly__net-001
        ues: ue-000001
    checks:
      - type: web_commerce_equals
        view: customer_customers
        label: ICCID
        expected_property: "iccid"
        requirement: WEB-CUSTOMER-002
        ues: ue-000001
      - type: web_commerce_equals
        view: customer_customers
        label: Active plan
        expected_property: "plan_name"
        requirement: WEB-CUSTOMER-002
        package: weekly__net-001
        ues: ue-000001
      - type: web_commerce_equals
        view: customer_customers
        label: Package status
        expected: "Current"
        requirement: WEB-CUSTOMER-002
        package: weekly__net-001
        ues: ue-000001
      - type: web_commerce_equals
        view: customer_customers
        label: Cycle usage
        expected: "0 B of 1 GB used this cycle"
        requirement: WEB-PLAN-005
        ues: ue-000001
      - type: web_commerce_equals
        view: customer_customers
        label: Package days
        expected: "7"
        requirement: WEB-PLAN-003
        package: weekly__net-001
        ues: ue-000001
  - name: local-traffic
    events:
      - type: start_ues
        ues: ue-000001
        timeout_seconds: 900
      - type: traffic
        ues: ue-000001
        amount_mb: 64
        timeout_seconds: 180
  - name: observe-usage-after-explicit-reload
    events:
      - type: web_reload
      - type: web_commerce
        view: customer_customers
        networks: net-001
        action: open_customer
        ues: ue-000001
    checks:
      - type: web_commerce_equals
        view: customer_customers
        label: Cycle usage
        expected: "${ULAB_WEBAPP_EXPECTED_CYCLE_USAGE}"
        requirement: WEB-CUSTOMER-007
        ues: ue-000001
      - type: web_commerce_equals
        view: customer_customers
        label: Total usage
        expected: "${ULAB_WEBAPP_EXPECTED_TOTAL_USAGE}"
        requirement: WEB-CUSTOMER-007
        ues: ue-000001
