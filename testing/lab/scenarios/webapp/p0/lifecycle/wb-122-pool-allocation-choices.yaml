version: 2
name: "p0-webapp-pool-allocation-choices"
description: "pool allocation choices. UI assertions against unchanged console; see lifecycle.md for prerequisites and gaps."
seed: 4711
suite: "webapp"
priority: "p0"
status: "active"
tags: ["webapp", "commerce", "local"]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  browser: "chromium"
  headless: false
  auth_state: ".auth/owner.json"
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 2
setup:
  create_via_webapp: ["networks"]
packages:
  - ref: "weekly"
    name: "weekly"
    data_mb: 1024
    duration_minutes: 10080
    amount: 10
    currency: "USD"
    country: "USA"
    scope: "network"
phases:
  - name: "pool-before"
    events:
      - type: "web_open"
        view: "business_sim_pool"
        networks: "net-001"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool reconciliation"
        expected: "matched"
        requirement: "WEB-SIM-002"
  - name: "plan"
    events:
      - type: "web_open"
        view: "business_data_plans"
        networks: "net-001"
      - type: "web_commerce"
        view: "business_data_plans"
        networks: "net-001"
        action: "create_plan"
        package: "weekly__net-001"
        unit: "GB"
  - name: "customers"
    events:
      - type: "web_open"
        view: "customer_customers"
        networks: "net-001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "create_customer"
        ues: "ue-000002"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "open_customer"
        ues: "ue-000002"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "close_customer"
        ues: "ue-000002"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "create_customer"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "open_customer"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "allocate_sim"
        package: "weekly__net-001"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "close_customer"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "open_customer"
        ues: "ue-000002"
      - type: "web_interact"
        view: "customer_customers"
        action: "open_allocate"
    checks:
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "SIM option present"
        expected: "false"
        requirement: "WEB-SIM-003"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "SIM option present"
        expected: "true"
        requirement: "WEB-SIM-003"
        ues: "ue-000002"
  - name: "cancel"
    events:
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "close_dialog"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "close_customer"
        ues: "ue-000002"
  - name: "pool-after"
    events:
      - type: "web_open"
        view: "business_sim_pool"
        networks: "net-001"
      - type: "web_reload"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool status"
        expected: "Assigned"
        requirement: "WEB-SIM-003"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool status"
        expected: "Available"
        requirement: "WEB-SIM-003"
        ues: "ue-000002"
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool reconciliation"
        expected: "matched"
        requirement: "WEB-SIM-002"
  - name: "available-filter"
    events:
      - type: "web_interact"
        view: "business_sim_pool"
        action: "filter"
        label: "Status"
        value: "Available"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool status"
        expected: "Available"
        requirement: "WEB-SIM-005"
        ues: "ue-000002"
  - name: "assigned-filter"
    events:
      - type: "web_interact"
        view: "business_sim_pool"
        action: "filter"
        label: "Status"
        value: "Assigned"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool status"
        expected: "Assigned"
        requirement: "WEB-SIM-005"
        ues: "ue-000001"
