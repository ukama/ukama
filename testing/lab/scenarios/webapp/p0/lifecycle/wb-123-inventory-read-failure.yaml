version: 2
name: "p0-webapp-inventory-read-failure"
description: "inventory read failure. UI assertions against unchanged console; see lifecycle.md for prerequisites and gaps."
seed: 4711
suite: "webapp"
priority: "p0"
status: "active"
tags: ["webapp", "commerce", "local"]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  browser: "chromium"
  headless: false
  auth_state: ".auth/owner.json"
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_webapp: ["networks"]
packages:
  - ref: "weekly"
    name: "weekly"
    data_mb: 1024
    duration_minutes: 10080
    amount: 10
    currency: "USD"
    country: "USA"
    scope: "network"
phases:
  - name: "observe"
    events:
      - type: "web_open"
        view: "business_sim_pool"
        networks: "net-001"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool reconciliation"
        expected: "matched"
        requirement: "WEB-SIM-002"
  - name: "failed"
    events:
      - type: "web_commerce"
        view: "business_sim_pool"
        networks: "net-001"
        action: "pool_failure"
      - type: "web_reload"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Commerce fault"
        expected: "pool_failure:applied"
        requirement: "WEB-SIM-007"
      - type: "web_ui_equals"
        view: "business_sim_pool"
        label: "Text visible"
        expected: "true"
        requirement: "WEB-SIM-007"
        subject: "Couldn't load SIMs"
      - type: "web_ui_equals"
        view: "business_sim_pool"
        label: "Text visible"
        expected: "false"
        requirement: "WEB-SIM-007"
        subject: "No SIMs"
  - name: "recover"
    events:
      - type: "web_commerce"
        view: "business_sim_pool"
        networks: "net-001"
        action: "clear_fault"
      - type: "web_reload"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool reconciliation"
        expected: "matched"
        requirement: "WEB-SIM-007"
