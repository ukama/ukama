version: 2
name: p0-webapp-session-clearing
description: After console cookies are removed, access redirects to the configured auth origin and hides dashboard data.
seed: 4711
suite: webapp
priority: p0
status: active
tags: [webapp, commerce, local]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 0
setup:
  create_via_webapp: []
phases:
  - name: clear-session
    events:
      - type: web_interact
        view: session
        action: clear_session
    checks:
      - type: web_ui_equals
        view: session
        label: Auth origin
        expected: ${ULAB_WEBAPP_AUTH_ORIGIN}
        requirement: WEB-AUTH-001
      - type: web_ui_equals
        view: session
        label: Dashboard visible
        expected: 'false'
        requirement: WEB-AUTH-006
