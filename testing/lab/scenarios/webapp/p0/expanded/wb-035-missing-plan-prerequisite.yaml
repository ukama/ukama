version: 2
name: p0-webapp-missing-plan-prerequisite
description: Adding a customer without a plan shows a useful message and opens no form.
seed: 4711
suite: webapp
priority: p0
status: active
tags: [webapp, commerce, local]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_webapp: [networks]
phases:
  - name: blocked
    events:
      - type: web_open
        view: customer_customers
        networks: net-001
      - type: web_interact
        view: customer_customers
        action: open_form
        label: Add customer
    checks:
      - type: web_ui_equals
        view: customer_customers
        label: Text visible
        expected: 'true'
        requirement: WEB-CUSTOMER-010
        subject: No data plans yet — please create a data plan before adding customers.
      - type: web_ui_equals
        view: customer_customers
        label: Dialog open
        expected: 'false'
        requirement: WEB-CUSTOMER-010
