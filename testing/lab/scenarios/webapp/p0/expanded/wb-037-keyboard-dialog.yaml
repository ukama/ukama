version: 2
name: p0-webapp-keyboard-dialog
description: Open a plan dialog by keyboard, Escape it and verify focus returns to the opener.
seed: 4711
suite: webapp
priority: p0
status: active
tags: [webapp, commerce, local]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 0
setup:
  create_via_webapp: [networks]
phases:
  - name: keyboard-open
    events:
      - type: web_open
        view: business_data_plans
        networks: net-001
      - type: web_interact
        view: business_data_plans
        action: open_form
        label: Create plan
        value: keyboard
    checks:
      - type: web_ui_equals
        view: business_data_plans
        label: Dialog title
        expected: Create data plan
        requirement: WEB-UI-006
  - name: escape
    events:
      - type: web_interact
        view: business_data_plans
        action: press
        value: Escape
    checks:
      - type: web_ui_equals
        view: business_data_plans
        label: Dialog open
        expected: 'false'
        requirement: WEB-UI-007
      - type: web_ui_equals
        view: business_data_plans
        label: Focus on button
        expected: 'true'
        requirement: WEB-UI-007
        subject: Create plan
