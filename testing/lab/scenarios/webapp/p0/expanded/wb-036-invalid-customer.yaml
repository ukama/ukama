version: 2
name: p0-webapp-invalid-customer
description: Invalid customer email remains visibly invalid and cannot be submitted.
seed: 4711
suite: webapp
priority: p0
status: active
tags: [webapp, commerce, local]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_webapp: [networks]
packages:
  - ref: weekly
    name: weekly
    data_mb: 1024
    duration_minutes: 10080
    amount: 10
    currency: USD
    country: USA
    scope: network
phases:
  - name: plan
    events:
      - type: web_open
        view: business_data_plans
        networks: net-001
      - type: web_commerce
        view: business_data_plans
        networks: net-001
        action: create_plan
        package: weekly__net-001
        unit: GB
  - name: email-validation
    events:
      - type: web_open
        view: customer_customers
        networks: net-001
      - type: web_interact
        view: customer_customers
        action: open_form
        label: Add customer
      - type: web_interact
        view: customer_customers
        action: fill
        label: First name
        value: Validation
      - type: web_interact
        view: customer_customers
        action: fill
        label: Email
        value: not-an-email
    checks:
      - type: web_ui_equals
        view: customer_customers
        label: Field error
        expected: Enter a valid email
        requirement: WEB-CUSTOMER-001
        subject: Email
      - type: web_ui_equals
        view: customer_customers
        label: Button enabled
        expected: 'false'
        requirement: WEB-CUSTOMER-001
        subject: Add customer
  - name: close
    events:
      - type: web_interact
        view: customer_customers
        action: cancel
    checks:
      - type: web_ui_equals
        view: customer_customers
        label: Dialog open
        expected: 'false'
        requirement: WEB-CUSTOMER-001
