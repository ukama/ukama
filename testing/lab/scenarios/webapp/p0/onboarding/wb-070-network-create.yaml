version: 2
name: p0-webapp-onboarding-network-create
description: Staged onboarding against the original console; injected faults are controlled evidence only.
seed: 4870
suite: webapp
priority: p0
status: active
tags: [webapp, virtual, onboarding]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  session_mode: onboarding
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
setup:
  create_via_webapp: [networks]
phases:
  - name: network-form
    events:
      - type: web_onboard
        view: configure
        action: open
        value: add_network
      - type: web_onboard
        view: configure
        action: fill
        label: Network name
        value_from: network_name
    checks:
      - type: web_onboard_equals
        view: configure
        label: Field value
        requirement: WEB-ONBOARD-001
        timeout_seconds: 180
        expected_property: network_name
        subject: Network name
  - name: create-network
    events:
      - type: web_onboard
        view: configure
        action: submit_network
      - type: web_onboard
        view: configure
        action: finish_network
    checks:
      - type: web_onboard_equals
        view: configure
        label: Heading
        expected: Install your site
        requirement: WEB-ONBOARD-001
        timeout_seconds: 180
      - type: web_onboard_equals
        view: configure
        label: Network ID
        requirement: WEB-ONBOARD-001
        timeout_seconds: 180
        expected_property: network_id
      - type: web_onboard_equals
        view: configure
        label: Mutation count
        expected: '1'
        requirement: WEB-ONBOARD-001
        timeout_seconds: 180
        subject: network
