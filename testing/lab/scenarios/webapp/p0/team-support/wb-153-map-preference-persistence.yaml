    checks:
      - type: "web_ui_equals"
        view: "business_settings"
        label: "Map preference"
        expected: "Street"
        requirement: "WEB-TEAM-005"
  - name: "Street-reload"
    events:
      - type: "web_reload"
      - type: "web_interact"
        view: "business_settings"
        action: "settings_tab"
        value: "Preferences"
    checks:
      - type: "web_ui_equals"
        view: "business_settings"
        label: "Map preference"
        expected: "Street"
        requirement: "WEB-TEAM-005"
  - name: "Street-navigate"
    events:
      - type: "web_open"
        view: "business_members"
      - type: "web_open"
        view: "business_settings"
      - type: "web_interact"
        view: "business_settings"
        action: "settings_tab"
        value: "Preferences"
    checks:
      - type: "web_ui_equals"
        view: "business_settings"
        label: "Map preference"
        expected: "Street"
        requirement: "WEB-TEAM-005"
  - name: "Terrain-set"
    events:
      - type: "web_open"
        view: "business_settings"
      - type: "web_interact"
        view: "business_settings"
        action: "map_preference"
        value: "Terrain"
    checks:
      - type: "web_ui_equals"
        view: "business_settings"
        label: "Map preference"
        expected: "Terrain"
        requirement: "WEB-TEAM-005"
  - name: "Terrain-reload"
    events:
      - type: "web_reload"
      - type: "web_interact"
        view: "business_settings"
