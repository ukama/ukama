version: 2
name: "p0-webapp-invitation-role-rejection"
description: "invitation role rejection. Lab-only browser acceptance; see team-support.md for prerequisites and known product gaps."
seed: 4804
suite: "webapp"
priority: "p0"
status: "active"
tags: [webapp, local, team-support]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  auth_state: ".auth/owner.json"
  browser: "chromium"
  headless: false
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
phases:
  - name: "members"
    events:
      - type: "web_open"
        view: "business_members"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Button enabled"
        expected: "true"
        subject: "Invite member"
        requirement: "WEB-TEAM-002"
  - name: "role-0"
    events:
      - type: "web_interact"
        view: "business_members"
        action: "invite_probe"
        value: "lab-invite-0@example.test"
        label: "Owner"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Invitation probe"
        expected: "rejected"
        subject: "lab-invite-0@example.test"
        requirement: "WEB-TEAM-002"
      - type: "web_ui_equals"
        view: "business_members"
        label: "Text visible"
        expected: "true"
        subject: "Lab controlled invitation rejection"
        requirement: "WEB-TEAM-003"
  - name: "close-0"
    events:
      - type: "web_interact"
        view: "business_members"
        action: "cancel"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Dialog open"
        expected: "false"
        requirement: "WEB-TEAM-003"
  - name: "role-1"
