version: 2
name: "p0-webapp-customer-support-lookup"
description: "customer support lookup. Lab-only browser acceptance; see team-support.md for prerequisites and known product gaps."
seed: 4711
suite: "webapp"
priority: "p0"
status: "active"
tags: [webapp, commerce, local]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  browser: "chromium"
  headless: false
  auth_state: ".auth/owner.json"
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 1
setup:
  create_via_webapp: [networks]
packages:
  - ref: "weekly"
    name: "weekly"
    data_mb: 1024
    duration_minutes: 10080
    amount: 10
    currency: "USD"
    country: "USA"
    scope: "network"
  - ref: "topup"
    name: "topup"
    data_mb: 2048
    duration_minutes: 43200
    amount: 25
    currency: "USD"
    country: "USA"
    scope: "network"
phases:
  - name: "imported-inventory"
    events:
      - type: "web_open"
        view: "business_sim_pool"
        networks: "net-001"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool status"
        expected: "Available"
        requirement: "WEB-SIM-001"
        ues: "ue-000001"
  - name: "plans"
    events:
      - type: "web_open"
        view: "business_data_plans"
        networks: "net-001"
      - type: "web_commerce"
        view: "business_data_plans"
        networks: "net-001"
        action: "create_plan"
        package: "weekly__net-001"
        unit: "GB"
      - type: "web_commerce"
        view: "business_data_plans"
        networks: "net-001"
        action: "create_plan"
        package: "topup__net-001"
        unit: "GB"
  - name: "create-customer-and-allocate"
    events:
      - type: "web_open"
        view: "customer_customers"
        networks: "net-001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "create_customer"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "open_customer"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "allocate_sim"
        package: "weekly__net-001"
        ues: "ue-000001"
    checks:
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "ICCID"
        expected_property: "iccid"
        requirement: "WEB-CUSTOMER-002"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Active plan"
        expected_property: "plan_name"
        requirement: "WEB-CUSTOMER-002"
        package: "weekly__net-001"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Package status"
        expected: "Current"
        requirement: "WEB-CUSTOMER-002"
        package: "weekly__net-001"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Cycle usage"
        expected: "0 B of 1 GB used this cycle"
        requirement: "WEB-PLAN-005"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Package days"
        expected: "7"
        requirement: "WEB-PLAN-003"
        package: "weekly__net-001"
        ues: "ue-000001"
  - name: "customer-lookup"
    events:
      - type: "web_commerce"
        view: "customer_customers"
        action: "close_customer"
        networks: "net-001"
        ues: "ue-000001"
      - type: "web_open"
        view: "business_support"
        networks: "net-001"
      - type: "web_interact"
        view: "business_support"
        action: "support_lookup"
        value_from: "customer_name"
        ues: "ue-000001"
        networks: "net-001"
    checks:
      - type: "web_ui_equals"
        view: "business_support"
        label: "Support identity"
        requirement: "WEB-SUPPORT-001"
        expected_property: "customer_name"
        ues: "ue-000001"
        networks: "net-001"
      - type: "web_ui_equals"
        view: "business_support"
        label: "Support field"
        subject: "Package"
        requirement: "WEB-SUPPORT-001"
        expected_property: "plan_name"
        package: "weekly__net-001"
        networks: "net-001"
  - name: "copied-sim-details"
    events:
      - type: "web_interact"
        view: "business_support"
        action: "support_copy"
    checks:
      - type: "web_ui_equals"
        view: "business_support"
        label: "Support summary"
        subject: "ICCID"
        requirement: "WEB-SUPPORT-001"
        expected_property: "iccid"
        ues: "ue-000001"
        networks: "net-001"
      - type: "web_ui_equals"
        view: "business_support"
        label: "Support summary"
        subject: "Customer"
        requirement: "WEB-SUPPORT-001"
        expected_property: "customer_name"
        ues: "ue-000001"
        networks: "net-001"
      - type: "web_ui_equals"
        view: "business_support"
        label: "Support summary"
        subject: "Network ID"
        requirement: "WEB-SUPPORT-001"
        expected_property: "network_id"
        networks: "net-001"
