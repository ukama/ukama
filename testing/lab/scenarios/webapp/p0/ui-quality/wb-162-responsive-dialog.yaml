version: 2
name: "p0-webapp-responsive-dialog"
description: "responsive dialog. See ui-quality.md for boundaries and controlled evidence."
seed: 4804
suite: "webapp"
priority: "p0"
status: "active"
tags: [webapp, local, ui-quality]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  auth_state: ".auth/owner.json"
  browser: "chromium"
  headless: false
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
phases:
  - name: "desktop"
    events:
      - type: "web_open"
        view: "business_members"
      - type: "web_interact"
        view: "business_members"
        action: "viewport"
        value: "desktop"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Action reachable"
        expected: "true"
        requirement: "WEB-UI-008"
        subject: "Invite member"
  - name: "desktop-dialog"
    events:
      - type: "web_interact"
        view: "business_members"
        action: "open_form"
        label: "Invite member"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Dialog fits viewport"
        expected: "true"
        requirement: "WEB-UI-008"
      - type: "web_ui_equals"
        view: "business_members"
        label: "Action reachable"
        expected: "true"
        requirement: "WEB-UI-008"
        subject: "Cancel"
  - name: "desktop-close"
    events:
      - type: "web_interact"
        view: "business_members"
        action: "cancel"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Dialog open"
        expected: "false"
        requirement: "WEB-UI-008"
  - name: "narrow"
    events:
      - type: "web_open"
        view: "business_members"
      - type: "web_interact"
        view: "business_members"
        action: "viewport"
        value: "narrow"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Action reachable"
        expected: "true"
        requirement: "WEB-UI-008"
        subject: "Invite member"
  - name: "narrow-dialog"
    events:
      - type: "web_interact"
        view: "business_members"
        action: "open_form"
        label: "Invite member"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Dialog fits viewport"
        expected: "true"
        requirement: "WEB-UI-008"
      - type: "web_ui_equals"
        view: "business_members"
        label: "Action reachable"
        expected: "true"
        requirement: "WEB-UI-008"
        subject: "Cancel"
  - name: "narrow-close"
    events:
      - type: "web_interact"
        view: "business_members"
        action: "cancel"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Dialog open"
        expected: "false"
        requirement: "WEB-UI-008"
