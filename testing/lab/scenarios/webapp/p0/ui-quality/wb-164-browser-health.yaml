version: 2
name: "p0-webapp-browser-health"
description: "browser health. See ui-quality.md for boundaries and controlled evidence."
seed: 4804
suite: "webapp"
priority: "p0"
status: "active"
tags: [webapp, local, ui-quality]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  auth_state: ".auth/owner.json"
  browser: "chromium"
  headless: false
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
phases:
  - name: "members"
    events:
      - type: "web_open"
        view: "business_members"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Members state"
        expected: "data"
        requirement: "WEB-UI-010"
      - type: "web_ui_equals"
        view: "business_members"
        label: "Browser health"
        expected: "clean"
        requirement: "WEB-UI-010"
  - name: "reload"
    events:
      - type: "web_reload"
    checks:
      - type: "web_ui_equals"
        view: "business_members"
        label: "Members state"
        expected: "data"
        requirement: "WEB-UI-010"
      - type: "web_ui_equals"
        view: "business_members"
        label: "Browser health"
        expected: "clean"
        requirement: "WEB-UI-010"
