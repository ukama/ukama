version: 2
name: p0-webapp-node-list-detail
description: Create one site through the web app and inspect the visible node count and tower detail.
seed: 4804
suite: webapp
priority: p0
status: wip
tags: [webapp, virtual, nodes, list-detail]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  auth_state: .auth/owner.json
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: nodes_list
    events:
      - type: web_open
        view: network_nodes
        networks: net-001
    checks:
      - type: web_field_equals
        view: network_nodes
        label: Nodes count
        expected: "3"
        requirement: WEB-NODE-001
  - name: tower_detail
    events:
      - type: web_open
        view: network_node_detail
        networks: net-001
        nodes: tower-site-001-001
    checks:
      - type: web_action_available
        view: network_node_detail
        label: Restart node
        available: true
        requirement: WEB-NODE-005
