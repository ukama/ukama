version: 2
name: p0-webapp-sites-online-recovery
description: Create two sites through the web app and observe outage and recovery on Network Home without reloading.
seed: 4711
suite: webapp
priority: p0
status: wip
tags: [webapp, virtual, network, sites-online, recovery]
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  auth_state: .auth/owner.json
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: baseline
    events:
      - type: web_open
        view: network_home
        networks: net-001
    checks:
      - type: web_kpi_equals
        view: network_home
        label: Sites online
        expected: "2/2"
        requirement: WEB-NET-001
        timeout_seconds: 900
  - name: outage
    events:
      - type: disconnect_nodes
        nodes: tower-site-002-001
    checks:
      - type: web_kpi_equals
        view: network_home
        label: Sites online
        expected: "1/2"
        requirement: WEB-NET-002
        timeout_seconds: 900
  - name: recovery
    events:
      - type: reconnect_nodes
        nodes: tower-site-002-001
    checks:
      - type: web_kpi_equals
        view: network_home
        label: Sites online
        expected: "2/2"
        requirement: WEB-NET-003
        timeout_seconds: 900
