version: 2
name: p0-webapp-recover-reject-token
description: Change only the isolated gateway token; a legitimate server session must recover to the expected identity without a loop.
seed: 4711
suite: webapp
priority: p0
status: active
tags:
  - webapp
  - auth
  - local
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  session_mode: auth_test
  auth_origin: ${ULAB_WEBAPP_AUTH_ORIGIN}
  auth_state: ${ULAB_AUTH_OWNER_STATE}
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 0
setup:
  create_via_webapp: []
phases:
  - name: fault-and-open
    events:
      - type: web_session
        view: session
        action: reject_token
      - type: web_session
        view: session
        action: navigate
        value: /business/manage/members
    checks:
      - type: web_session_equals
        view: session
        label: Surface
        expected: dashboard
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Navigation stable
        expected: 'true'
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Refresh observed
        expected: 'true'
        requirement: WEB-AUTH-003
  - name: recovered-account
    events:
      - type: web_session
        view: session
        action: navigate
        value: /business/settings
    checks:
      - type: web_session_equals
        view: session
        label: Surface
        expected: dashboard
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Organization
        expected: ${ULAB_AUTH_ORG}
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Full name
        expected: ${ULAB_AUTH_OWNER_NAME}
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Email
        expected: ${ULAB_AUTH_OWNER_EMAIL}
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Role
        expected: Owner
        requirement: WEB-AUTH-003
  - name: persistent-recovery
    events:
      - type: web_session
        view: session
        action: reload
    checks:
      - type: web_session_equals
        view: session
        label: Surface
        expected: dashboard
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Organization
        expected: ${ULAB_AUTH_ORG}
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Full name
        expected: ${ULAB_AUTH_OWNER_NAME}
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Email
        expected: ${ULAB_AUTH_OWNER_EMAIL}
        requirement: WEB-AUTH-003
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Role
        expected: Owner
        requirement: WEB-AUTH-003
