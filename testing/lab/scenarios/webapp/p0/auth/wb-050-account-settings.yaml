version: 2
name: p0-webapp-account-settings
description: Validate independently supplied account and organization values in all three Settings views, reload and account menu.
seed: 4711
suite: webapp
priority: p0
status: active
tags:
  - webapp
  - auth
  - local
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  session_mode: auth_test
  auth_origin: ${ULAB_WEBAPP_AUTH_ORIGIN}
  auth_state: ${ULAB_AUTH_OWNER_STATE}
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 0
setup:
  create_via_webapp: []
phases:
  - name: business-account
    events:
      - type: web_session
        view: session
        action: navigate
        value: /business/settings
    checks:
      - type: web_session_equals
        view: session
        label: Surface
        expected: dashboard
        requirement: WEB-TEAM-004
      - type: web_session_equals
        view: session
        label: Organization
        expected: ${ULAB_AUTH_ORG}
        requirement: WEB-TEAM-004
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Full name
        expected: ${ULAB_AUTH_OWNER_NAME}
        requirement: WEB-TEAM-004
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Email
        expected: ${ULAB_AUTH_OWNER_EMAIL}
        requirement: WEB-TEAM-004
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Role
        expected: Owner
        requirement: WEB-TEAM-004
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Email verified
        expected: 'Yes'
        requirement: WEB-TEAM-004
  - name: business-organization
    events:
      - type: web_session
        view: session
        action: settings_tab
        value: Organization
    checks:
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Organization name
        expected: ${ULAB_AUTH_ORG}
        requirement: WEB-TEAM-004
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Country
        expected: ${ULAB_AUTH_COUNTRY}
        requirement: WEB-TEAM-004
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Currency
        expected: ${ULAB_AUTH_CURRENCY}
        requirement: WEB-TEAM-004
  - name: network-account
    events:
      - type: web_session
        view: session
        action: navigate
