version: 2
name: p0-webapp-network-owner-identity
description: Validate this real account identity and role label. This alone does not establish its permission policy.
seed: 4711
suite: webapp
priority: p0
status: active
tags:
  - webapp
  - auth
  - local
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  session_mode: auth_test
  auth_origin: ${ULAB_WEBAPP_AUTH_ORIGIN}
  auth_state: ${ULAB_AUTH_NETWORK_OWNER_STATE}
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 0
setup:
  create_via_webapp: []
phases:
  - name: identity
    events:
      - type: web_session
        view: session
        action: navigate
        value: /business/settings
    checks:
      - type: web_session_equals
        view: session
        label: Surface
        expected: dashboard
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Organization
        expected: ${ULAB_AUTH_ORG}
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Full name
        expected: ${ULAB_AUTH_NETWORK_OWNER_NAME}
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Email
        expected: ${ULAB_AUTH_NETWORK_OWNER_EMAIL}
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Role
        expected: Network owner
        requirement: WEB-AUTH-002
  - name: menu
    events:
      - type: web_session
        view: session
        action: open_account
    checks:
      - type: web_session_equals
        view: session
        label: Account name
        expected: ${ULAB_AUTH_NETWORK_OWNER_NAME}
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Account details
        expected: ${ULAB_AUTH_NETWORK_OWNER_EMAIL} · Network owner
        requirement: WEB-AUTH-002
  - name: reload
    events:
      - type: web_session
        view: session
        action: reload
    checks:
      - type: web_session_equals
        view: session
        label: Surface
        expected: dashboard
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Organization
        expected: ${ULAB_AUTH_ORG}
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Full name
        expected: ${ULAB_AUTH_NETWORK_OWNER_NAME}
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Email
        expected: ${ULAB_AUTH_NETWORK_OWNER_EMAIL}
        requirement: WEB-AUTH-002
      - type: web_session_equals
        view: session
        label: Settings field
        subject: Role
        expected: Network owner
        requirement: WEB-AUTH-002
