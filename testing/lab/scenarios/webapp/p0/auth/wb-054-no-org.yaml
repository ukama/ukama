version: 2
name: p0-webapp-no-org
description: Use an independently prepared unresolved account; the saved state must contain a real session and no usable gateway token.
seed: 4711
suite: webapp
priority: p0
status: active
tags:
  - webapp
  - auth
  - local
provider:
  type: virtual
webapp:
  base_url: http://localhost:3000
  browser: chromium
  headless: false
  session_mode: auth_test
  auth_origin: ${ULAB_WEBAPP_AUTH_ORIGIN}
  auth_state: ${ULAB_AUTH_NO_ORG_STATE}
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 0
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 0
setup:
  create_via_webapp: []
phases:
  - name: protected-route
    events:
      - type: web_session
        view: session
        action: navigate
        value: /business/manage/members
    checks: &id001
      - type: web_session_equals
        view: session
        label: Surface
        expected: unauthorized
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Unauthorized title
        expected: Your account isn't set up for this console
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Unauthorized logout
        expected: 'true'
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Unauthorized support
        expected: 'true'
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Access blocked
        expected: 'true'
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Dashboard visible
        expected: 'false'
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Sensitive text absent
        subject: ${ULAB_AUTH_OWNER_NAME}
        expected: 'true'
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Sensitive text absent
        subject: ${ULAB_AUTH_OWNER_EMAIL}
        expected: 'true'
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Sensitive text absent
        subject: ${ULAB_AUTH_ORG}
        expected: 'true'
        requirement: WEB-AUTH-004
      - type: web_session_equals
        view: session
        label: Navigation stable
        expected: 'true'
        requirement: WEB-AUTH-004
  - name: persistent-denial
    events:
      - type: web_session
        view: session
        action: reload
    checks: *id001
