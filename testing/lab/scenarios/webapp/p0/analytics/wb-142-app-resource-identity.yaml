version: 2
name: "p0-webapp-app-resource-identity"
description: "app resource identity. Requires independently prepared telemetry or sales data for the selected network and time window."
seed: 4804
suite: "webapp"
priority: "p0"
status: "active"
tags: [webapp, virtual, nodes, list-detail]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  auth_state: ".auth/owner.json"
  browser: "chromium"
  headless: false
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
runtime:
  start: [nodes]
  wait: [nodes_ready]
setup:
  create_via_webapp: [networks, sites]
phases:
  - name: "software"
    events:
      - type: "web_open"
        view: "network_node_detail"
        networks: "net-001"
        nodes: "tower-site-001-001"
      - type: "web_interact"
        view: "network_node_detail"
        action: "metric_select"
        label: "tab"
        value: "Software"
      - type: "web_interact"
        view: "network_node_detail"
        action: "metric_select"
        label: "app"
        value: "metrics"
    checks:
      - type: "web_ui_equals"
        view: "network_node_detail"
        label: "App identity"
        expected: "metrics"
        requirement: "WEB-NODE-008"
      - type: "web_ui_equals"
        view: "network_node_detail"
        label: "App resource"
        subject: "CPU"
        expected: "${ULAB_WEBAPP_APP_CPU}"
        requirement: "WEB-NODE-008"
      - type: "web_ui_equals"
        view: "network_node_detail"
        label: "App resource"
        subject: "Memory (RSS)"
        expected: "${ULAB_WEBAPP_APP_RSS}"
        requirement: "WEB-NODE-008"
      - type: "web_ui_equals"
        view: "network_node_detail"
        label: "App resource"
        subject: "Disk read"
        expected: "${ULAB_WEBAPP_APP_DISK_READ}"
        requirement: "WEB-NODE-008"
      - type: "web_ui_equals"
        view: "network_node_detail"
        label: "App resource"
        subject: "Disk write"
        expected: "—"
        requirement: "WEB-NODE-008"
  - name: "switch-app"
    events:
      - type: "web_interact"
        view: "network_node_detail"
        action: "metric_select"
        label: "dialog"
        value: "Close"
      - type: "web_interact"
        view: "network_node_detail"
        action: "metric_select"
        label: "app"
        value: "controller"
    checks:
      - type: "web_ui_equals"
        view: "network_node_detail"
        label: "App identity"
        expected: "controller"
        requirement: "WEB-NODE-008"
