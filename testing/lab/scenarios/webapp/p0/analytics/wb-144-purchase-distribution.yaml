version: 2
name: "p0-webapp-purchase-distribution"
description: "purchase distribution. Read analytics.md for the required controlled telemetry profile; never infer live qualification from fixtures."
seed: 4711
suite: "webapp"
priority: "p0"
status: "active"
tags: [webapp, commerce, local]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  browser: "chromium"
  headless: false
  auth_state: ".auth/owner.json"
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
  sims_per_network: 2
setup:
  create_via_webapp: [networks]
packages:
  - ref: "weekly"
    name: "weekly"
    data_mb: 1024
    duration_minutes: 10080
    amount: 10
    currency: "USD"
    country: "USA"
    scope: "network"
  - ref: "topup"
    name: "topup"
    data_mb: 2048
    duration_minutes: 43200
    amount: 25
    currency: "USD"
    country: "USA"
    scope: "network"
phases:
  - name: "imported-inventory"
    events:
      - type: "web_open"
        view: "business_sim_pool"
        networks: "net-001"
    checks:
      - type: "web_commerce_equals"
        view: "business_sim_pool"
        label: "Pool status"
        expected: "Available"
        requirement: "WEB-SIM-001"
        ues: "ue-000001"
  - name: "plans"
    events:
      - type: "web_open"
        view: "business_data_plans"
        networks: "net-001"
      - type: "web_commerce"
        view: "business_data_plans"
        networks: "net-001"
        action: "create_plan"
        package: "weekly__net-001"
        unit: "GB"
      - type: "web_commerce"
        view: "business_data_plans"
        networks: "net-001"
        action: "create_plan"
        package: "topup__net-001"
        unit: "GB"
  - name: "create-customer-and-allocate"
    events:
      - type: "web_open"
        view: "customer_customers"
        networks: "net-001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "create_customer"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "open_customer"
        ues: "ue-000001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "allocate_sim"
        package: "weekly__net-001"
        ues: "ue-000001"
    checks:
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "ICCID"
        expected_property: "iccid"
        requirement: "WEB-CUSTOMER-002"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Active plan"
        expected_property: "plan_name"
        requirement: "WEB-CUSTOMER-002"
        package: "weekly__net-001"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Package status"
        expected: "Current"
        requirement: "WEB-CUSTOMER-002"
        package: "weekly__net-001"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Cycle usage"
        expected: "0 B of 1 GB used this cycle"
        requirement: "WEB-PLAN-005"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Package days"
        expected: "7"
        requirement: "WEB-PLAN-003"
        package: "weekly__net-001"
        ues: "ue-000001"
  - name: "cancel-topup"
    events:
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "cancel_top_up"
        package: "topup__net-001"
        ues: "ue-000001"
    checks:
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Package count"
        expected: "0"
        requirement: "WEB-PAY-001"
        package: "topup__net-001"
        ues: "ue-000001"
  - name: "pay-and-observe-entitlement"
    events:
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "top_up"
        package: "topup__net-001"
        ues: "ue-000001"
    checks:
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Package count"
        expected: "1"
        requirement: "WEB-PAY-002"
        package: "topup__net-001"
        ues: "ue-000001"
      - type: "web_commerce_equals"
        view: "customer_customers"
        label: "Package status"
        expected: "Upcoming"
        requirement: "WEB-PAY-002"
        package: "topup__net-001"
        ues: "ue-000001"
  - name: "second-customer"
    events:
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "close_customer"
        ues: "ue-000001"
      - type: "web_open"
        view: "customer_customers"
        networks: "net-001"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "create_customer"
        ues: "ue-000002"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "open_customer"
        ues: "ue-000002"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "allocate_sim"
        package: "weekly__net-001"
        ues: "ue-000002"
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "top_up"
        package: "weekly__net-001"
        ues: "ue-000002"
    checks: []
  - name: "reconcile-distribution"
    events:
      - type: "web_commerce"
        view: "customer_customers"
        networks: "net-001"
        action: "close_customer"
        ues: "ue-000002"
      - type: "web_open"
        view: "business_packages"
        networks: "net-001"
    checks:
      - type: "web_kpi_equals"
        view: "business_packages"
        label: "Package revenue"
        expected: "$35"
        requirement: "WEB-BIZ-002"
      - type: "web_kpi_equals"
        view: "business_packages"
        label: "Packages sold"
        expected: "2"
        requirement: "WEB-BIZ-007"
      - type: "web_commerce_equals"
        view: "business_packages"
        label: "Performance sold"
        package: "topup__net-001"
        expected: "1"
        requirement: "WEB-BIZ-003"
      - type: "web_commerce_equals"
        view: "business_packages"
        label: "Performance revenue"
        package: "topup__net-001"
        expected: "$25"
        requirement: "WEB-BIZ-003"
      - type: "web_commerce_equals"
        view: "business_packages"
        label: "Performance share"
        package: "topup__net-001"
        expected: "71%"
        requirement: "WEB-BIZ-003"
      - type: "web_commerce_equals"
        view: "business_packages"
        label: "Performance sold"
        package: "weekly__net-001"
        expected: "1"
        requirement: "WEB-BIZ-003"
      - type: "web_commerce_equals"
        view: "business_packages"
        label: "Performance revenue"
        package: "weekly__net-001"
        expected: "$10"
        requirement: "WEB-BIZ-003"
      - type: "web_commerce_equals"
        view: "business_packages"
        label: "Performance share"
        package: "weekly__net-001"
        expected: "29%"
        requirement: "WEB-BIZ-003"
  - name: "home-customer-total"
    events:
      - type: "web_open"
        view: "business_home"
        networks: "net-001"
    checks:
      - type: "web_kpi_equals"
        view: "business_home"
        label: "Customers"
        expected: "2"
        requirement: "WEB-BIZ-002"
      - type: "web_kpi_equals"
        view: "business_home"
        label: "Revenue"
        expected: "$35"
        requirement: "WEB-BIZ-002"
