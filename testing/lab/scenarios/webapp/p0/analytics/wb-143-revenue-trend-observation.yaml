version: 2
name: "p0-webapp-revenue-trend-observation"
description: "revenue trend observation. Requires independently prepared telemetry or sales data for the selected network and time window."
seed: 4804
suite: "webapp"
priority: "p0"
status: "active"
tags: [webapp, virtual, nodes, list-detail]
provider:
  type: "virtual"
webapp:
  base_url: "http://localhost:3000"
  auth_state: ".auth/owner.json"
  browser: "chromium"
  headless: false
  action_timeout_seconds: 30
  check_timeout_seconds: 30
  scenario_timeout_seconds: 3600
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
setup:
  create_via_webapp: [networks]
phases:
  - name: "trend"
    events:
      - type: "web_open"
        view: "business_revenue"
        networks: "net-001"
      - type: "web_interact"
        view: "business_revenue"
        action: "chart_hover"
        label: "Revenue trend"
        value: "25"
    checks:
      - type: "web_ui_equals"
        view: "business_revenue"
        label: "Chart tooltip"
        subject: "Revenue trend"
        expected: "${ULAB_WEBAPP_REVENUE_TOOLTIP}"
        requirement: "WEB-BIZ-005"
