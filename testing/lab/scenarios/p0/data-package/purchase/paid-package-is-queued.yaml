version: 1
name: p0-paid-package-is-queued
description: Verify purchasing another package does not replace the current entitlement and leaves the paid package queued until the current one ends.
seed: 4302
suite: p0
priority: p0
tags: [virtual, data-package, purchase, queue]
status: wip
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Queue Current Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: queued_plan
    name: Queue Next Plan
    data_mb: 100
    duration_minutes: 5
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: queue_paid_plan
    events:
      - type: purchase_package
        ues: all
        package: queued_plan
    checks:
      - type: package_state
        ues: all
        package: current_plan
        expected: active
      - type: package_state
        ues: all
        package: queued_plan
        expected: queued
