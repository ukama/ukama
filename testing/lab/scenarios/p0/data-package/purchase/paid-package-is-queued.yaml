version: 1
name: p0-paid-package-is-queued
description: Verify a paid additional package contributes its price to package revenue but remains queued without replacing the current entitlement.
seed: 4202
suite: p0
priority: p0
tags: [virtual, data-package, purchase, queued, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Paid Queue Current Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: queued_plan
    name: Paid Queue Next Plan
    data_mb: 300
    duration_days: 1
    amount: 4.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: queue_paid_plan
    events:
      - type: purchase_package
        ues: all
        package: queued_plan
    checks:
      - type: package_state
        ues: all
        package: current_plan
        expected: active
      - type: package_state
        ues: all
        package: queued_plan
        expected: queued
      - type: package_assignment_chain
        ues: all
        package: queued_plan
        after_package: current_plan
      - type: package_business_metrics
        networks: all
        package: queued_plan
        expected_value: 4.00
        expected_count: 0

