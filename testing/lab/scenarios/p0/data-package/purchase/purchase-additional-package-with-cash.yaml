version: 1
name: p0-purchase-additional-package-with-cash
description: Verify a subsequent cash package purchase increases only that package's revenue and creates exactly one queued entitlement for the selected SIM.
seed: 4201
suite: p0
priority: p0
tags: [virtual, data-package, purchase, cash, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Cash Purchase Current Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: next_plan
    name: Cash Purchase Next Plan
    data_mb: 500
    duration_days: 1
    amount: 5.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: purchase_with_cash
    events:
      - type: purchase_package
        ues: all
        package: next_plan
        amount: 5.00
        currency: USD
    checks:
      - type: package_state
        ues: all
        package: current_plan
        expected: active
      - type: package_state
        ues: all
        package: next_plan
        expected: queued
      - type: package_assignment_count
        ues: all
        package: next_plan
        expected_count: 1
      - type: package_assignment_chain
        ues: all
        package: next_plan
        after_package: current_plan
        expected_count: 1
      - type: package_business_metrics
        networks: all
        package: next_plan
        expected_value: 5.00
        expected_count: 0

