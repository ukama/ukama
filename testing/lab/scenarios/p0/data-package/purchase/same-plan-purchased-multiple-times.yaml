version: 1
name: p0-same-plan-purchased-multiple-times
description: Verify buying the same plan twice creates two settled payments and two distinct queued entitlements without merging them.
seed: 4304
suite: p0
priority: p0
tags: [virtual, data-package, purchase, repeated-plan]
status: wip
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Repeat Current
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: repeated_plan
    name: Repeated Plan
    data_mb: 100
    duration_minutes: 2
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: purchase_same_plan_twice
    events:
      - type: purchase_package
        ues: all
        package: repeated_plan
      - type: purchase_package
        ues: all
        package: repeated_plan
    checks:
      - type: payment_count
        ues: all
        package: repeated_plan
        status: settled
        expected_count: 2
      - type: package_assignment_count
        ues: all
        package: repeated_plan
        expected_count: 2
