version: 1
name: p0-same-plan-purchased-multiple-times
description: Verify two intentional purchases of the same plan produce twice the plan revenue and two distinct, ordered queued entitlement records.
seed: 4204
suite: p0
priority: p0
tags: [virtual, data-package, purchase, repeated, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: bootstrap
    name: Repeated Purchase Bootstrap
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: repeated_plan
    name: Repeated Purchase Plan
    data_mb: 200
    duration_days: 1
    amount: 3.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: purchase_same_plan_twice
    events:
      - type: purchase_package
        ues: all
        package: repeated_plan
      - type: purchase_package
        ues: all
        package: repeated_plan
    checks:
      - type: package_assignment_count
        ues: all
        package: repeated_plan
        expected_count: 2
      - type: package_assignment_chain
        ues: all
        package: repeated_plan
        expected_count: 2
      - type: package_business_metrics
        networks: all
        package: repeated_plan
        expected_value: 6.00
        expected_count: 0

