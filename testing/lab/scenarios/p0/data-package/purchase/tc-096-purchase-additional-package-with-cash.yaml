version: 1
name: p0-purchase-additional-package-with-cash
description: Verify a console top-up uses the selected plan price, creates one settled payment and one queued entitlement, and updates revenue and package sales once.
seed: 4201
suite: p0
priority: p0
tags: [virtual, data-package, purchase, cash, console, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  sims_per_network: 1
  ues_per_site: 0
packages:
  - ref: current_plan
    name: Cash Purchase Current Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: next_plan
    name: Cash Purchase Next Plan
    data_mb: 500
    duration_days: 1
    amount: 5.00
    assign_percent: 0
setup:
  create_via_bff: [networks, packages, subscribers, sims]
phases:
  - name: purchase_with_console_price
    events:
      - type: purchase_package
        ues: all
        package: next_plan
        amount: 5.00
        currency: USD
    checks:
      - type: package_state
        ues: all
        package: current_plan
        expected: active
      - type: package_state
        ues: all
        package: next_plan
        expected: queued
      - type: package_assignment_count
        ues: all
        package: next_plan
        expected_count: 1
      - type: payment_equals
        ues: all
        package: next_plan
        status: settled
        payment_method: cash
        expected_value: 5.00
        currency: USD
      - type: payment_entitlement_reconciles
        ues: all
        package: next_plan
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: next_plan
        column: revenue
        expected_value: 5.00
        tolerance: 0.001
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 6.00
        tolerance: 0.001
        timeout_seconds: 600
      - type: kpi_value
        key: PACKAGE_SALES
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 2
        timeout_seconds: 600
