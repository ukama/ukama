version: 1
name: p0-different-plans-purchased-for-one-sim
description: Verify differently priced plans purchased for one SIM retain separate package revenue and distinct ordered queued entitlements.
seed: 4205
suite: p0
priority: p0
tags: [virtual, data-package, purchase, multiple-plans, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: bootstrap
    name: Different Plans Bootstrap
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: small_plan
    name: Different Plans Small
    data_mb: 200
    duration_days: 1
    amount: 2.00
    assign_percent: 0
  - ref: large_plan
    name: Different Plans Large
    data_mb: 800
    duration_days: 2
    amount: 8.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: purchase_different_plans
    events:
      - type: purchase_package
        ues: all
        package: small_plan
      - type: purchase_package
        ues: all
        package: large_plan
    checks:
      - type: package_assignment_chain
        ues: all
        package: small_plan
        after_package: bootstrap
      - type: package_assignment_chain
        ues: all
        package: large_plan
        after_package: small_plan
      - type: package_business_metrics
        networks: all
        package: small_plan
        expected_value: 2.00
        expected_count: 0
      - type: package_business_metrics
        networks: all
        package: large_plan
        expected_value: 8.00
        expected_count: 0

