version: 1
name: p0-different-plans-purchased-for-one-sim
description: Verify differently priced and sized plans purchased for one SIM retain their own payment amounts and separate queued entitlements.
seed: 4305
suite: p0
priority: p0
tags: [virtual, data-package, purchase, multiple-plans]
status: wip
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Different Current
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: small_plan
    name: Different Small
    data_mb: 50
    duration_minutes: 2
    amount: 2.00
    assign_percent: 0
  - ref: large_plan
    name: Different Large
    data_mb: 500
    duration_minutes: 5
    amount: 8.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: purchase_different_plans
    events:
      - type: purchase_package
        ues: all
        package: small_plan
      - type: purchase_package
        ues: all
        package: large_plan
    checks:
      - type: payment_equals
        ues: all
        package: small_plan
        status: settled
        expected_value: 2.00
      - type: payment_equals
        ues: all
        package: large_plan
        status: settled
        expected_value: 8.00
