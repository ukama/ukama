version: 1
name: p0-tc-095-failed-rename-preserves-original
description: Attempt to rename one plan to another existing plan name, require the BFF to reject it, and verify the original plan remains unchanged.
seed: 5095
suite: p0
priority: p0
tags: [virtual, data-package, catalog, rename, conflict, tc-095]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
packages:
  - ref: first_plan
    name: First Rename Plan
    data_mb: 100
    duration_days: 1
    amount: 3.00
    currency: USD
    active: true
    assign_percent: 100
  - ref: second_plan
    name: Existing Duplicate Plan
    data_mb: 500
    duration_days: 7
    amount: 7.00
    currency: USD
    active: true
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: reject_duplicate_rename
    events:
      - type: update_package
        package: first_plan
        other_package: second_plan
        expect:
          result: failure
    checks:
      - type: package_fields_equal
        networks: net-001
        package: first_plan
      - type: package_name_available
        package: first_plan
        variant: current
        expected: unavailable
