version: 1
name: p0-organization-and-network-plan-scope
description: Verify an organization plan is visible to both networks while each explicitly network-scoped plan is visible only to its owning network.
seed: 4103
suite: p0
priority: p0
tags: [virtual, data-package, catalog, scope, multi-network]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 0
  ues_per_site: 0
packages:
  - ref: organization_plan
    name: Organization Plan
    data_mb: 100
    duration_days: 1
    amount: 2.00
    scope: organization
    assign_percent: 100
  - ref: network_a_plan
    name: Network A Plan
    data_mb: 100
    duration_days: 1
    amount: 3.00
    scope: network
    network: net-001
    assign_percent: 0
  - ref: network_b_plan
    name: Network B Plan
    data_mb: 100
    duration_days: 1
    amount: 4.00
    scope: network
    network: net-002
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - packages
phases:
  - name: verify_plan_scope
    checks:
      - type: package_visible
        networks: net-001
        package: organization_plan
      - type: package_visible
        networks: net-002
        package: organization_plan
      - type: package_visible
        networks: net-001
        package: network_a_plan
      - type: package_hidden
        networks: net-002
        package: network_a_plan
      - type: package_visible
        networks: net-002
        package: network_b_plan
      - type: package_hidden
        networks: net-001
        package: network_b_plan
