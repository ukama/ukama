version: 1
name: p0-tc-091-duplicate-plan-name-unavailable
description: Create two plans and verify the second plan name is reported unavailable when checked as a candidate name for the first plan.
seed: 5091
suite: p0
priority: p0
tags: [virtual, data-package, catalog, duplicate-name, tc-091]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
packages:
  - ref: first_plan
    name: First Rename Plan
    data_mb: 100
    duration_days: 1
    amount: 3.00
    currency: USD
    active: true
    assign_percent: 100
  - ref: second_plan
    name: Existing Duplicate Plan
    data_mb: 500
    duration_days: 7
    amount: 7.00
    currency: USD
    active: true
    assign_percent: 0
setup:
  create_via_bff: [networks, packages]

phases:
  - name: check_duplicate_name
    checks:
      - type: package_name_available
        package: first_plan
        variant: other_package
        other_package: second_plan
        expected: unavailable
