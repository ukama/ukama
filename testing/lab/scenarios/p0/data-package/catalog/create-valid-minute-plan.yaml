version: 1
name: p0-create-valid-minute-plan
description: Verify BFF creates a network data plan whose duration is supplied directly in minutes and preserves its allowance, price, currency, and active state.
seed: 4101
suite: p0
priority: p0
tags: [virtual, data-package, catalog, duration-minutes]
status: wip
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
packages:
  - ref: minute_plan
    name: Five Minute Plan
    data_mb: 100
    duration_minutes: 5
    amount: 5.00
    currency: USD
    country: USA
    active: true
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_created_plan
    checks:
      - type: list_contains
        view: packages
        ref: minute_plan
