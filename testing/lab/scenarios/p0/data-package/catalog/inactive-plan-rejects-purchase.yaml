version: 1
name: p0-inactive-plan-rejects-purchase
description: Verify an inactive catalog plan rejects a subsequent cash purchase and creates no package revenue or queued entitlement.
seed: 4104
suite: p0
priority: p0
tags: [virtual, data-package, catalog, inactive, revenue, backend-only, non-console]
status: skip
# Console acceptance: skipped because the current console cannot create this input or topology.
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  sims_per_network: 1
  ues_per_site: 0
packages:
  - ref: bootstrap
    name: Inactive Purchase Bootstrap
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: inactive_plan
    name: Inactive Purchase Plan
    data_mb: 100
    duration_minutes: 5
    amount: 5.00
    active: false
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - packages
    - subscribers
    - sims
phases:
  - name: reject_inactive_purchase
    events:
      - type: purchase_package
        ues: all
        package: inactive_plan
        expect:
          result: failure
    checks:
      - type: package_fields_equal
        networks: all
        package: inactive_plan
      - type: package_state
        ues: all
        package: inactive_plan
        expected: absent
      - type: package_assignment_count
        ues: all
        expected_count: 1
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: all
        package: inactive_plan
        column: revenue
        expected_value: 0.00
        timeout_seconds: 600
