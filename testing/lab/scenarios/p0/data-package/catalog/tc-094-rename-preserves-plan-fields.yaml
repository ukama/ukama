version: 1
name: p0-tc-094-rename-preserves-plan-fields
description: Rename a data plan through the BFF and verify its price, allowance, duration, currency, active state, and scope remain unchanged.
seed: 5094
suite: p0
priority: p0
tags: [virtual, data-package, catalog, rename, tc-094]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
packages:
  - ref: first_plan
    name: First Rename Plan
    data_mb: 100
    duration_days: 1
    amount: 3.00
    currency: USD
    active: true
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: rename_plan
    events:
      - type: update_package
        package: first_plan
        name: Renamed First Plan
    checks:
      - type: package_fields_equal
        networks: net-001
        package: first_plan
      - type: package_name_available
        package: first_plan
        variant: current
        expected: unavailable
