version: 1
name: p0-reject-invalid-plan-values
description: Verify BFF/backend rejects negative allowance, zero duration, negative price, and empty currency package requests without reserving any invalid package name.
seed: 4102
suite: p0
priority: p0
tags: [virtual, data-package, catalog, negative, backend-only, non-console]
status: skip
# Console acceptance: skipped because the current console cannot create this input or topology.
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
packages:
  - ref: valid_template
    name: Invalid Plan Test Template
    data_mb: 100
    duration_minutes: 5
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - packages
phases:
  - name: reject_invalid_values
    events:
      - type: create_invalid_package
        package: valid_template
        variant: allowance
        expect:
          result: failure
      - type: create_invalid_package
        package: valid_template
        variant: duration
        expect:
          result: failure
      - type: create_invalid_package
        package: valid_template
        variant: price
        expect:
          result: failure
      - type: create_invalid_package
        package: valid_template
        variant: currency
        expect:
          result: failure
    checks:
      - type: package_name_available
        package: valid_template
        variant: allowance
      - type: package_name_available
        package: valid_template
        variant: duration
      - type: package_name_available
        package: valid_template
        variant: price
      - type: package_name_available
        package: valid_template
        variant: currency
      - type: package_fields_equal
        networks: all
        package: valid_template
