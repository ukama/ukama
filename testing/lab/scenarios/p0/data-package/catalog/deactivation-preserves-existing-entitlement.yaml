version: 1
name: p0-deactivation-preserves-existing-entitlement
description: Verify deactivating a catalog plan preserves its existing active entitlement while rejecting a repeat sale and leaving package revenue and assignment count unchanged.
seed: 4105
suite: p0
priority: p0
tags: [virtual, data-package, catalog, deactivation, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: existing_plan
    name: Existing Deactivated Plan
    data_mb: 500
    duration_days: 1
    amount: 3.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: deactivate_and_reject_new_sale
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: set_package_active
        package: existing_plan
        active: false
      - type: purchase_package
        ues: all
        package: existing_plan
        expect:
          result: failure
      - type: traffic
        ues: all
        amount_mb: 1
    checks:
      - type: package_catalog_equals
        networks: all
        package: existing_plan
      - type: package_state
        ues: all
        package: existing_plan
        expected: active
      - type: package_assignment_count
        ues: all
        package: existing_plan
        expected_count: 1
      - type: package_business_metrics
        networks: all
        package: existing_plan
        expected_value: 3.00
        expected_count: 1
      - type: usage_per_sim
        ues: all
        expected: from_model
