version: 1
name: p0-create-valid-minute-plan
description: Verify BFF creates a network data plan whose duration is supplied in minutes and preserves its allowance, price, currency, country, active state, and scope.
seed: 4101
suite: p0
priority: p0
tags: [virtual, data-package, catalog, duration-minutes]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
packages:
  - ref: minute_plan
    name: Five Minute Plan
    data_mb: 100
    duration_minutes: 5
    amount: 5.00
    currency: USD
    country: USA
    active: true
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - packages
phases:
  - name: verify_created_plan
    checks:
      - type: package_fields_equal
        networks: all
        package: minute_plan
      - type: package_visible
        networks: all
        package: minute_plan
