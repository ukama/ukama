version: 1
name: p0-allocation-retry-is-idempotent
description: Verify repeating allocateSim for the same ICCID, subscriber, network, and package leaves exactly one entitlement, one active attachment, and one package-price revenue contribution.
seed: 4003
suite: p0
priority: p0
tags: [virtual, data-package, allocation, retry, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: retry_plan
    name: Allocation Retry Plan
    data_mb: 100
    duration_days: 1
    amount: 4.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: retry_same_allocation
    events:
      - type: allocate_sim
        ues: all
        package: retry_plan
        expect:
          result: any
    checks:
      - type: package_assignment_count
        ues: all
        package: retry_plan
        expected_count: 1
      - type: package_assignment_chain
        ues: all
        package: retry_plan
        expected_count: 1
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: all
        package: retry_plan
        column: revenue
        expected_value: 4.00
        timeout_seconds: 600
