version: 1
name: p0-initial-payment-matches-plan
description: Verify the first allocation's package, SIM, subscriber linkage, catalog price, currency, and package-scoped revenue agree through BFF GraphQL effects.
seed: 4002
suite: p0
priority: p0
tags: [virtual, data-package, allocation, lineage, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  sims_per_network: 1
  ues_per_site: 0
packages:
  - ref: initial_plan
    name: Initial Payment Match Plan
    data_mb: 250
    duration_minutes: 30
    amount: 5.00
    currency: USD
    country: USA
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - packages
    - subscribers
    - sims
phases:
  - name: verify_catalog_assignment_and_revenue
    checks:
      - type: package_fields_equal
        networks: all
        package: initial_plan
      - type: package_state
        ues: all
        package: initial_plan
        expected: active
      - type: package_assignment_count
        ues: all
        package: initial_plan
        expected_count: 1
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: all
        package: initial_plan
        column: revenue
        expected_value: 5.00
        timeout_seconds: 600
