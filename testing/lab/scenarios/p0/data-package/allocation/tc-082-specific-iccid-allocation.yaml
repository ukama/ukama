version: 1
name: p0-tc-082-specific-iccid-allocation
description: Request allocation using the scenario UE specific ICCID and verify the backend allocates that exact SIM with one package assignment.
seed: 5082
suite: p0
priority: p0
tags: [virtual, data-package, allocation, specific-iccid, tc-082]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  sims_per_network: 1
  ues_per_site: 0
packages:
  - ref: allocation_plan
    name: Explicit Allocation Plan
    data_mb: 100
    duration_days: 1
    amount: 2.00
    assign_percent: 100
setup:
  create_via_bff: [networks, packages, subscribers]

phases:
  - name: allocate_requested_iccid
    events:
      - type: allocate_sim
        ues: all
        package: allocation_plan
        variant: specific
    checks:
      - type: sim_unallocated
        ues: all
        expected: allocated
      - type: package_assignment_count
        ues: all
        package: allocation_plan
        expected_count: 1
