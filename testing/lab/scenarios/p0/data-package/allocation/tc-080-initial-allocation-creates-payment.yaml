version: 1
name: p0-initial-allocation-creates-payment
description: Verify allocating a SIM with its mandatory first package creates one active entitlement and increases that package's settled revenue exactly once.
seed: 4001
suite: p0
priority: p0
tags: [virtual, data-package, allocation, revenue]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  sims_per_network: 1
  ues_per_site: 0
packages:
  - ref: initial_plan
    name: Initial Allocation Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    currency: USD
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - packages
    - subscribers
    - sims
phases:
  - name: verify_initial_allocation_effects
    checks:
      - type: package_state
        ues: all
        package: initial_plan
        expected: active
      - type: package_assignment_count
        ues: all
        package: initial_plan
        expected_count: 1
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: all
        package: initial_plan
        column: revenue
        expected_value: 5.00
        tolerance: 0.001
        timeout_seconds: 600
