version: 1
name: p0-ue-rate-limits-update
description: Verify both OVS meter rates change on the same live PDN when its policy is replaced.
seed: 18531
suite: p0
priority: p0
tags: [virtual, runtime, pdn, rate-limits]
status: skip 

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: base
    name: Meter Direction
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: attach_with_asymmetric_rates
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: set_ue_rate_policy
        ues: all
        uplink_kbps: 10000
        downlink_kbps: 50000
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 90
      - type: wait_ue_rate_limits
        ues: all
        uplink_kbps: 10000
        downlink_kbps: 50000
    checks:
      - type: ue_pdn
        ues: all
        expected: allowed
        same_pdn: true
        timeout_seconds: 60

  - name: replace_policy_without_reattaching
    events:
      - type: set_ue_rate_policy
        ues: all
        uplink_kbps: 30000
        downlink_kbps: 5000
      - type: wait_ue_rate_limits
        ues: all
        uplink_kbps: 30000
        downlink_kbps: 5000
    checks:
      - type: ue_pdn
        ues: all
        expected: allowed
        same_pdn: true
        timeout_seconds: 60
