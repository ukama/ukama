version: 1
name: p0-usage-limit-blocks-traffic
description: Verify reaching the data allowance ends the only entitlement and a later traffic attempt produces no additional BFF usage.
seed: 4302
suite: p0
priority: p0
tags: [virtual, data-package, policy, usage-limit, blocking]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: limited_plan
    name: Usage Limited Plan
    data_mb: 2
    duration_minutes: 10
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes, ues]
  wait: [nodes_ready, ues_attached]
phases:
  - name: exhaust_and_block
    events:
      - type: traffic
        ues: all
        amount_mb: 2
      - type: wait
        seconds: 5
    checks:
      - type: traffic_blocked
        ues: all
        amount_mb: 1
      - type: package_state
        ues: all
        package: limited_plan
        expected: inactive
      - type: usage_per_sim
        ues: all
        expected: from_model

