version: 1
name: p0-expired-package-cannot-reactivate
description: Verify an expired entitlement remains inactive after node restart and cannot resume service or accrue additional usage.
seed: 4312
suite: p0
priority: p0
tags: [virtual, data-package, policy, exhaustion, restart, no-reactivation]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: ending_plan
    name: Non Reactivating Plan
    data_mb: 1
    duration_minutes: 10
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: exhaust_restart_and_probe
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 1
      - type: finalize_ue_sessions
        ues: all
        seconds: 5
      - type: restart_nodes
        nodes: all
      - type: wait_nodes_ready
        nodes: all
      - type: start_ues
        ues: all
      - type: wait_ue_sessions
        ues: all
        seconds: 90
    checks:
      - type: traffic_blocked
        ues: all
        amount_mb: 1
      - type: package_state
        ues: all
        package: ending_plan
        expected: inactive
      - type: package_assignment_count
        ues: all
        package: ending_plan
        expected_count: 1
      - type: usage_per_sim
        ues: all
        expected: from_model
