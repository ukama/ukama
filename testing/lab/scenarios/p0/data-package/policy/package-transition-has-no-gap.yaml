version: 1
name: p0-package-transition-has-no-gap
description: Verify a queued successor accepts the next traffic unit immediately after exhaustion and the assignment ledger has a contiguous handoff.
seed: 4310
suite: p0
priority: p0
tags: [virtual, data-package, policy, transition, no-gap]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: No Gap Current Plan
    data_mb: 1
    duration_minutes: 10
    amount: 1.00
    assign_percent: 100
  - ref: next_plan
    name: No Gap Next Plan
    data_mb: 5
    duration_minutes: 10
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: cross_without_wait
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: purchase_package
        ues: all
        package: next_plan
      - type: traffic
        ues: all
        amount_mb: 1
      - type: traffic
        ues: all
        amount_mb: 1
    checks:
      - type: package_state
        ues: all
        package: next_plan
        expected: active
      - type: package_assignment_chain
        ues: all
        package: next_plan
        after_package: current_plan
        expected: contiguous
      - type: usage_per_sim
        ues: all
        expected: from_model
