version: 1
name: p0-queued-package-activates-after-expiration
description: Verify a paid queued package activates automatically after the current minute package's BFF end date and carries subsequent usage.
seed: 4306
suite: p0
priority: p0
tags: [virtual, data-package, policy, expiration, transition]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Expiration Current Plan
    data_mb: 100
    duration_minutes: 2
    amount: 1.00
    assign_percent: 100
  - ref: next_plan
    name: Expiration Next Plan
    data_mb: 10
    duration_minutes: 5
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: wait_for_expiration
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: purchase_package
        ues: all
        package: next_plan
      - type: wait_package_boundary
        ues: all
        package: current_plan
        offset_seconds: 2
      - type: traffic
        ues: all
        amount_mb: 1
    checks:
      - type: package_state
        ues: all
        package: current_plan
        expected: inactive
      - type: package_state
        ues: all
        package: next_plan
        expected: active
      - type: package_assignment_chain
        ues: all
        package: next_plan
        after_package: current_plan
        expected: contiguous
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: all
        package: next_plan
        column: revenue
        expected_value: 2.00
        timeout_seconds: 600
      - type: usage_per_sim
        ues: all
        expected: from_model
