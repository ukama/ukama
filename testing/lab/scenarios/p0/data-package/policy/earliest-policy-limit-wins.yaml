version: 1
name: p0-earliest-policy-limit-wins
description: Verify one entitlement ends early through exhaustion and its successor later ends through expiration, demonstrating that each package follows the first applicable limit.
seed: 4307
suite: p0
priority: p0
tags: [virtual, data-package, policy, earliest-limit]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: usage_first_plan
    name: Usage First Plan
    data_mb: 1
    duration_minutes: 5
    amount: 1.00
    assign_percent: 100
  - ref: time_first_plan
    name: Time First Plan
    data_mb: 100
    duration_minutes: 1
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: usage_limit_wins_first
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: purchase_package
        ues: all
        package: time_first_plan
      - type: traffic
        ues: all
        amount_mb: 1
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
    checks:
      - type: package_state
        ues: all
        package: usage_first_plan
        expected: inactive
        immediate: true
      - type: package_state
        ues: all
        package: time_first_plan
        expected: active
        immediate: true
  - name: expiration_limit_wins_second
    events:
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: wait_package_boundary
        ues: all
        package: time_first_plan
        offset_seconds: 2
    checks:
      - type: traffic_unavailable
        ues: all
        amount_mb: 1
      - type: package_state
        ues: all
        package: time_first_plan
        expected: inactive
      - type: package_assignment_chain
        ues: all
        package: time_first_plan
        after_package: usage_first_plan
      - type: usage_per_sim
        ues: all
        expected: from_model
