version: 1
name: p0-policy-survives-restart
description: >-
  Re-enable service after an infrastructure restart and verify the restart
  does not reset recorded usage or bypass the original package allowance.
seed: 4313
suite: p0
priority: p0
tags: [virtual, data-package, policy, restart, persistence]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: persistent_plan
    name: Restart Persistent Plan
    data_mb: 5
    duration_minutes: 10
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: use_restart_and_finish_allowance
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 2
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 120
      - type: restart_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
      - type: wait_nodes_ready
        nodes: all
      - type: toggle_service
        sites: all
        state: on
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 3
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
      - type: start_ues
        ues: all
    checks:
      - type: traffic_unavailable
        ues: all
        amount_mb: 1
      - type: package_state
        ues: all
        package: persistent_plan
        expected: inactive
      - type: package_assignment_count
        ues: all
        package: persistent_plan
        expected_count: 1
      - type: usage_per_sim
        ues: all
        expected: from_model
