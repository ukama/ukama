version: 1
name: p0-expired-package-cannot-reactivate
description: Re-enable service after node restart and verify an expired entitlement remains inactive, cannot establish service, and accrues no additional usage.
seed: 4312
suite: p0
priority: p0
tags: [virtual, data-package, policy, exhaustion, restart, no-reactivation]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: ending_plan
    name: Non Reactivating Plan
    data_mb: 1
    duration_minutes: 10
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: exhaust_restart_and_probe
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 1
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 120
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: false
        restart_available: true
        timeout_seconds: 300
        immediate: true

  - name: restart_site_and_wait_for_recovery
    events:
      - type: restart_site
        sites: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: enable_service_and_continue_policy_test
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
    checks:
      - type: traffic_unavailable
        ues: all
        amount_mb: 1
      - type: package_state
        ues: all
        package: ending_plan
        expected: inactive
      - type: package_assignment_count
        ues: all
        package: ending_plan
        expected_count: 1
      - type: usage_per_sim
        ues: all
        expected: from_model
