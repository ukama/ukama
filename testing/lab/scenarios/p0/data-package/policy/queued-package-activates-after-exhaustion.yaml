version: 1
name: p0-queued-package-activates-after-exhaustion
description: Verify exhausting the active allowance automatically activates the paid queued package and subsequent traffic is reflected in BFF usage.
seed: 4305
suite: p0
priority: p0
tags: [virtual, data-package, policy, exhaustion, transition]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Exhaustion Current Plan
    data_mb: 2
    duration_minutes: 10
    amount: 1.00
    assign_percent: 100
  - ref: next_plan
    name: Exhaustion Next Plan
    data_mb: 5
    duration_minutes: 10
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: exhaust_current
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: purchase_package
        ues: all
        package: next_plan
      - type: traffic
        ues: all
        amount_mb: 2
      - type: wait
        seconds: 5
    checks:
      - type: package_state
        ues: all
        package: current_plan
        expected: inactive
        immediate: true
      - type: package_state
        ues: all
        package: next_plan
        expected: active
        immediate: true
  - name: use_successor
    events:
      - type: traffic
        ues: all
        amount_mb: 1
    checks:
      - type: package_assignment_chain
        ues: all
        package: next_plan
        after_package: current_plan
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: all
        package: next_plan
        column: revenue
        expected_value: 2.00
        timeout_seconds: 600
      - type: usage_per_sim
        ues: all
        expected: from_model
