version: 1
name: p0-tc-045-software-app-fields
description: Read every installed application on the controller and verify each row includes its app name, installed version, release date, and current software status; this also covers TC-180.
seed: 5045
suite: p0
priority: p0
tags: [virtual, software-update, installed-apps, fields, tc-045, tc-180]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_installed_software_fields
    checks:
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: all
        required: true
        timeout_seconds: 180
