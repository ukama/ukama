version: 1
name: software_update_controller_offline_rejected
description: Verify an example app update requested while the controller is offline is rejected, takes no node lock, and leaves the node on its current version after it reconnects.
seed: 1744158693
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, offline, recovery]
status: active
entity: software_update
action: update_offline_controller_after_reconnect

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_app_before_update
    checks:
      - type: node_status_equals
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}

  - name: reject_update_while_controller_is_offline
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
      - type: disconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        seconds: 180
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
        expect:
          result: failure
          error_contains: "not available for updates"
      - type: wait
        seconds: 30
    checks:
      - type: node_status_equals
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        state: Operational
        immediate: true
        timeout_seconds: 120

  - name: reconnect_and_stay_on_current_version
    events:
      - type: reconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        seconds: 300
    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300
      - type: node_status_equals
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180
