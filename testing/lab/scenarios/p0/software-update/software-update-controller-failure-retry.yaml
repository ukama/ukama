version: 1
name: software_update_controller_failure_retry
description: Force a controller software installation failure, verify getSoftwares reports update_failed, restore installation, retry, and confirm the target is up to date and healthy.
seed: 1744158701
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, failure, retry, console, requires-software-failure-control]
status: wip
# Activate after the corresponding ULAB_*_FAILURE_ON/OFF_CMD hooks are configured.
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: expose_update
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
    checks:
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: update_available
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 120

  - name: force_update_failure
    events:
      - type: failure_control
        target: software
        state: on
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: update_failed
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300

  - name: retry_after_recovery
    events:
      - type: failure_control
        target: software
        state: off
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: up_to_date
        current_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300
