version: 1
name: software_update_controller_operation_conflict
description: Start a controller software update, verify the node is busy, reject a conflicting node restart, then confirm the update completes and the operation lock is released.
seed: 1744158702
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, operation-conflict, console]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: expose_update
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
    checks:
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: update_available
        timeout_seconds: 120

  - name: start_update
    events:
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: true
        timeout_seconds: 60

  - name: reject_restart_and_finish_update
    events:
      - type: restart_nodes
        type_selector: controller
        count_per_network: 1
        expect:
          result: failure
    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: up_to_date
        current_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300
