version: 1
name: software_update_controller_duplicate_request
description: Verify two immediate requests for the same example app release are handled idempotently and the controller converges to one healthy instance of the target version.
seed: 1744158694
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, duplicate, idempotent]
status: active
entity: software_update
action: duplicate_update_request

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_app_before_update
    checks:
      - type: node_status_equals
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}

  - name: submit_duplicate_update_requests
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: up_to_date
        current_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300
