version: 1
name: software_update_controller_partial_rollout
description: Verify an example app rollout upgrades the online controller while a second controller is offline, and that the offline controller is rejected outright and stays on its current version after it reconnects.
seed: 1744158695
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, multi_node, partial, recovery]
status: active
entity: software_update
action: partial_controller_rollout

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_both_controllers_before_update
    checks:
      - type: node_status_equals
        type_selector: controller
        count_per_network: 2
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180
      - type: node_health_ok
        type_selector: controller
        count_per_network: 2
        app: example
      - type: node_version_equals
        type_selector: controller
        count_per_network: 2
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}

  - name: promote_and_update_with_second_controller_offline
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
      - type: disconnect_nodes
        nodes: controller-site-002-001
      - type: wait_node_connectivity
        nodes: controller-site-002-001
        connectivity: Offline
        seconds: 180
      - type: software_update
        nodes: controller-site-001-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: software_update
        nodes: controller-site-002-001
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
        expect:
          result: failure
          error_contains: "not available for updates"
      - type: wait
        seconds: 30
    checks:
      - type: node_version_equals
        nodes: controller-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: node_health_ok
        nodes: controller-site-001-001
        app: example

  - name: reconnect_second_controller
    events:
      - type: reconnect_nodes
        nodes: controller-site-002-001
      - type: wait_node_connectivity
        nodes: controller-site-002-001
        connectivity: Online
        seconds: 300
    checks:
      - type: node_version_equals
        nodes: controller-site-001-001
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: node_version_equals
        nodes: controller-site-002-001
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 2
        app: example
      - type: software_status_equals
        nodes: controller-site-001-001
        app: example
        status: up_to_date
        current_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
      - type: software_status_equals
        nodes: controller-site-002-001
        app: example
        status: update_available
        current_version: ${ULAB_SOFTWARE_CURRENT_VERSION}
        timeout_seconds: 300
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 2
        busy: false
        timeout_seconds: 300
