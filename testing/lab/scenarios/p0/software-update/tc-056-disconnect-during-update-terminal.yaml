version: 1
name: p0-tc-056-disconnect-during-update-terminal
description: Start a controller update, disconnect and reconnect the node, and verify the update reaches a clear terminal state and releases the node operation lock.
seed: 5056
suite: p0
priority: p0
tags: [virtual, software-update, disconnect, recovery, tc-056]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: start_update
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: true
        timeout_seconds: 60
  - name: interrupt_connectivity
    events:
      - type: disconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        seconds: 120
    checks:
      - type: node_status_equals
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        state: Operational
        timeout_seconds: 120

  - name: reconnect_and_finish_update
    events:
      - type: reconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        seconds: 180
    checks:
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: example
        status: terminal
        desired_version: ${ULAB_SOFTWARE_TARGET_VERSION}
        timeout_seconds: 300
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300
      - type: node_status_equals
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        timeout_seconds: 180
