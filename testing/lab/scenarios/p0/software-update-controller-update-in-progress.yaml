version: 1
name: software_update_controller_update_in_progress
description: Verify a request for a different example app version is rejected while an update is already active, allowing the first update to complete and leave the controller healthy.
seed: 1744158697
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, concurrency, negative, wip]
status: wip
entity: software_update
action: reject_competing_update

# Activate after the update API exposes an in-progress state. Without that
# signal, the second request could fail only because its promotion has not
# propagated, or it could arrive after the first update already completed.

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_app_before_update
    checks:
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}

  - name: start_first_update_and_reject_second
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_NEXT_VERSION}
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_NEXT_VERSION}
        expect:
          result: failure
    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
