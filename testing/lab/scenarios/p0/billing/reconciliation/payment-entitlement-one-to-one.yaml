version: 1
name: p0-payment-entitlement-one-to-one
description: Reconcile GetPayments with getPackagesForSim and verify the unique run-scoped package has one settled payment for its one entitlement.
seed: 4533
suite: p0
priority: p0
tags: [virtual, billing, reconciliation, entitlement, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: reconciled_plan
    name: Reconciled Payment Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: reconcile_payment_and_entitlement
    checks:
      - type: payment_entitlement_reconciles
        ues: all
        package: reconciled_plan

