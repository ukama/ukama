version: 1
name: p0-completed-cash-payment
description: Allocate one SIM with its mandatory first package and verify the GraphQL payment record is settled while RevenueOverview reports exactly the package price.
seed: 4525
suite: p0
priority: p0
tags: [virtual, billing, payment, cash, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: cash_plan
    name: Completed Cash Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_settled_sale
    checks:
      - type: payment_equals
        ues: all
        package: cash_plan
        status: settled
        payment_method: cash
        expected_value: 5.00
        currency: USD
      - type: revenue_summary
        networks: net-001
        column: total_paid
        expected_value: 5.00
        tolerance: 0.001

