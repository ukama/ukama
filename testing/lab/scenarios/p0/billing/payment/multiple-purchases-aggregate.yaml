version: 1
name: p0-multiple-purchases-aggregate
description: Combine the mandatory first-package sale with a second cash purchase and verify RevenueOverview equals the sum of both settled GraphQL payments.
seed: 4527
suite: p0
priority: p0
tags: [virtual, billing, payment, aggregation, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: bootstrap
    name: Aggregate Bootstrap Plan
    data_mb: 100
    duration_days: 1
    amount: 2.00
    assign_percent: 100
  - ref: additional
    name: Aggregate Additional Plan
    data_mb: 500
    duration_days: 1
    amount: 5.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: add_second_purchase
    events:
      - type: purchase_package
        ues: all
        package: additional
        amount: 5.00
        currency: USD
    checks:
      - type: payment_count
        ues: all
        package: bootstrap
        status: settled
        expected_count: 1
      - type: payment_count
        ues: all
        package: additional
        status: settled
        expected_count: 1
      - type: revenue_summary
        networks: net-001
        column: total_paid
        expected_value: 7.00
        tolerance: 0.001
      - type: revenue_summary
        networks: net-001
        column: month_paid
        expected_value: 7.00
        tolerance: 0.001

