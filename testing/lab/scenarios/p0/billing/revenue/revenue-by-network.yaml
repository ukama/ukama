version: 1
name: p0-revenue-by-network
description: Verify the selected network's settled plan payment is attributed to that network by both getPayments and the REVENUE KPI.
seed: 4530
suite: p0
priority: p0
tags: [virtual, billing, revenue, network, console, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: network_plan
    name: Network Revenue Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_network_revenue
    checks:
      - type: payment_equals
        ues: all
        package: network_plan
        status: settled
        expected_value: 5.00
        currency: USD
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 5.00
        tolerance: 0.001
        timeout_seconds: 600
