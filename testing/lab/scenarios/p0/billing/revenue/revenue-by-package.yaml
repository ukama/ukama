version: 1
name: p0-revenue-by-package
description: Sell two differently priced plans and verify package_performance keeps each plan's settled revenue separate.
seed: 4528
suite: p0
priority: p0
tags: [virtual, billing, revenue, package, console, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: small_plan
    name: Package Revenue Small
    data_mb: 100
    duration_days: 1
    amount: 3.00
    assign_percent: 100
  - ref: large_plan
    name: Package Revenue Large
    data_mb: 500
    duration_days: 1
    amount: 7.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: sell_and_split_revenue
    events:
      - type: purchase_package
        ues: all
        package: large_plan
        amount: 7.00
        currency: USD
    checks:
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: small_plan
        column: revenue
        expected_value: 3.00
        tolerance: 0.001
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: large_plan
        column: revenue
        expected_value: 7.00
        tolerance: 0.001
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 10.00
        tolerance: 0.001
        timeout_seconds: 600
