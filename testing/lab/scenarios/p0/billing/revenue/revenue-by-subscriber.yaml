version: 1
name: p0-revenue-by-subscriber
description: Allocate two SIMs to one subscriber and verify SubscriberDetail billing aggregates both settled package payments once at subscriber level.
seed: 4529
suite: p0
priority: p0
tags: [virtual, billing, revenue, subscriber, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
  sims_per_subscriber: 2
packages:
  - ref: subscriber_plan
    name: Subscriber Revenue Plan
    data_mb: 100
    duration_days: 1
    amount: 3.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_subscriber_billing
    checks:
      - type: subscriber_billing_summary
        ues: all
        expected_count: 2
        expected_value: 6.00
        tolerance: 0.001

