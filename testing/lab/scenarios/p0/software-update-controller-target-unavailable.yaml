version: 1
name: software_update_controller_target_unavailable
description: Verify an unavailable example app release cannot be promoted for update and the controller continues running its original version in a healthy state.
seed: 1744158691
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, negative, release]
status: active
entity: software_update
action: reject_unavailable_release

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_release_and_app_before_update
    checks:
      - type: release_unavailable
        app: example
        version: ${ULAB_SOFTWARE_UNAVAILABLE_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}

  - name: reject_unavailable_release
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_UNAVAILABLE_VERSION}
        expect:
          result: failure
    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
