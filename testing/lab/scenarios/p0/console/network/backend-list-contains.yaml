version: 1
name: p0-backend-list-contains
description: Verify backend list views contain the created network, site, tower, and SIM records.
seed: 302
suite: p0
priority: p0
tags: [virtual, bff, read-model]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: list_checks
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 300
      - type: check
    checks:
      - type: list_contains
        view: networks
        ref: net-001
      - type: list_contains
        view: sites
        ref: site-001
      - type: list_contains
        view: nodes
        ref: tower-site-001-001
      - type: list_contains
        view: sims
        ref: ue-000001

final_checks:
  - type: backend_count
    target: sims
    expected: from_world
