version: 1
name: p0-console-network-empty-state
description: Verify a provisioned network with no customers, plans, SIMs, sales, or usage returns valid empty lists and each KPI's documented zero or no-data state instead of stale data.
seed: 4802
suite: p0
priority: p0
tags: [virtual, console, network, empty-state, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_empty_lists
    checks:
      - type: list_count_equals
        target: customers
        networks: net-001
        expected_count: 0
      - type: list_count_equals
        target: plans
        networks: net-001
        expected_count: 0
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 0
      - type: kpi_state_equals
        key: REVENUE
        networks: net-001
        span: daily
        value_state: zero
        timeout_seconds: 600
      - type: kpi_state_equals
        key: PACKAGE_SALES
        networks: net-001
        span: daily
        value_state: no_data
        timeout_seconds: 600
      - type: kpi_state_equals
        key: PAID_CUSTOMERS
        networks: net-001
        span: daily
        value_state: zero
        timeout_seconds: 600
      - type: kpi_state_equals
        key: DATA_USAGE
        networks: net-001
        span: daily
        value_state: no_data
        timeout_seconds: 600
