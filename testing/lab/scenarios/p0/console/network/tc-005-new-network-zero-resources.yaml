version: 1
name: p0-tc-005-new-network-zero-resources
description: Create a network without sites, nodes, customers, plans, or SIMs and verify every resource list returns a real zero rather than data left from another network.
seed: 5005
suite: p0
priority: p0
tags: [virtual, console, network, empty-topology, tc-005]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
setup:
  create_via_bff: [networks]

phases:
  - name: verify_zero_resource_counts
    checks:
      - type: list_count_equals
        target: sites
        networks: net-001
        expected_count: 0
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 0
      - type: list_count_equals
        target: customers
        networks: net-001
        expected_count: 0
      - type: list_count_equals
        target: plans
        networks: net-001
        expected_count: 0
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 0
