version: 1
name: p0-console-packages-dashboard
description: Verify Packages sold, package revenue, performance rows, active status, and revenue ordering after selling two plans.
seed: 4808
suite: p0
priority: p0
tags: [virtual, console, packages, dashboard, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: small_plan
    name: Packages Dashboard Small
    data_mb: 100
    duration_days: 1
    amount: 3.00
    assign_percent: 100
  - ref: large_plan
    name: Packages Dashboard Large
    data_mb: 500
    duration_days: 1
    amount: 7.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: sell_large_plan
    events:
      - type: purchase_package
        ues: all
        package: large_plan
        amount: 7.00
        currency: USD
    checks:
      - type: list_count_equals
        target: plans
        networks: net-001
        expected_count: 2
      - type: package_fields_equal
        package: small_plan
      - type: package_fields_equal
        package: large_plan
      - type: performance_report_row
        report: package_performance
        span: daily
        networks: net-001
        package: large_plan
        other_package: small_plan
        expected: before
        active: true
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: small_plan
        column: revenue
        expected_value: 3.00
        tolerance: 0.001
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: large_plan
        column: revenue
        expected_value: 7.00
        tolerance: 0.001
      - type: kpi_value
        key: PACKAGE_SALES
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 2
        timeout_seconds: 600
