version: 1
name: p0-tc-153-package-consumption-reconciles
description: Generate traffic on two SIMs using the same package and verify both package-scoped and network-scoped usage aggregations account for the full generated usage.
seed: 5153
suite: p0
priority: p0
tags: [virtual, console, packages, usage, reconciliation, tc-153]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
packages:
  - ref: shared_plan
    name: TC153 Shared Usage Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: generate_package_usage
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 4
      - type: wait
        seconds: 30
    checks:
      - type: usage_aggregate
        target: package
        package: shared_plan
        networks: net-001
        span: daily
        op: SUM
        tolerance_percent: 15
        timeout_seconds: 600
      - type: usage_aggregate
        target: network
        networks: net-001
        span: daily
        op: SUM
        tolerance_percent: 15
        timeout_seconds: 600
