version: 1
name: p0-tc-031-node-unknown-to-configured
description: Start nodes without a site, verify Unknown, create the site while holding node readiness, and verify the nodes reach Configured while Offline before final recovery.
seed: 5031
suite: p0
priority: p0
tags: [virtual, console, nodes, lifecycle, configured, tc-031]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_unknown
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Unknown
        timeout_seconds: 120
  - name: configure_without_ready
    events:
      - type: configure_sites
        sites: all
        state: hold
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Offline
        state: Configured
        timeout_seconds: 180
  - name: restore_ready_nodes
    events:
      - type: reconnect_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 180
