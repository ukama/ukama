version: 1
name: p0-tc-034-offline-node-preserves-lifecycle
description: Disconnect a configured operational node and verify the BFF keeps its last known lifecycle state while reporting Offline connectivity; this also covers TC-177.
seed: 5034
suite: p0
priority: p0
tags: [virtual, console, nodes, offline, lifecycle, tc-034, tc-177]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: record_last_known_state
    checks:
      - type: node_status_equals
        type_selector: amplifier
        count_per_network: 1
        connectivity: Online
        state: Operational
  - name: verify_offline_last_known_state
    events:
      - type: disconnect_nodes
        type_selector: amplifier
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: amplifier
        count_per_network: 1
        connectivity: Offline
        seconds: 120
    checks:
      - type: node_status_equals
        type_selector: amplifier
        count_per_network: 1
        connectivity: Offline
        state: Operational
        timeout_seconds: 120
  - name: restore_node
    events:
      - type: reconnect_nodes
        type_selector: amplifier
        count_per_network: 1
