version: 1
name: p0-tc-030-node-ready-before-site
description: Start nodes before creating their site, verify the Console Node Pool shows Online/Ready, then add the site and verify Nodes List shows Online/Operational.
seed: 5030
suite: p0
priority: p0
tags: [virtual, console, nodes, lifecycle, ready, operational, tc-030]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_ready_before_site_assignment
    checks:
      - type: node_status_equals
        view: node_pool
        nodes: all
        connectivity: Online
        state: Ready
        immediate: true
        timeout_seconds: 120

  - name: assign_nodes_to_site
    events:
      - type: configure_sites
        sites: all
        state: ready
    checks:
      - type: node_status_equals
        view: nodes_list
        nodes: all
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180
