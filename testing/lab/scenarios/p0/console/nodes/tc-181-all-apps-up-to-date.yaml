version: 1
name: p0-tc-181-all-apps-up-to-date
description: Without promoting a newer release, verify every installed application returned for the controller reports up_to_date and includes its required identity fields.
seed: 5181
suite: p0
priority: p0
tags: [virtual, console, nodes, software, up-to-date, tc-181]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_every_app_current
    checks:
      - type: software_status_equals
        type_selector: controller
        count_per_network: 1
        app: all
        status: up_to_date
        required: true
        timeout_seconds: 180
