version: 1
name: p0-tc-177-offline-node-last-lifecycle
description: Take an operational controller offline and verify it remains in Nodes List with Offline connectivity and its last Operational lifecycle state, then restore it.
seed: 5177
suite: p0
priority: p0
tags: [virtual, console, nodes, offline, lifecycle, tc-177]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_operational_baseline
    checks:
      - type: node_status_equals
        view: nodes_list
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180

  - name: take_controller_offline
    events:
      - type: disconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        seconds: 120
    checks:
      - type: list_count_equals
        view: nodes_list
        target: nodes
        networks: net-001
        expected_count: 3
        immediate: true
      - type: node_status_equals
        view: nodes_list
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        state: Operational
        immediate: true
        timeout_seconds: 120
  - name: restore_controller
    events:
      - type: reconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        seconds: 180
    checks:
      - type: node_status_equals
        view: nodes_list
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180
