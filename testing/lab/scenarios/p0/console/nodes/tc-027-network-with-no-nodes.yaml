version: 1
name: p0-tc-027-network-with-no-nodes
description: Create a network without sites or nodes and verify its network-scoped Console Nodes list is empty.
seed: 5027
suite: p0
priority: p0
tags: [virtual, console, nodes, empty-topology, tc-027]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  nodes_per_site:
    tower: 0
    amplifier: 0
    controller: 0
  ues_per_site: 0
setup:
  create_via_bff: [networks]

phases:
  - name: verify_empty_node_list
    checks:
      - type: list_count_equals
        view: nodes_list
        target: nodes
        networks: net-001
        expected_count: 0
