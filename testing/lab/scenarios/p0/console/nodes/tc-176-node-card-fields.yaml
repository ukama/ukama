version: 1
name: p0-tc-176-node-card-fields
description: Verify tower, amplifier, and controller identity, type, site association, connectivity, and lifecycle fields match the world created for the test.
seed: 5176
suite: p0
priority: p0
tags: [virtual, console, nodes, card-fields, tc-176]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_node_cards
    checks:
      - type: entity_fields_equal
        entity: node
        ref: tower-site-001-001
      - type: entity_fields_equal
        entity: node
        ref: amplifier-site-001-001
      - type: entity_fields_equal
        entity: node
        ref: controller-site-001-001
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
