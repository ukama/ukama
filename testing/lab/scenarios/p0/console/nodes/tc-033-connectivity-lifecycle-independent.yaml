version: 1
name: p0-tc-033-connectivity-lifecycle-independent
description: Take an operational controller offline and verify its Nodes List connectivity changes while lifecycle remains Operational, then verify recovery.
seed: 5033
suite: p0
priority: p0
tags: [virtual, console, nodes, connectivity, lifecycle, tc-033]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_operational_baseline
    checks:
      - type: node_status_equals
        view: nodes_list
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180

  - name: disconnect_operational_node
    events:
      - type: disconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        seconds: 120
    checks:
      - type: node_status_equals
        view: nodes_list
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        state: Operational
        immediate: true
        timeout_seconds: 120
  - name: reconnect_node
    events:
      - type: reconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        seconds: 180
    checks:
      - type: node_status_equals
        view: nodes_list
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180
