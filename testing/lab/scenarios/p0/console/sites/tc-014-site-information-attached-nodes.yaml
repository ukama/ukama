version: 1
name: p0-tc-014-site-information-attached-nodes
description: Verify the selected site identity, network, coordinates, location metadata, and attached-node count match the site and node records created for the scenario.
seed: 5014
suite: p0
priority: p0
tags: [virtual, console, sites, detail, attached-nodes, tc-014]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_site_detail
    checks:
      - type: entity_fields_equal
        entity: site
        ref: site-001
        view: site_detail
      - type: entity_reconciles
        entity: site
        ref: site-001
        view: sites_list
      - type: list_count_equals
        target: site_nodes
        view: site_detail
        sites: site-001
        expected_count: 3
