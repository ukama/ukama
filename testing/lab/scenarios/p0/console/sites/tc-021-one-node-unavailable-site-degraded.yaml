version: 1
name: p0-tc-021-one-node-unavailable-site-degraded
description: Disconnect one amplifier from an otherwise healthy site and verify the Console site node counts report one offline node until it reconnects.
seed: 5021
suite: p0
priority: p0
tags: [virtual, console, site, degraded, tc-021]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: make_site_degraded
    events:
      - type: disconnect_nodes
        type_selector: amplifier
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: amplifier
        count_per_network: 1
        connectivity: Offline
        seconds: 120
    checks:
      - type: site_node_counts_equals
        sites: all
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 120
  - name: recover_site
    events:
      - type: reconnect_nodes
        type_selector: amplifier
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: amplifier
        count_per_network: 1
        connectivity: Online
        seconds: 180
    checks:
      - type: site_node_counts_equals
        sites: all
        total: 3
        online: 3
        offline: 0
        timeout_seconds: 180
