version: 1
name: p0-two-sites-small
description: Verify the selected network exposes two sites, six attached nodes, correct site detail fields, and usage from both sites through current BFF queries.
seed: 306
suite: p0
priority: p0
tags: [virtual, console, sites, runtime]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: site_usage
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 20
    checks:
      - type: usage_sample
        sample_per_site: 1
        expected: from_model
        tolerance_percent: 5

final_checks:
  - type: list_count_equals
    target: sites
    networks: net-001
    expected_count: 2
  - type: list_count_equals
    target: nodes
    networks: net-001
    expected_count: 6
  - type: entity_reconciles
    entity: site
    ref: site-001
  - type: entity_reconciles
    entity: site
    ref: site-002
