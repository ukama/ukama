version: 1
name: p0-tc-019-duplicate-site-restart
description: Start a site restart, verify the site is busy, reject a second restart request, and confirm the original operation eventually releases its lock.
seed: 5019
suite: p0
priority: p0
tags: [virtual, console, site, restart, conflict, tc-019]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: start_restart
    events:
      - type: restart_site
        sites: all
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: true
        timeout_seconds: 60
  - name: reject_duplicate
    events:
      - type: restart_site
        sites: all
        expect:
          result: failure
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
