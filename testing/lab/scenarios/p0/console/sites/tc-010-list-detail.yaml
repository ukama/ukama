version: 1
name: p0-console-sites-list-detail
description: Verify the Sites page count and each Site detail identity, coordinates, attached network, and operation availability reconcile through current BFF calls.
seed: 4803
suite: p0
priority: p0
tags: [virtual, console, sites, list-detail, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_site_list_and_detail
    checks:
      - type: list_count_equals
        target: sites
        view: sites_list
        networks: net-001
        expected_count: 2
      - type: entity_fields_equal
        entity: site
        ref: site-001
        view: site_detail
      - type: entity_reconciles
        entity: site
        ref: site-001
        view: sites_list
      - type: entity_fields_equal
        entity: site
        ref: site-002
        view: site_detail
      - type: entity_reconciles
        entity: site
        ref: site-002
        view: sites_list
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 120
