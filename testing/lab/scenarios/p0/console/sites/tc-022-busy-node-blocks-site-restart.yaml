version: 1
name: p0-tc-022-busy-node-blocks-site-restart
description: Start a controller software update, verify the node and site are busy, and confirm a conflicting site restart is rejected until the update finishes.
seed: 5022
suite: p0
priority: p0
tags: [virtual, console, site, operation-lock, software-update, tc-022]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        immediate: true

  - name: start_node_operation
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
      - type: wait
        seconds: 30
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_TARGET_VERSION}
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: true
        timeout_seconds: 60
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: true
        restart_available: false
        timeout_seconds: 60
        immediate: true

  - name: reject_site_restart
    events:
      - type: restart_site
        sites: all
        expect:
          result: failure
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300
        immediate: true
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        restart_available: true
        timeout_seconds: 300
        immediate: true
