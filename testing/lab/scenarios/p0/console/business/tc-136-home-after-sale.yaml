version: 1
name: p0-console-business-home-after-sale
description: Verify one successful customer sale is reflected consistently in Business Home revenue, active customers, paid customers, package sales, sites online, and freshness values.
seed: 4806
suite: p0
priority: p0
tags: [virtual, console, business-home, sale, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: business_plan
    name: Business Home Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_business_cards
    checks:
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 5.00
        tolerance: 0.001
        timeout_seconds: 600
      - type: kpi_value
        key: ACTIVE_CUSTOMERS
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 1
        timeout_seconds: 600
      - type: kpi_value
        key: PAID_CUSTOMERS
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 1
        timeout_seconds: 600
      - type: kpi_value
        key: PACKAGE_SALES
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 1
        timeout_seconds: 600
      - type: kpi_value
        key: SITES_ONLINE
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 1
        timeout_seconds: 120
      - type: kpi_state_equals
        key: REVENUE
        span: daily
        networks: net-001
        value_state: fresh
        max_age_seconds: 600
        timeout_seconds: 600
