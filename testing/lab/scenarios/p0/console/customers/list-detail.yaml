version: 1
name: p0-console-customers-list-detail
description: Verify the Customers page count and each Customer detail identity, network, SIM allocation, selected plan, and entitlement reconcile through current BFF calls.
seed: 4805
suite: p0
priority: p0
tags: [virtual, console, customers, list-detail, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
packages:
  - ref: customer_plan
    name: Customer Detail Plan
    data_mb: 100
    duration_days: 1
    amount: 2.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_customer_list_and_detail
    checks:
      - type: list_count_equals
        target: customers
        networks: net-001
        expected_count: 2
      - type: list_count_equals
        target: sims
        networks: net-001
        expected_count: 2
      - type: entity_reconciles
        entity: customer
        ref: sub-000001
      - type: entity_reconciles
        entity: customer
        ref: sub-000002
      - type: package_fields_equal
        package: customer_plan
      - type: package_assignment_count
        ues: all
        package: customer_plan
        expected_count: 1
