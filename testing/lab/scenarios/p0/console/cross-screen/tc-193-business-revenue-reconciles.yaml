version: 1
name: p0-tc-193-business-revenue-reconciles
description: Create two settled purchases and verify the Business Home REVENUE KPI and the Revenue summary source both return the same deterministic total for the selected network.
seed: 5193
suite: p0
priority: p0
tags: [virtual, console, cross-screen, revenue, tc-193]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: bootstrap
    name: Cross Screen Bootstrap
    data_mb: 100
    duration_days: 1
    amount: 2.00
    assign_percent: 100
  - ref: topup
    name: Cross Screen Topup
    data_mb: 500
    duration_days: 1
    amount: 5.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: create_second_purchase
    events:
      - type: purchase_package
        ues: all
        package: topup
        amount: 5.00
        currency: USD
    checks:
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 7.00
        tolerance: 0.001
        timeout_seconds: 600
      - type: revenue_summary
        networks: net-001
        column: total_paid
        expected_value: 7.00
        tolerance: 0.001
