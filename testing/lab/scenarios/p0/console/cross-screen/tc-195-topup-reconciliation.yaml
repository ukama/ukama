version: 1
name: p0-console-cross-screen-topup-reconciliation
description: Verify one console top-up produces one payment and entitlement and the Revenue and Packages data sources report the same sale exactly once.
seed: 4809
suite: p0
priority: p0
tags: [virtual, console, cross-screen, topup, reconciliation, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: bootstrap
    name: Cross Screen Bootstrap
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: topup
    name: Cross Screen Topup
    data_mb: 500
    duration_days: 1
    amount: 5.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: purchase_and_reconcile
    events:
      - type: purchase_package
        ues: all
        package: topup
        amount: 5.00
        currency: USD
    checks:
      - type: payment_entitlement_reconciles
        ues: all
        package: topup
      - type: payment_count
        ues: all
        package: topup
        status: settled
        expected_count: 1
      - type: package_assignment_count
        ues: all
        package: topup
        expected_count: 1
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: topup
        column: revenue
        expected_value: 5.00
        tolerance: 0.001
        timeout_seconds: 600
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: topup
        column: sold
        expected_value: 1
        timeout_seconds: 600
      - type: kpi_value
        key: PACKAGE_SALES
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 2
        timeout_seconds: 600