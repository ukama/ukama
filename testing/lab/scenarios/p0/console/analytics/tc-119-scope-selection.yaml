version: 1
name: p0-console-kpi-scope-selection
description: Generate one usage fact and verify GraphQL returns matching SIM, subscriber, package, site, and network KPI rows carrying each concrete scope identifier.
seed: 4717
suite: p0
priority: p0
tags: [virtual, console, analytics, scope, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: scoped_plan
    name: Console Scope Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: emit_scoped_usage
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 3
      - type: wait
        seconds: 30
    checks:
      - type: usage_aggregate
        target: sim
        ues: ue-000001
        timeout_seconds: 600
      - type: usage_aggregate
        target: subscriber
        ref: sub-000001
        timeout_seconds: 600
      - type: usage_aggregate
        target: package
        package: scoped_plan
        networks: net-001
        timeout_seconds: 600
      - type: usage_aggregate
        target: site
        sites: site-001
        timeout_seconds: 600
      - type: usage_aggregate
        target: network
        networks: net-001
        timeout_seconds: 600
