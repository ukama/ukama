version: 1
name: p0-console-kpi-rollup-consistency
description: Create one current-day sale in a new network and verify daily, weekly, and monthly REVENUE GraphQL rollups all equal the same five-dollar fact.
seed: 4720
suite: p0
priority: p0
tags: [virtual, console, analytics, rollup, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: rollup_plan
    name: KPI Rollup Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: compare_rollups
    checks:
      - type: kpi_rollup_consistency
        key: REVENUE
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 5.00
        tolerance: 0.001
