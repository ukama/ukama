version: 1
name: p0-console-kpi-empty-state
description: Create a network with no subscribers, SIMs, packages, or traffic and verify its network-scoped usage KPI returns the defined zero rather than another network's data.
seed: 4722
suite: p0
priority: p0
tags: [virtual, console, analytics, empty-state, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_empty_network
    checks:
      - type: kpi_value
        key: USAGE_BY_NETWORK
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 0
        timeout_seconds: 600
