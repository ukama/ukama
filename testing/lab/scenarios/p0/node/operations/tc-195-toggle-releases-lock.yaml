version: 1
name: p0-tc-195-toggle-releases-lock
description: Toggle radio and service on an idle site and verify each releases its operation lock well before the 120 second operation deadline.
seed: 5195
suite: p0
priority: p0
tags: [virtual, node, site, operation-lock, tc-195]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff: [networks, sites, nodes, node_site_links]

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        immediate: true

  - name: toggle_radio_releases_lock
    events:
      - type: toggle_radio
        sites: all
        state: on
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 60
        immediate: true

  - name: toggle_service_releases_lock
    events:
      - type: toggle_service
        sites: all
        state: on
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 60
        immediate: true
