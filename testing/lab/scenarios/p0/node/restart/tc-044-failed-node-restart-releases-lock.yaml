version: 1
name: p0-tc-044-failed-node-restart-releases-lock
description: Hold a restarted controller offline and verify the backend releases its node-operation lock after the restart times out.
seed: 5044
suite: p0
priority: p0
tags: [virtual, node, restart, failure-control, tc-044]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff: [networks, sites, nodes, node_site_links]

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: start_failed_restart
    events:
      - type: failure_control
        target: node_restart
        state: on
      - type: restart_nodes
        type_selector: controller
        count_per_network: 1
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: true
        timeout_seconds: 60

  - name: wait_for_restart_timeout
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300

  - name: restore_controller
    events:
      - type: failure_control
        target: node_restart
        state: off
      - type: wait_nodes_ready
        nodes: all
    checks:
      - type: node_status_equals
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        state: Operational
        timeout_seconds: 180
