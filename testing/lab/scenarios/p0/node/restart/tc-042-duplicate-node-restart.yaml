version: 1
name: p0-tc-042-duplicate-node-restart
description: Start a controller restart, verify its operation is active, reject a duplicate restart request, and confirm the lock is released after recovery.
seed: 5042
suite: p0
priority: p0
tags: [virtual, node, restart, conflict, tc-042]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        restart_available: true
        timeout_seconds: 300
        immediate: true

  - name: start_restart
    events:
      - type: restart_nodes
        type_selector: controller
        count_per_network: 1
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: true
        timeout_seconds: 60
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: true
        restart_available: false
        timeout_seconds: 60
        immediate: true

  - name: reject_duplicate
    events:
      - type: restart_nodes
        type_selector: controller
        count_per_network: 1
        expect:
          result: failure
    checks:
      - type: node_operation_status_equals
        type_selector: controller
        count_per_network: 1
        busy: false
        timeout_seconds: 300
        immediate: true
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        restart_available: true
        timeout_seconds: 300
        immediate: true
