version: 1
name: p0-tower-restart-recovers-small
description: Verify a UE reattaches and traffic resumes after restarting the tower node.
seed: 308
suite: p0
priority: p0
tags: [virtual, node, restart, service, traffic]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: before_restart
    events:
      - type: toggle_service
        sites: all
        state: on

      - type: start_ues
        ues: ue-000001

      - type: wait_ues_attached
        ues: ue-000001

    checks:
      - type: node_status_equals
        type_selector: tower
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180

      - type: traffic_allowed
        ues: ue-000001
        amount_mb: 1

  - name: restart_tower
    events:
      - type: restart_nodes
        type_selector: tower
        count_per_network: 1

      - type: wait_nodes_ready
        nodes: all

      - type: wait_ues_attached
        ues: ue-000001

    checks:
      - type: node_status_equals
        type_selector: tower
        count_per_network: 1
        connectivity: Online
        state: Operational
        immediate: true
        timeout_seconds: 180

      - type: traffic_allowed
        ues: ue-000001
        amount_mb: 1

final_checks:
  - type: backend_count
    target: sims
    expected: 1

  - type: balance_non_negative
    ues: all
