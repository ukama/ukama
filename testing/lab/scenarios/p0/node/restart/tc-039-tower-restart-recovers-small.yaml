version: 1
name: p0-tower-restart-recovers-small
description: Restart the tower, verify the UE session clears, then turn service back on and verify UE reattachment and traffic recovery.
seed: 308
suite: p0
priority: p0
tags: [virtual, node, restart, service, traffic]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: before_restart
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: ue-000001
      - type: wait_ues_attached
        ues: ue-000001
    checks:
      - type: traffic_allowed
        ues: ue-000001
        amount_mb: 1
      - type: site_operation_status_equals
        sites: all
        busy: false
        restart_available: true
        timeout_seconds: 300
        immediate: true

  - name: restart_tower
    events:
      - type: restart_nodes
        type_selector: tower
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: tower
        count_per_network: 1
        connectivity: Offline
        seconds: 120
      - type: wait_ues_detached
        ues: ue-000001
        seconds: 300
      - type: wait_node_connectivity
        type_selector: tower
        count_per_network: 1
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: enable_service_and_verify_traffic
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: wait_ues_attached
        ues: ue-000001
        seconds: 300
    checks:
      - type: traffic_allowed
        ues: ue-000001
        amount_mb: 1

final_checks:
  - type: backend_count
    target: sims
    expected: 1

  - type: balance_non_negative
    ues: all
