version: 1
name: p0-tc-200-nodes-online-ready-located
description: Start one tower, one amplifier, and one controller without a site and verify every node reports Online and Ready and the tower reports latitude and longitude.
seed: 5200
suite: p0
priority: p0
tags: [virtual, nodes, ready, location, tc-200]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: nodes_online_ready_and_tower_located
    events:
      - type: wait_site_anchor_located
        sites: all
    checks:
      - type: node_status_equals
        view: node_pool
        nodes: all
        connectivity: Online
        state: Ready
        immediate: true
        timeout_seconds: 300
