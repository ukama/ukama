version: 1
name: p0-console-sim-deactivate-reactivate
description: Deactivate a customer's SIM through BFF, verify attachment and traffic are blocked while package history remains, then reactivate it and restore service.
seed: 4811
suite: p0
priority: p0
tags: [virtual, console, sim, deactivate, reactivate]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: sim_plan
    name: SIM Lifecycle Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: establish_active_sim
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
    checks:
      - type: traffic_allowed
        ues: all
        amount_mb: 1
      - type: package_state
        ues: all
        package: sim_plan
        expected: active

  - name: deactivate_sim
    events:
      - type: toggle_sim_status
        ues: all
        status: service_off
      - type: wait_sim_status
        ues: all
        status: service_off
        seconds: 120
    checks:
      - type: traffic_unavailable
        ues: all
        amount_mb: 1
      - type: package_assignment_count
        ues: all
        package: sim_plan
        expected_count: 1

  - name: reactivate_sim
    events:
      - type: toggle_sim_status
        ues: all
        status: service_on
      - type: wait_sim_status
        ues: all
        status: service_on
        seconds: 120
      - type: wait_ues_attached
        ues: all
    checks:
      - type: traffic_allowed
        ues: all
        amount_mb: 1
      - type: package_state
        ues: all
        package: sim_plan
        expected: active
