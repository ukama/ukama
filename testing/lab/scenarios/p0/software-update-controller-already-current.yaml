version: 1
name: software_update_controller_already_current
description: Verify requesting the example app version already running on the controller is rejected as unnecessary without changing the version or app health.
seed: 1744158692
suite: p0
priority: p0
tags: [p0, virtual, software_update, controller, idempotent]
status: active
entity: software_update
action: update_already_current_version

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: verify_app_before_update
    checks:
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}

  - name: request_current_version
    events:
      - type: promote_release
        app: example
        tag: ${ULAB_SOFTWARE_CURRENT_VERSION}
      - type: wait
        seconds: 30
      - type: software_update
        type_selector: controller
        count_per_network: 1
        app: example
        tag: ${ULAB_SOFTWARE_CURRENT_VERSION}
        expect:
          result: failure
    checks:
      - type: node_version_equals
        type_selector: controller
        count_per_network: 1
        app: example
        version: ${ULAB_SOFTWARE_CURRENT_VERSION}
      - type: node_health_ok
        type_selector: controller
        count_per_network: 1
        app: example
