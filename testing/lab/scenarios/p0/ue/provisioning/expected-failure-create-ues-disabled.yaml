version: 1
name: p0-expected-failure-create-ues-disabled
description: Verify the disabled create_ues event reports an expected failure without adding SIMs.
seed: 309
suite: p0
priority: p0
tags: [virtual, negative, language]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: disabled_event_fails_cleanly
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 300
      - type: create_ues
        count_per_site: 1
        expect:
          result: failure
          error_contains: not enabled
    checks:
      - type: backend_count
        target: sims
        expected: from_world

final_checks:
  - type: balance_non_negative
    ues: all
