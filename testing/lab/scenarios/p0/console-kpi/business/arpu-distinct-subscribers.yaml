version: 1
name: p0-console-kpi-arpu-distinct-subscribers
description: Give one subscriber two paid SIMs and verify ARPU divides current-month revenue by one distinct paying subscriber rather than by two SIM attachments.
seed: 4704
suite: p0
priority: p0
tags: [virtual, console-kpi, arpu, subscriber, graphql, backend-only, non-console]
status: skip
# Console acceptance: skipped because the current console cannot create this input or topology.
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
  sims_per_subscriber: 2
packages:
  - ref: arpu_plan
    name: Console ARPU Plan
    data_mb: 100
    duration_days: 1
    amount: 4.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
