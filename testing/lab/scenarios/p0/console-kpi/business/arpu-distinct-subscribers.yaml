    checks:
      - type: kpi_value
        key: ARPU
        span: monthly
        op: AVG
        scope_key: network_id
        networks: net-001
        expected_value: 4.00
        tolerance: 0.001
        timeout_seconds: 120
      - type: kpi_value
        key: ARPU
        span: monthly
        op: AVG
        scope_key: network_id
