version: 1
name: p0-console-kpi-revenue-trend
description: Create current-period revenue and verify the REVENUE GraphQL row carries computedAt plus internally consistent previous-value, change, percentage, and direction metadata when a prior period exists.
seed: 4702
suite: p0
priority: p0
tags: [virtual, console-kpi, revenue, trend, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: trend_plan
    name: Console Revenue Trend Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_trend_contract
    checks:
      - type: kpi_contract
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 5.00
        tolerance: 0.001
        require_computed_at: true
        require_scope: true
        require_trend_consistency: true
        timeout_seconds: 600

