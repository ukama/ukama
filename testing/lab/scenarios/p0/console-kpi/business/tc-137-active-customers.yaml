version: 1
name: p0-console-kpi-active-customers
description: Create two console customers and verify the selected network's direct customer list and ACTIVE_CUSTOMERS KPI both return two.
seed: 4705
suite: p0
priority: p0
tags: [virtual, console-kpi, active-customers, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
packages:
  - ref: customer_plan
    name: Console Active Customer Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_active_customers
    checks:
      - type: list_count_equals
        target: customers
        networks: net-001
        expected_count: 2
      - type: kpi_value
        key: ACTIVE_CUSTOMERS
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 2
        timeout_seconds: 600
      - type: entity_reconciles
        entity: customer
        ref: sub-000001
