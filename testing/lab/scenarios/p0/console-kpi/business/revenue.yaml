version: 1
name: p0-console-kpi-revenue
description: Create one settled package sale and verify both RevenueOverview and the network-scoped REVENUE KPI report the same five-dollar value through GraphQL.
seed: 4701
suite: p0
priority: p0
tags: [virtual, console-kpi, revenue, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: revenue_plan
    name: Console Revenue Plan
    data_mb: 100
    duration_days: 1
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_revenue_views
    checks:
      - type: kpi_value
        key: REVENUE
        span: monthly
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 5.00
        tolerance: 0.001
        timeout_seconds: 600
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 5.00
        tolerance: 0.001
        timeout_seconds: 600

