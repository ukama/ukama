version: 1
name: p0-console-kpi-paid-customers
description: Allocate paid packages to two subscribers, add a repeat purchase for one, and verify PAID_CUSTOMERS remains two distinct subscribers rather than three payments.
seed: 4706
suite: p0
priority: p0
tags: [virtual, console-kpi, paid-customers, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
packages:
  - ref: bootstrap
    name: Paid Customer Bootstrap
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: additional
    name: Paid Customer Additional
    data_mb: 500
    duration_days: 1
    amount: 5.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
# Both initial allocations must create payment records. Explicitly purchasing
# the bootstrap package here would hide a broken allocation-payment contract.
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: add_repeat_purchase
    events:
      - type: purchase_package
        ues: ue-000001
        package: additional
        amount: 5.00
        currency: USD
    checks:
      - type: kpi_value
        key: PAID_CUSTOMERS
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 2
        timeout_seconds: 600
