version: 1
name: p0-console-kpi-mrr-minute-normalization
description: Sell a minute-duration plan and verify PackagesDashboard publishes MRR as current-month settled revenue without losing or rescaling the payment because validity is expressed in minutes.
seed: 4703
suite: p0
priority: p0
tags: [virtual, console-kpi, mrr, duration-minutes, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: minute_plan
    name: Console Minute MRR Plan
    data_mb: 100
    duration_minutes: 10
    amount: 5.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_mrr
    checks:
      - type: package_dashboard_metric
        networks: net-001
        column: mrr
        expected_value: 5.00
        tolerance: 0.001

