version: 1
name: p0-console-kpi-site-uptime
description: Verify site uptime excludes intentional radio-off windows and includes unplanned tower or amplifier downtime.
seed: 4712
suite: p0
priority: p0
tags: [virtual, console-kpi]
status: wip
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_contract
    checks:
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        sites: all
        expected_value: 0
        timeout_seconds: 600
        poll_seconds: 5
