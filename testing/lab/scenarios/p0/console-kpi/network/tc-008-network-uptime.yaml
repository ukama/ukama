version: 1
name: p0-console-kpi-network-uptime
description: Verify NETWORK_UPTIME is 0 with service off by default, rises when both sites go into service, and stays partial after a short service outage on one site.
seed: 4713
suite: p0
priority: p0
tags: [virtual, console-kpi, network-uptime, service, radio, controller, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  # New sites start with service and radio intent off and the towers boot
  # with service off. The lab adds each site after its nodes are ready, so
  # every window reads both sites as down.
  - name: service_off_by_default
    events:
      - type: wait
        seconds: 120
    checks:
      - type: kpi_value
        key: NETWORK_UPTIME
        span: daily
        op: AVG
        scope_key: network_id
        networks: net-001
        expected_value: 0
        tolerance: 0.001
        immediate: true
        timeout_seconds: 300
        poll_seconds: 20
  # Toggling service off on a site that is already off sends no command to
  # the tower, so both sites go into service before the off interval below.
  - name: sites_in_service
    events:
      # The radio is already on at the nodes, but each site's radio intent
      # defaults to off. The service toggle reconciles the whole intent, so
      # set radio intent to on first or that reconcile switches the radio off.
      - type: toggle_radio
        sites: all
        state: on
      - type: toggle_service
        sites: all
        state: on
      - type: wait
        seconds: 120
    checks:
      # Both sites share tc-185's timeline, where this point read 50 to 57
      # on the 1m analytics window. The tolerance absorbs one to two windows
      # of timing drift.
      - type: kpi_value
        key: NETWORK_UPTIME
        span: daily
        op: AVG
        scope_key: network_id
        networks: net-001
        expected_value: 50
        tolerance: 10
        immediate: true
        timeout_seconds: 300
        poll_seconds: 20
  - name: create_network_uptime_window
    events:
      - type: toggle_service
        sites: site-001
        state: off
      - type: wait
        seconds: 30
      - type: toggle_service
        sites: site-001
        state: on
      - type: wait
        seconds: 10
    checks:
      # The off interval costs site-001 at most a window or two, so the daily
      # value stays near the previous phase and is still a partial period.
      - type: kpi_contract
        key: NETWORK_UPTIME
        span: daily
        op: AVG
        scope_key: network_id
        networks: net-001
        expected_value: 50
        tolerance: 15
        expected_partial: true
        timeout_seconds: 180
