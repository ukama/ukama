version: 1
name: p0-console-kpi-data-volume
description: Generate known traffic on two SIMs and verify the DATA_USAGE Console KPI, folded to the network by a network_id filter, equals their GraphQL-visible usage.
seed: 4710
suite: p0
priority: p0
tags: [virtual, console-kpi, data-volume, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
packages:
  - ref: volume_plan
    name: Console Data Volume Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: generate_network_volume
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 4
      - type: wait
        seconds: 60
    checks:
      - type: usage_aggregate
        target: network
        networks: net-001
        key: DATA_USAGE
        span: daily
        tolerance_percent: 15
        timeout_seconds: 600
