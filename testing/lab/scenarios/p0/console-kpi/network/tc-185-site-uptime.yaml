version: 1
name: p0-console-kpi-site-uptime
description: Switch RF off and back on through the Console and verify the RF-off interval counts as downtime in SITE_UPTIME while the site recovers online.
seed: 4712
suite: p0
priority: p0
tags: [virtual, console-kpi, site-uptime, radio, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline_site_up
    checks:
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        expected_value: 100
        tolerance: 0.001
        immediate: true
        timeout_seconds: 120
        poll_seconds: 20
  - name: radio_off_counts_as_downtime
    events:
      - type: toggle_radio
        sites: site-001
        state: off
      - type: wait
        seconds: 120
    checks:
      - type: kpi_value
        key: SITES_ONLINE
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 0
        immediate: true
        timeout_seconds: 120
        poll_seconds: 20
      # An absolute tolerance expresses 0 <= uptime <= 99.999 percent.
      # The exact daily percentage depends on report timing and elapsed uptime.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: less_than
        expected_value: 100
        immediate: true
        timeout_seconds: 120
        poll_seconds: 20
  - name: radio_on_restores_service
    events:
      - type: toggle_radio
        sites: site-001
        state: on
      - type: wait
        seconds: 120
    checks:
      # Recovery restores the current online count.
      - type: kpi_value
        key: SITES_ONLINE
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 1
        immediate: true
        timeout_seconds: 120
        poll_seconds: 20
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: greater_than
        expected_value: 0
        immediate: true
        timeout_seconds: 160
        poll_seconds: 20
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: less_than
        expected_value: 100
        immediate: true
        timeout_seconds: 160
        poll_seconds: 20
