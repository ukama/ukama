version: 1
name: p0-console-kpi-site-uptime
description: Verify a new site reads as down in SITE_UPTIME while its cellular service is off by default, that turning radio and service on raises SITE_UPTIME, and that switching RF off and back on counts the RF-off interval as downtime.
seed: 4712
suite: p0
priority: p0
tags: [virtual, console-kpi, site-uptime, service, radio, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  # A new site's intent is service off and radio off, and the tower boots with
  # service off, so SITE_UPTIME records the site as down from the tower's
  # first health report on.
  - name: service_off_by_default
    events:
      - type: wait
        seconds: 120
    checks:
      # At least one window has recorded the site as down.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: MIN
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        expected_value: 0
        tolerance: 0.001
        immediate: true
        timeout_seconds: 300
        poll_seconds: 20
      # Windows before the tower's first health report count as up, so the
      # daily average starts above 0 and falls below 50 once the down windows
      # outnumber them.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: less_than
        expected_value: 50
        immediate: true
        timeout_seconds: 600
        poll_seconds: 20
  - name: service_on_restores_uptime
    events:
      # Radio first: a service toggle reconciles the whole site intent, and
      # with the default radio intent (off) it would switch the radio off.
      - type: toggle_radio
        sites: site-001
        state: on
      - type: toggle_service
        sites: site-001
        state: on
      - type: wait
        seconds: 120
    checks:
      # The up windows now outnumber the down ones. A plain > 0 would already
      # hold from the windows before the first health report.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: greater_than
        expected_value: 50
        immediate: true
        timeout_seconds: 900
        poll_seconds: 20
  - name: radio_off_counts_as_downtime
    events:
      - type: toggle_radio
        sites: site-001
        state: off
      - type: wait
        seconds: 120
    checks:
      # RF off is downtime: the daily average drops below 100.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: less_than
        expected_value: 100
        immediate: true
        timeout_seconds: 120
        poll_seconds: 20
  - name: radio_on_restores_service
    events:
      - type: toggle_radio
        sites: site-001
        state: on
      - type: wait
        seconds: 120
    checks:
      # The RF-off windows remain in the daily average.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: greater_than
        expected_value: 0
        immediate: true
        timeout_seconds: 160
        poll_seconds: 20
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        comparator: less_than
        expected_value: 100
        immediate: true
        timeout_seconds: 160
        poll_seconds: 20