version: 1
name: p0-console-kpi-site-uptime
description: Verify a new site reads as down in SITE_UPTIME while its cellular service is off by default, that turning radio and service on raises SITE_UPTIME, and that switching RF off and back on counts the RF-off interval as downtime.
seed: 4712
suite: p0
priority: p0
tags: [virtual, console-kpi, site-uptime, service, radio, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  # A new site's intent is service off and radio off, and the tower boots with
  # service off. The lab adds the site only after its nodes are ready, so the
  # tower is already reporting service off in the site's first window and
  # every window reads 0.
  - name: service_off_by_default
    events:
      - type: wait
        seconds: 120
    checks:
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        expected_value: 0
        tolerance: 0.001
        immediate: true
        timeout_seconds: 300
        poll_seconds: 20
  - name: service_on_restores_uptime
    events:
      # Radio first: a service toggle reconciles the whole site intent, and
      # with the default radio intent (off) it would switch the radio off.
      - type: toggle_radio
        sites: site-001
        state: on
      - type: toggle_service
        sites: site-001
        state: on
      - type: wait
        seconds: 120
    checks:
      # Compare with the measured OFF baseline; startup time changes the
      # number of windows in the daily average.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        expected: previous
        comparator: greater_than
        immediate: true
        timeout_seconds: 300
        poll_seconds: 20
  - name: radio_off_counts_as_downtime
    events:
      - type: toggle_radio
        sites: site-001
        state: off
      - type: wait
        seconds: 120
    checks:
      # RF off must lower the measured daily average.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        expected: previous
        comparator: less_than
        immediate: true
        timeout_seconds: 180
        poll_seconds: 20
  - name: radio_on_restores_service
    events:
      - type: toggle_radio
        sites: site-001
        state: on
      - type: wait
        seconds: 120
    checks:
      # RF on must raise the average again, retaining the RF-off history.
      - type: kpi_value
        key: SITE_UPTIME
        span: daily
        op: AVG
        scope_key: site_id
        scope_value: site-001
        networks: net-001
        expected: previous
        comparator: greater_than
        immediate: true
        timeout_seconds: 180
        poll_seconds: 20
