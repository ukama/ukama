version: 1
name: p0-console-kpi-sites-degraded
description: Turn the site service off and back on, verifying SITES_DEGRADED moves from zero to one and back for that network.
seed: 4713
suite: p0
priority: p0
tags: [virtual, console-kpi, sites-degraded, service, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: baseline_not_degraded
    checks:
      - type: kpi_value
        key: SITES_DEGRADED
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 0
        immediate: true
        timeout_seconds: 600
        poll_seconds: 10
  - name: service_off_degrades
    events:
      - type: toggle_service
        sites: site-001
        state: off
      - type: wait
        seconds: 90
    checks:
      - type: kpi_value
        key: SITES_DEGRADED
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 1
        immediate: true
        timeout_seconds: 300
        poll_seconds: 10
  - name: service_on_clears_degraded
    events:
      - type: toggle_service
        sites: site-001
        state: on
      - type: wait
        seconds: 90
    checks:
      - type: kpi_value
        key: SITES_DEGRADED
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 0
        immediate: true
        timeout_seconds: 300
        poll_seconds: 10
