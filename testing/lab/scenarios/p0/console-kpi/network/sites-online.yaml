version: 1
name: p0-console-kpi-sites-online
description: Disable and re-enable the only site through the GraphQL controller mutation and verify SITES_ONLINE moves from zero back to one for that network.
seed: 4711
suite: p0
priority: p0
tags: [virtual, console-kpi, sites-online, controller, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: take_site_out_of_service
    events:
      - type: toggle_service
        sites: site-001
        state: off
      - type: wait
        seconds: 40
    checks:
      - type: kpi_value
        key: SITES_DEGRADED
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 1
        timeout_seconds: 300
  - name: restore_site_service
    events:
      - type: toggle_service
        sites: site-001
        state: on
      - type: wait
        seconds: 40
    checks:
      - type: kpi_value
        key: SITES_DEGRADED
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 0
        immediate: true
        timeout_seconds: 300

