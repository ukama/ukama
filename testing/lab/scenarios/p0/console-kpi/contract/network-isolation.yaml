version: 1
name: p0-console-kpi-network-isolation
description: Create equal sales in two networks, add one sale only to network one, and verify network-scoped REVENUE rows expose six dollars and one dollar respectively.
seed: 4718
suite: p0
priority: p0
tags: [virtual, console-kpi, contract, network-isolation, graphql]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: bootstrap
    name: KPI Isolation Bootstrap
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: additional
    name: KPI Isolation Additional
    data_mb: 500
    duration_days: 1
    amount: 5.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: create_asymmetric_revenue
    events:
      - type: purchase_package
        ues: ue-000001
        package: additional
        amount: 5.00
        currency: USD
    checks:
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-001
        expected_value: 6.00
        tolerance: 0.001
        timeout_seconds: 600
      - type: kpi_value
        key: REVENUE
        span: daily
        op: SUM
        scope_key: network_id
        networks: net-002
        expected_value: 1.00
        tolerance: 0.001
        timeout_seconds: 600

