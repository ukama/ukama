version: 1
name: p0-console-kpi-component-inventory
description: Verify the Console component inventory serves the fixed catalog seeded from the networks repository, with exact counts per category.
seed: 4716
suite: p0
priority: p0
tags: [virtual, console-kpi, inventory, component, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 0
  ues_per_site: 0
setup:
  create_via_bff: [networks]

# Power, backhaul, and switch components are seeded by the component service
# from the networks repository, so their counts are fixed by the fixture and
# do not depend on anything this scenario provisions. Access components are
# excluded here because they are minted per factory node; tc-026 covers those.
phases:
  - name: component_catalog_counts
    checks:
      - type: component_count_by_category
        category: power
        expected_count: 2
      - type: component_count_by_category
        category: backhaul
        expected_count: 3
      - type: component_count_by_category
        category: switch
        expected_count: 2
