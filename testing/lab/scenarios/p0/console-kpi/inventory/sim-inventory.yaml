version: 1
name: p0-console-kpi-sim-inventory
description: Query the Console SIM inventory with SimPoolOverview and verify its total, available, and consumed statistics reconcile.
seed: 4714
suite: p0
priority: p0
tags: [virtual, console-kpi, inventory, sim, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: reconcile_sim_inventory
    checks:
      - type: console_inventory_reconciles
        target: sim
