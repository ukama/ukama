version: 1
name: p0-console-kpi-node-inventory
description: Verify NetworkHome node totals reconcile with NodesList and with the online-plus-offline breakdown for the selected network.
seed: 4715
suite: p0
priority: p0
tags: [virtual, console-kpi, inventory, node, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: reconcile_node_inventory
    checks:
      - type: console_inventory_reconciles
        target: node
        networks: net-001

