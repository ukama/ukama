version: 1
name: p0-console-kpi-node-inventory
description: Verify the Nodes page count and direct node detail records reconcile for all six nodes in the selected network.
seed: 4715
suite: p0
priority: p0
tags: [virtual, console-kpi, inventory, node, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: reconcile_node_inventory
    checks:
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 6
      - type: entity_reconciles
        entity: node
        ref: tower-site-001-001
      - type: entity_reconciles
        entity: node
        ref: amplifier-site-001-001
      - type: entity_reconciles
        entity: node
        ref: controller-site-001-001
      - type: node_status_equals
        nodes: all
        connectivity: Online
        timeout_seconds: 120
