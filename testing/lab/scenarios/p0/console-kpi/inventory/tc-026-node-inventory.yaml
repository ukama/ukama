version: 1
name: p0-console-kpi-node-inventory
description: Verify every node the run provisions and allocates in the node factory appears in the component inventory under the access category, keyed by its node id.
seed: 4715
suite: p0
priority: p0
tags: [virtual, console-kpi, inventory, node, component, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

# Starting the site reserves a factory bundle, marks all three nodes
# provisioned, and allocates them to the org. The inventory component service
# polls the factory on a one minute schedule and mints one access component
# per node, keyed by the node id.
phases:
  - name: node_factory_to_component_inventory
    checks:
      - type: node_component_registered
        nodes: all
        target: access
        timeout_seconds: 300
        poll_seconds: 10
