version: 1
name: p0-console-kpi-node-inventory
description: Reserve two node bundles from the node factory, then verify the Nodes page reconciles all six nodes and the component inventory carries one access component per factory node id.
seed: 4715
suite: p0
priority: p0
tags: [virtual, console-kpi, inventory, node, component, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 2
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: reconcile_node_inventory
    checks:
      - type: list_count_equals
        target: nodes
        networks: net-001
        expected_count: 6
      - type: entity_reconciles
        entity: node
        ref: tower-site-001-001
      - type: entity_reconciles
        entity: node
        ref: amplifier-site-001-001
      - type: entity_reconciles
        entity: node
        ref: controller-site-001-001
      - type: node_status_equals
        nodes: all
        connectivity: Online
        timeout_seconds: 120

  # Starting the nodes reserves and provisions their bundles in the node
  # factory. The inventory component service polls the factory on a one
  # minute schedule and mints one access component per provisioned node,
  # keyed by the factory node id.
  - name: factory_nodes_reach_component_inventory
    checks:
      - type: node_component_registered
        nodes: all
        category: access
        timeout_seconds: 300
        poll_seconds: 10
