version: 1
name: p0-console-kpi-package-sales
description: Verify each settled package purchase counts once, including a paid entitlement waiting in the activation queue.
seed: 4707
suite: p0
priority: p0
tags: [virtual, console-kpi]
status: wip
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_contract
    checks:
      - type: kpi_value
        key: PACKAGE_SALES
        span: daily
        op: SUM
        scope_key: package_id
        networks: all
        expected_value: 0
        timeout_seconds: 600
        poll_seconds: 5
