version: 1
name: p0-console-kpi-active-plans
description: Create two active catalog plans but attach a SIM to only one and verify ACTIVE_PLANS counts the distinct plan with an active assignment rather than both catalog flags.
seed: 4708
suite: p0
priority: p0
tags: [virtual, console-kpi, active-plans, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: attached_plan
    name: Active Plans Attached
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
  - ref: unattached_plan
    name: Active Plans Unattached
    data_mb: 100
    duration_days: 1
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: verify_active_plan_definition
    checks:
      - type: package_dashboard_metric
        networks: net-001
        package: attached_plan
        column: attach_count
        expected_value: 1
      - type: package_dashboard_metric
        networks: net-001
        package: unattached_plan
        column: attach_count
        expected_value: 0
      - type: kpi_value
        key: ACTIVE_PLANS
        span: daily
        op: LAST
        scope_key: network_id
        networks: net-001
        expected_value: 1
        timeout_seconds: 600

