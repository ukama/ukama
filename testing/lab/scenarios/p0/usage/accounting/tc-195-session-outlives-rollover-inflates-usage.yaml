version: 1
name: p0-session-outlives-rollover-inflates-usage
description: Keep a UE session open across a time-based package rollover, finalize it only after the successor package is active, and prove the successor's own usage allowance is not inflated by the outgoing package's traffic.
seed: 4526
suite: p0
priority: p0
tags: [virtual, usage, accounting, policy]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Outlived Session Current
    data_mb: 10
    duration_minutes: 1
    amount: 1.00
    assign_percent: 100
  - ref: successor_plan
    name: Outlived Session Successor
    data_mb: 2
    duration_minutes: 10
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: outlive_the_rollover
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: purchase_package
        ues: all
        package: successor_plan
      - type: traffic
        ues: all
        amount_mb: 3
      - type: wait
        seconds: 90
      - type: finalize_ue_sessions
        ues: all
        seconds: 60
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
    checks:
      - type: package_state
        ues: all
        package: successor_plan
        expected: active
      - type: traffic_allowed
        ues: all
        amount_mb: 1
      - type: usage_per_sim
        ues: all
        expected: from_model
