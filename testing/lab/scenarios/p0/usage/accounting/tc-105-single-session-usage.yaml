version: 1
name: p0-single-session-usage
description: Generate one five-megabyte session and verify getSimsUsageByNetwork returns that SIM's recorded usage within the accounting overhead tolerance.
seed: 4514
suite: p0
priority: p0
tags: [virtual, usage, accounting, single-session, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: usage_plan
    name: Single Session Usage Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: generate_single_session
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 5
      - type: wait
        seconds: 30
    checks:
      - type: usage_per_sim
        ues: all
        expected: from_model
        tolerance_percent: 2
