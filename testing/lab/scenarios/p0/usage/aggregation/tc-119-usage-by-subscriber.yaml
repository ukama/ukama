version: 1
name: p0-usage-by-subscriber
description: Allocate SIMs to one subscriber, generate four megabytes on each, and verify the subscriber total equals the sum of its SIMs' iccid-scoped DATA_USAGE rows (subscriber is not a KPI dimension; usage is per SIM).
seed: 4519
suite: p0
priority: p0
tags: [virtual, usage, aggregation, subscriber, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
  sims_per_subscriber: 2
packages:
  - ref: usage_plan
    name: Subscriber Aggregate Usage Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: aggregate_subscriber_usage
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 4
      - type: wait
        seconds: 60
    checks:
      - type: usage_per_sim
        ues: all
        expected: from_model
      - type: usage_aggregate
        target: subscriber
        ref: sub-000001
        span: daily
        tolerance_percent: 15
        timeout_seconds: 600
