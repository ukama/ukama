version: 1
name: p0-usage-by-sim
description: Generate different traffic totals for two SIMs and verify both direct GraphQL usage rows and the SIM-scoped KPI preserve their individual attribution.
seed: 4518
suite: p0
priority: p0
tags: [virtual, usage, aggregation, sim, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
packages:
  - ref: usage_plan
    name: SIM Aggregate Usage Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes, ues]
  wait: [nodes_ready, ues_attached]
phases:
  - name: generate_distinct_sim_usage
    events:
      - type: traffic
        ues: ue-000001
        amount_mb: 3
      - type: traffic
        ues: ue-000002
        amount_mb: 7
      - type: wait
        seconds: 5
    checks:
      - type: usage_per_sim
        ues: all
        expected: from_model
      - type: usage_aggregate
        target: sim
        ues: ue-000001
        span: daily
        op: SUM
        tolerance_percent: 15
        timeout_seconds: 600
      - type: usage_aggregate
        target: sim
        ues: ue-000002
        span: daily
        op: SUM
        tolerance_percent: 15
        timeout_seconds: 600

