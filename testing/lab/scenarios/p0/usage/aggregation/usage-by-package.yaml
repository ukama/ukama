version: 1
name: p0-usage-by-package
description: Generate usage on two assignments of one package and verify the package-scoped GraphQL KPI equals the sum of those SIMs.
seed: 4520
suite: p0
priority: p0
tags: [virtual, usage, aggregation, package, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 2
packages:
  - ref: shared_plan
    name: Package Aggregate Usage Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: aggregate_package_usage
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: all
        amount_mb: 4
      - type: wait
        seconds: 5
    checks:
      - type: usage_aggregate
        target: package
        package: shared_plan
        networks: net-001
        span: daily
        op: SUM
        tolerance_percent: 15
        timeout_seconds: 600
