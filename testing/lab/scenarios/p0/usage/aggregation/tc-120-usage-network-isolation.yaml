version: 1
name: p0-usage-network-isolation
description: Generate traffic only in network one and verify the network_id filter isolates it, so network one reports the usage while network two reports none of it.
seed: 4523
suite: p0
priority: p0
tags: [virtual, usage, aggregation, multi-network, isolation, graphql]
status: active
provider:
  type: virtual
world:
  networks: 2
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: usage_plan
    name: Isolated Network Usage Plan
    data_mb: 100
    duration_days: 1
    amount: 1.00
    assign_percent: 100
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes]
  wait: [nodes_ready]
phases:
  - name: generate_in_network_one_only
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
      - type: traffic
        ues: ue-000001
        amount_mb: 5
      - type: wait
        seconds: 60
    checks:
      # No key: the target picks DATA_USAGE. No op: kind=flow derives SUM.
      # The target's dimension is sent as a scope FILTER, so the gateway folds
      # the per-SIM series to that grain and returns it in the row's scope.
      - type: usage_aggregate
        target: network
        networks: net-001
        span: daily
        tolerance_percent: 15
        timeout_seconds: 600
      - type: usage_aggregate
        target: network
        networks: net-002
        span: daily
        tolerance_percent: 15
        timeout_seconds: 600
