version: 1
name: p0-profile-usage-small
description: Verify six UEs follow light, normal, and heavy profiles and report modeled usage.
seed: 310
suite: p0
priority: p0
tags: [virtual, usage, profile]
status: active

provider:
  type: virtual

world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 6

packages:
  - ref: daily_1gb
    name: Daily 1GB
    data_mb: 1024
    duration_days: 1
    amount: 1.00
    assign_percent: 100

setup:
  create_via_bff:
    - networks
    - sites
    - nodes
    - node_site_links
    - packages
    - subscribers
    - sims

runtime:
  start: [nodes]
  wait: [nodes_ready]

profiles:
  usage:
    light:
      percent: 50
      amount_mb: 25
    normal:
      percent: 33
      amount_mb: 100
    heavy:
      percent: 17
      amount_mb: 250

phases:
  - name: wait_for_assigned_site
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        service_available: true
        timeout_seconds: 300
        immediate: true

  - name: profile_traffic
    events:
      - type: toggle_service
        sites: all
        state: on
      - type: start_ues
        ues: all
      - type: wait_ues_attached
        ues: all
        seconds: 300
      - type: traffic_by_profile
        ues: all
        profile: usage
    checks:
      - type: usage_sample
        sample_per_site: 3
        expected: from_model
        tolerance_percent: 5

final_checks:
  - type: backend_count
    target: sims
    expected: from_world
  - type: balance_non_negative
    ues: all
