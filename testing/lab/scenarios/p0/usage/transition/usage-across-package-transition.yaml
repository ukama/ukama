version: 1
name: p0-usage-across-package-transition
description: Exhaust the active package, send more traffic on its paid successor, and verify GraphQL attributes the bytes to the package that was active at each side of the boundary.
seed: 4524
suite: p0
priority: p0
tags: [virtual, usage, transition, package, graphql]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 1
packages:
  - ref: current_plan
    name: Transition Usage Current
    data_mb: 2
    duration_minutes: 10
    amount: 1.00
    assign_percent: 100
  - ref: successor_plan
    name: Transition Usage Successor
    data_mb: 10
    duration_minutes: 10
    amount: 2.00
    assign_percent: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links, packages, subscribers, sims]
runtime:
  start: [nodes, ues]
  wait: [nodes_ready, ues_attached]
phases:
  - name: cross_package_boundary
    events:
      - type: purchase_package
        ues: all
        package: successor_plan
      - type: traffic
        ues: all
        amount_mb: 2
      - type: wait
        seconds: 5
      - type: traffic
        ues: all
        amount_mb: 3
      - type: wait
        seconds: 5
    checks:
      - type: package_state
        ues: all
        package: successor_plan
        expected: active
      - type: usage_per_sim
        ues: all
        expected: from_model
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: current_plan
        column: data_used
        expected_value: 2097152
        tolerance: 314573
      - type: performance_report_cell
        report: package_performance
        span: daily
        networks: net-001
        package: successor_plan
        column: data_used
        expected_value: 3145728
        tolerance: 471859
