version: 1
name: p0-tc-072-busy-tower-blocks-service-change
description: Start a tower restart and verify a cellular-service state change is rejected while the tower operation is active.
seed: 5072
suite: p0
priority: p0
tags: [virtual, site, service, tower, operation-lock, tc-072]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: make_tower_busy
    events:
      - type: restart_nodes
        type_selector: tower
        count_per_network: 1
    checks:
      - type: node_operation_status_equals
        type_selector: tower
        count_per_network: 1
        busy: true
        timeout_seconds: 60
  - name: reject_service_change
    events:
      - type: toggle_service
        sites: all
        state: off
        expect:
          result: failure
    checks:
      - type: node_operation_status_equals
        type_selector: tower
        count_per_network: 1
        busy: false
        timeout_seconds: 300
