version: 1
name: p0-tc-073-busy-amplifier-blocks-rf-change
description: Start an amplifier restart and verify an RF state change is rejected while the amplifier operation is active.
seed: 5073
suite: p0
priority: p0
tags: [virtual, site, rf, amplifier, operation-lock, tc-073]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: make_amplifier_busy
    events:
      - type: restart_nodes
        type_selector: amplifier
        count_per_network: 1
    checks:
      - type: node_operation_status_equals
        type_selector: amplifier
        count_per_network: 1
        busy: true
        timeout_seconds: 60
  - name: reject_rf_change
    events:
      - type: toggle_radio
        sites: all
        state: off
        expect:
          result: failure
    checks:
      - type: node_operation_status_equals
        type_selector: amplifier
        count_per_network: 1
        busy: false
        timeout_seconds: 300
