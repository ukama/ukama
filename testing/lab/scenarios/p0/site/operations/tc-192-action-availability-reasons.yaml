version: 1
name: p0-tc-192-action-availability-reasons
description: Verify site action availability follows healthy, degraded, offline, and busy node conditions and that unavailable actions return a non-empty reason.
seed: 5192
suite: p0
priority: p0
tags: [virtual, site, operations, availability, reasons, tc-192]
status: active
provider:
  type: virtual
world:
  networks: 1
  sites_per_network: 1
  nodes_per_site:
    tower: 1
    amplifier: 1
    controller: 1
  ues_per_site: 0
setup:
  create_via_bff: [networks, sites, nodes, node_site_links]
runtime:
  start: [nodes]
  wait: [nodes_ready]

phases:
  - name: healthy_actions_available
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        restart_available: true
        rf_available: true
        service_available: true
        immediate: true
        timeout_seconds: 300

  - name: degraded_site_reported
    events:
      - type: disconnect_nodes
        type_selector: amplifier
        count_per_network: 1
      - type: wait_node_connectivity
        type_selector: amplifier
        count_per_network: 1
        connectivity: Offline
        seconds: 120
    checks:
      - type: site_node_counts_equals
        sites: all
        total: 3
        online: 2
        offline: 1
        timeout_seconds: 120
        immediate: true

  - name: offline_actions_unavailable_with_reasons
    events:
      - type: disconnect_nodes
        type_selector: tower
        count_per_network: 1
      - type: disconnect_nodes
        type_selector: controller
        count_per_network: 1
      - type: wait_node_connectivity
        nodes: all
        connectivity: Offline
        seconds: 120
    checks:
      - type: site_operation_status_equals
        sites: all
        restart_available: false
        rf_available: false
        service_available: false
        restart_reason: present
        rf_reason: present
        service_reason: present
        timeout_seconds: 120
        immediate: true

  - name: restore_site_before_restart
    events:
      - type: reconnect_nodes
        nodes: all
      - type: wait_node_connectivity
        nodes: all
        connectivity: Online
        seconds: 180
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        restart_available: true
        timeout_seconds: 300
        immediate: true

  - name: restart_controller_and_verify_busy_reasons
    events:
      - type: restart_nodes
        type_selector: controller
        count_per_network: 1
    checks:
      - type: site_operation_status_equals
        sites: all
        busy: true
        restart_available: false
        rf_available: false
        service_available: false
        restart_reason: present
        rf_reason: present
        service_reason: present
        timeout_seconds: 60
        immediate: true

  - name: wait_for_restart_completion
    events:
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Offline
        seconds: 120
      - type: wait_node_connectivity
        type_selector: controller
        count_per_network: 1
        connectivity: Online
        seconds: 300
    checks:
      - type: node_status_equals
        nodes: all
        connectivity: Online
        state: Operational
        timeout_seconds: 300
        immediate: true
      - type: site_operation_status_equals
        sites: all
        busy: false
        timeout_seconds: 300
        immediate: true
