entity: node
states: [inventory, installed, maintenance, released, retired]
actions:
  - name: restart
    event: restart_nodes
    selector: tower
    from: [installed]
    to: installed
    blocked_from: [retired]
    checks: [backend_count]
    priority: p1
  - name: read
    event: check
    from: [installed]
    to: installed
    blocked_from: [retired]
    checks: [backend_count]
    priority: p2
