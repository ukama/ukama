[build-from]
	base="alpine"
	version="latest"

[build-compile]
	version="latest"
	static="false"
	source="/nodes/apps/service-watchdog"
	cmd="make"
	bin_from="/nodes/apps/service-watchdog/service-watchdog"
	bin_to="/sbin"

[app-exec]
	name="service-watchdog"
	version="latest"
	bin="service-watchdog"
	path="/sbin"
	autostart="false"
	autorestart="true"
	startretries=5
	group="service"
	readiness=true
