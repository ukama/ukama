[build-from]
    base="alpine"
    version="latest"

[build-compile]
    version="0.1"
    static="false"
    source="/nodes/ukamaOS/distro/system/deviced"
    cmd="make"
    bin_from="/nodes/ukamaOS/distro/system/deviced/device.d"
    bin_to="/sbin"

[app-exec]
    name="device-client"
    service="device-client"
    version="latest"
    bin="device.d"
    path="/sbin"
    args="--client-mode"
    autostart="false"
    autorestart="true"
    startretries=5
    readiness=true
    group="on-boot"
