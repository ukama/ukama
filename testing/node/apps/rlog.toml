[build-from]
        base="alpine"
        version="latest"

[build-compile]
	version="0.1"
	static="false"
	source="/nodes/ukamaOS/distro/system/rlog"
	cmd="make"
	bin_from="/nodes/ukamaOS/distro/system/rlog/rlog.d"
	bin_to="/sbin"

[build-misc]
        from="/nodes/ukamaOS/distro/system/rlog/ukama-log"
        to="/sbin"

[app-exec]
	name="rlog"
	version="latest"
	bin="rlog.d"
	path="/sbin"
       	autostart="false"
        autorestart="true"
        startretries=5
        group="service"

[app-exec.env]
	RLOG_LOG_LEVEL="debug"
	RLOG_LOG_DIR="/ukama/logs"
	RLOG_INGEST_SOCKET="/run/ukama/rlog-ingest.sock"
	RLOG_ROTATE_BYTES="16777216"
	RLOG_ROTATE_SECONDS="3600"
	RLOG_RETAIN_BYTES="134217728"
	RLOG_RETAIN_DAYS="7"
	RLOG_BINDING_IP="127.0.0.1"
