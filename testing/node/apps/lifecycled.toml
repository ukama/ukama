[build-from]
	base="alpine"
	version="latest"

[build-compile]
	version="0.1"
	static="false"
	source="/nodes/ukamaOS/distro/system/lifecycled"
	cmd="make"
	bin_from="/nodes/ukamaOS/distro/system/lifecycled/lifecycle.d"
	bin_to="/sbin"

[app-exec]
	name="lifecycled"
	service="lifecycle"
	version="latest"
	bin="lifecycle.d"
	path="/sbin"
	autostart="false"
	autorestart="true"
	startretries=5
	group="on-boot"
